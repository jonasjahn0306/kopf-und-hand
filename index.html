/* ================= Spielgerüst ================= */

let run = null;              // aktueller Durchgang
const sitzungStart = Date.now();   // für den Pausenhinweis

/* Jede Übung hat eine Anleitung. Sie kommt vor dem ersten Durchgang —
   oder vor jedem, wenn das in den Einstellungen so gewählt ist. Danach
   ist sie über den Fragezeichen-Knopf jederzeit erreichbar, auch mitten
   im Spiel, ohne den Durchgang abzubrechen. */
function zeigeRegeln(game, level, ausRunde) {
  setAkzent(game.farbe);
  const v = screen(game.name, ausRunde ? showHome : () => chooseLevel(game), game);
  $("#hilfebtn").hidden = true;      // die Anleitung steht ja schon da
  if (ausRunde && runde) v.append(rundenLeiste());
  const box = el("div", "regeln");
  box.append(el("h2", null, "So wird gespielt"));
  const ol = el("ol");
  game.regeln.forEach(r => ol.append(el("li", null, r)));
  box.append(ol);
  if (game.merksatz) box.append(el("p", "merksatz", game.merksatz));
  const los = el("button", "btn primary", "Los geht's");
  los.addEventListener("click", () => {
    store.gesehen[game.id] = true; save();
    startRun(game, level, ausRunde);
  });
  box.append(los);
  v.append(box);
}

/* ================= Tagesrunde =================
   Die Leitlinien sprechen von mindestens zehn Sitzungen — wirksam ist
   also die Regelmäßigkeit, nicht die Auswahl. Siebzehn Kacheln sind für
   jemanden mit kognitiver Einschränkung aber keine Freiheit, sondern
   eine Hürde: Viele nehmen immer dieselben zwei. Die Tagesrunde stellt
   deshalb selbst zusammen und schlägt auch die Stufe vor. */

const RUNDENLAENGE = 3;
let runde = null;      // { spiele:[{game,level}], index:0 }

/* Die laufende Runde wird gespeichert. Wer zwischendurch „Zurück“
   tippt oder die App schließt, findet sie am selben Tag auf der
   Startseite wieder, statt neu anfangen zu müssen. */
function rundeSpeichern() {
  store.runde = runde
    ? { datum: heuteAlsText(), ids: runde.spiele.map(x => x.game.id),
        stufen: runde.spiele.map(x => x.level), index: runde.index }
    : null;
  // Nur die letzten Wochen behalten, sonst wächst der Speicher endlos
  const tage = Object.keys(store.rundenFertig).sort();
  tage.slice(0, Math.max(0, tage.length - 60)).forEach(t => delete store.rundenFertig[t]);
  save();
}
function rundeLaden() {
  const r = store.runde;
  runde = null;
  if (!r || r.datum !== heuteAlsText()) { store.runde = null; return; }
  const spiele = r.ids.map((id, i) => ({ game: GAMES.find(g => g.id === id), level: r.stufen[i] }));
  const gueltig = spiele.every(x => x.game && (store.sprache || !x.game.sprachlastig));
  if (!gueltig || r.index >= spiele.length) { store.runde = null; return; }
  runde = { spiele, index: r.index };
}
function rundenHeute() { return store.rundenFertig[heuteAlsText()] || 0; }

/** Zeigt über der Übung, wo man in der Runde steht. */
function rundenLeiste() {
  const l = el("div", "rundenleiste");
  l.append(el("span", null, "Heutige Runde · Übung " + (runde.index + 1) + " von " + runde.spiele.length));
  const punkte = el("span", "punkte");
  punkte.setAttribute("aria-hidden", "true");
  runde.spiele.forEach((_, i) =>
    punkte.append(el("i", i < runde.index ? "fertig" : i === runde.index ? "jetzt" : "")));
  l.append(punkte);
  return l;
}

/** Welche Stufe passt heute? Aus dem Verlauf der letzten Versuche. */
function vorgeschlageneStufe(game) {
  const frueher = store.log.filter(r => r.spiel === game.name);
  if (!frueher.length) return 0;
  const letzte = frueher[0];
  let stufe = LEVELS.indexOf(letzte.stufe);
  if (stufe < 0) stufe = 0;
  if (letzte.fehler === 0 && stufe < 2) stufe++;        // lief glatt → eine höher
  else if (letzte.fehler >= 6 && stufe > 0) stufe--;    // zäh → eine zurück
  return stufe;
}

function verfuegbareSpiele() {
  return GAMES.filter(g => store.sprache || !g.sprachlastig);
}

/** Drei Übungen aus verschiedenen Bereichen, möglichst nicht wie gestern. */
function stelleRundeZusammen() {
  const pool = verfuegbareSpiele();
  const bereiche = shuffle([...new Set(pool.map(g => g.art))]);
  const gewaehlt = [];
  for (const bereich of bereiche) {
    if (gewaehlt.length >= RUNDENLAENGE) break;
    const drin = pool.filter(g => g.art === bereich);
    const frisch = drin.filter(g => !store.letzteRunde.includes(g.id));
    const nimm = pick(frisch.length ? frisch : drin);
    if (nimm) gewaehlt.push(nimm);
  }
  // Falls zu wenige Bereiche übrig sind, mit beliebigen auffüllen
  while (gewaehlt.length < RUNDENLAENGE && gewaehlt.length < pool.length) {
    const rest = pool.filter(g => !gewaehlt.includes(g));
    if (!rest.length) break;
    gewaehlt.push(pick(rest));
  }
  return gewaehlt.map(g => ({ game: g, level: vorgeschlageneStufe(g) }));
}

function zeigeRunde() {
  setAkzent("gruen");
  const v = screen("Heutige Runde", showHome);
  const spiele = stelleRundeZusammen();
  const box = el("div", "regeln");
  box.append(el("h2", null, "Ihre Runde für heute"));
  box.append(el("p", "fliess", "Drei Übungen aus verschiedenen Bereichen, etwa zehn Minuten. "
    + "Die Stufe ist nach Ihren letzten Versuchen vorgeschlagen — Sie können jederzeit abbrechen."));
  const ol = el("ol");
  spiele.forEach(({ game, level }) => {
    const li = el("li");
    li.append(el("b", null, game.name));
    li.append(document.createTextNode(" — " + LEVELS[level] + ". " + game.trainiert + "."));
    ol.append(li);
  });
  box.append(ol);

  const los = el("button", "btn primary", "Runde beginnen");
  los.addEventListener("click", () => {
    runde = { spiele, index: 0 };
    store.letzteRunde = spiele.map(x => x.game.id);
    rundeSpeichern();
    naechsteAusRunde();
  });
  const anders = el("button", "btn", "Andere Zusammenstellung");
  anders.addEventListener("click", zeigeRunde);
  const selbst = el("button", "btn", "Lieber selbst aussuchen");
  selbst.addEventListener("click", showHome);
  box.append(los, anders, selbst);
  v.append(box);
}

function naechsteAusRunde() {
  if (!runde || runde.index >= runde.spiele.length) { runde = null; rundeSpeichern(); showHome(); return; }
  const { game, level } = runde.spiele[runde.index];
  brauchtAnleitung(game) ? zeigeRegeln(game, level, true) : startRun(game, level, true);
}

/** Anleitung beim ersten Mal — oder immer, wenn so eingestellt. */
function brauchtAnleitung(game) {
  return store.anleitung === "immer" || !store.gesehen[game.id];
}

function startRun(game, level, ausRunde) {
  setAkzent(game.farbe);
  /* Nur ein Durchgang, der wirklich aus der Runde gestartet wurde,
     setzt sie am Ende fort. Vorher reichte es, dass irgendwo eine
     Runde offen war — wer sie mit „Zurück“ verließ und eine Übung
     von Hand wählte, bekam trotzdem „Weiter mit …“ angeboten. */
  run = { game, level, fehler: 0, streak: 0, t0: Date.now(), ergebnis: null,
          ausRunde: !!(ausRunde && runde) };
  const v = screen(game.name, run.ausRunde ? showHome : () => chooseLevel(game), game);
  if (run.ausRunde) v.append(rundenLeiste());
  const stage = el("div", "stage");
  v.append(stage);
  game.run(stage, level);
}

/** Fortschrittsanzeige; gibt eine set(n)-Funktion zurück. */
function progressBar(parent, total, wort = "geschafft") {
  const wrap = el("div", "progress");
  const track = el("div", "track"), fill = el("div", "fill");
  const num = el("div", "num", "0 von " + total);
  track.append(fill); wrap.append(track, num);
  parent.append(wrap);
  return n => {
    fill.style.width = Math.round(n / total * 100) + "%";
    num.textContent = n + " von " + total + " " + wort;
  };
}

function promptText(parent, text, hint) {
  const p = el("div", "prompt", text);
  if (hint) p.append(el("small", null, hint));
  parent.append(p);
  return p;
}

function fehler(node) {
  run.fehler++; run.streak++;
  sndNope();
  if (node) { node.classList.remove("wrong"); void node.offsetWidth; node.classList.add("wrong"); }
}
function richtig() { run.streak = 0; sndGood(); }

/** Nach zwei Fehlern in Folge unauffällig helfen. */
function maybeHint(getNode) {
  if (run.streak < 2) return;
  const n = getNode();
  if (n) n.classList.add("hint");
}

function heuteAlsText() { return alsText(new Date()); }

function finish() {
  const g = run.game;
  const heute = heuteAlsText();
  store.gesamt++;
  store.tage[heute] = (store.tage[heute] || 0) + 1;
  store.log.unshift({
    d: heute,
    id: g.id,           // Namen haben sich geändert, die Kennung nicht
    spiel: g.name,
    stufe: LEVELS[run.level],
    fehler: run.fehler,
    sek: Math.round((Date.now() - run.t0) / 1000),
    // Manche Übungen liefern eine Zahl, die mehr sagt als Fehler und
    // Dauer — etwa die erreichte Merkspanne. Die ist für ein Arzt-
    // oder Therapiegespräch das Aussagekräftigste, was die App hat.
    wert: run.ergebnis ? run.ergebnis.wert : null,
    einheit: run.ergebnis ? run.ergebnis.einheit : null
  });
  // Lang genug für einen Bericht über ein Vierteljahr auch bei täglichem Üben
  store.log = store.log.slice(0, 1500);
  save(); applySettings();
  sndDone();

  const v = screen(g.name, showHome);
  const box = el("div", "done-screen");

  const haken = el("div", "haken");
  haken.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" '
    + 'stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg>';
  box.append(haken);

  box.append(el("h2", null, pick(["Geschafft.", "Fertig.", "Alles gelöst.", "Das war's."])));

  /* Sachliche Rückmeldung statt Lob: was heute und diese Woche
     zusammengekommen ist. Beides kann nur wachsen. */
  const heuteZahl = store.tage[heute] || 1;
  const tageWoche = tageInDenLetzten(7);
  const zeilen = [];
  zeilen.push(heuteZahl === 1
    ? "Ihre erste Übung heute."
    : "Ihre " + heuteZahl + ". Übung heute.");
  zeilen.push(tageWoche === 1
    ? "In den letzten sieben Tagen an einem Tag geübt."
    : "In den letzten sieben Tagen an " + tageWoche + " Tagen geübt.");
  box.append(el("p", null, zeilen.join(" ")));

  if (run.ergebnis) {
    const e = el("p", "merksatz");
    e.style.maxWidth = "24rem";
    e.style.margin = "0 auto 1.6rem";
    e.textContent = run.ergebnis.text;
    box.append(e);
  }

  /* Erschöpfung nach einem Schlaganfall wird regelmäßig unterschätzt.
     Nach einer längeren Sitzung deshalb ein Hinweis — eine Bitte, kein
     Verbot, und ohne jeden Vorwurf. */
  const minuten = Math.round((Date.now() - sitzungStart) / 60000);
  if (minuten >= 20) {
    const pause = el("p", "merksatz");
    pause.style.maxWidth = "26rem";
    pause.style.margin = "0 auto 1.6rem";
    pause.textContent = "Sie üben seit etwa " + minuten + " Minuten. "
      + "Eine Pause ist keine Niederlage — morgen ein wenig ist mehr wert als heute viel.";
    box.append(pause);
  }

  if (run.ausRunde && runde) {
    runde.index++;
    const offen = runde.spiele.length - runde.index;
    if (offen > 0) {
      rundeSpeichern();
      const naechstes = runde.spiele[runde.index].game;
      box.append(el("p", null, "Noch " + offen
        + (offen === 1 ? " Übung" : " Übungen") + " in dieser Runde."));
      const w = el("button", "btn primary", "Weiter mit „" + naechstes.name + "“");
      w.addEventListener("click", naechsteAusRunde);
      const stop = el("button", "btn", "Für heute genug");
      stop.addEventListener("click", () => { runde = null; rundeSpeichern(); showHome(); });
      box.append(w, stop);
      v.append(box);
      return;
    }
    runde = null;
    store.rundenFertig[heute] = (store.rundenFertig[heute] || 0) + 1;
    rundeSpeichern();
    box.append(el("p", null, "Die Runde für heute ist vollständig."));
    const fertig = el("button", "btn primary", "Meine Übungen ansehen");
    fertig.addEventListener("click", showKalender);
    const mehr = el("button", "btn", "Noch eine Übung");
    mehr.addEventListener("click", showHome);
    box.append(fertig, mehr);
    v.append(box);
    return;
  }

  const again = el("button", "btn primary", "Noch einmal");
  again.addEventListener("click", () => startRun(g, run.level));
  const other = el("button", "btn", "Andere Übung wählen");
  other.addEventListener("click", showHome);
  const kal = el("button", "btn", "Meine Übungen ansehen");
  kal.addEventListener("click", showKalender);
  box.append(again, other, kal);
  v.append(box);
}

/* ================= 1. Bilderpaare ================= */

const MEM_BILDER = [
  "🍎","🐕","🌻","🚗","☕","🔑","🏠","🐈","🌳","⭐","👓","🎩","🍞","🕰️","☂️","🚲",
  "🦋","🍐","🌙","🍄","🎈","🐟","🧦","🕯️","🍊","🚌","🌺","🎸","🧸","🍇","🐝","🦉",
  "🍋","🚂","🐇","🌷","🧢","🥕"
];

function playMemory(stage, level) {
  const paare = [4, 10, 15][level];
  /* Auf schmalen Geräten lieber mehr Reihen als mehr Spalten: sechs
     Spalten ergäben bei großer Schrift Karten unter der Mindestgröße
     für sicheres Treffen. */
  const schmal = window.innerWidth < 560;
  const spalten = [schmal ? 4 : 4, schmal ? 4 : 5, schmal ? 5 : 6][level];
  // Aufdeckhilfe (nur wenn in den Einstellungen eingeschaltet):
  // nach so vielen Fehlgriffen in Folge kurz alle Karten zeigen
  const hilfeAb = [3, 4, 6][level];
  const setProgress = progressBar(stage, paare, "Paare");
  const p = promptText(stage, "Finden Sie die gleichen Bilder.", "Tippen Sie zwei Karten an.");

  const bilder = frischeAuswahl("memory", MEM_BILDER, paare);
  const deck = shuffle([...bilder, ...bilder]);

  const grid = el("div", "memgrid");
  grid.style.gridTemplateColumns = "repeat(" + spalten + ", 1fr)";
  stage.append(grid);

  let offen = [], gefunden = 0, sperre = false;

  deck.forEach(bild => {
    const c = el("button", "card");
    c.dataset.bild = bild;
    c.setAttribute("aria-label", "Karte umdrehen");
    c.innerHTML = '<span class="inner"><span class="face back">?</span><span class="face front"></span></span>';
    $(".front", c).textContent = bild;
    c.addEventListener("click", () => {
      if (sperre || c.classList.contains("open") || c.classList.contains("done")) return;
      c.classList.add("open");
      tone(520, .09, "sine", .09);
      offen.push(c);
      if (offen.length < 2) return;

      sperre = true;
      const [a, b] = offen;
      if (a.dataset.bild === b.dataset.bild) {
        setTimeout(() => {
          a.classList.add("done"); b.classList.add("done");
          a.classList.remove("open"); b.classList.remove("open");
          gefunden++; setProgress(gefunden); richtig();
          offen = []; sperre = false;
          if (gefunden === paare) setTimeout(finish, 700);
        }, 380);
      } else {
        run.fehler++; run.streak++;
        setTimeout(() => {
          a.classList.remove("open"); b.classList.remove("open");
          offen = []; sperre = false;
          if (store.memoryHilfe && run.streak >= hilfeAb) {
            run.streak = 0;
            const zu = [...grid.querySelectorAll(".card:not(.done)")];
            zu.forEach(k => k.classList.add("open"));
            sperre = true;
            const vorher = p.innerHTML;
            p.textContent = "Schauen Sie genau hin.";
            p.append(el("small", null, "Gleich drehen sich die Karten wieder um."));
            setTimeout(() => {
              zu.forEach(k => k.classList.remove("open")); sperre = false;
              if (document.body.contains(p)) p.innerHTML = vorher;
            }, 1600);
          }
        }, 1300);
      }
    });
    grid.append(c);
  });
  setProgress(0);
}

/* ================= 2. Domino ================= */

/* Bis Doppel-Sechs sind die Muster vertraut und werden auf einen Blick
   erkannt. Sieben bis Neun muss man wirklich zählen — genau das macht
   die schwerste Stufe schwer. */
const PIP_POS = {
  0: [], 1: ["2/2"], 2: ["1/1","3/3"], 3: ["1/1","2/2","3/3"],
  4: ["1/1","1/3","3/1","3/3"], 5: ["1/1","1/3","2/2","3/1","3/3"],
  6: ["1/1","1/3","2/1","2/3","3/1","3/3"],
  7: ["1/1","1/3","2/1","2/2","2/3","3/1","3/3"],
  8: ["1/1","1/2","1/3","2/1","2/2","2/3","3/1","3/3"],
  9: ["1/1","1/2","1/3","2/1","2/2","2/3","3/1","3/2","3/3"]
};
function dominoNode(a, b, klick) {
  const d = el(klick ? "button" : "div", "dom" + (klick ? "" : " laid"));
  d.setAttribute("aria-label", "Domino " + a + " und " + b);
  [a, b].forEach(v => {
    const h = el("div", "half");
    PIP_POS[v].forEach(p => {
      const [r, c] = p.split("/");
      const pip = el("div", "pip");
      pip.style.gridArea = r + "/" + c;
      h.append(pip);
    });
    d.append(h);
  });
  return d;
}

/* Aus dem Zuordnen wird ein Legespiel: Alle Steine der Hand müssen an
   eine Kette mit ZWEI offenen Enden. Wer unbedacht anlegt, verbaut sich
   das passende Ende — also muss man vorausdenken statt nur vergleichen.
   Die Kette wird rückwärts erzeugt, damit sie garantiert lösbar ist. */

function macheKette(handGr, maxWert) {
  const folge = [];
  let b = rint(0, maxWert);
  folge.push([rint(0, maxWert), b]);
  for (let i = 0; i < handGr; i++) {
    const c = rint(0, maxWert);
    folge.push([b, c]);
    b = c;
  }
  return folge;                      // [0] liegt schon, der Rest ist die Hand
}

function playDomino(stage, level) {
  const maxWert = [4, 6, 6][level];
  const handGr = [4, 6, 8][level];
  const ketten = 3;
  const gesamt = ketten * handGr;

  const setProgress = progressBar(stage, gesamt, "Steine gelegt");
  const p = promptText(stage, "", " ");

  const zeile = el("div", "kettenzeile");
  const links = el("button", "endzone");
  const rechts = el("button", "endzone");
  const reihe = el("div", "domrow");
  zeile.append(links, reihe, rechts);

  const zurueck = el("button", "zuruecknehmen", "Letzten Stein zurücknehmen");
  const hand = el("div", "domhand");
  stage.append(zeile, zurueck, hand);

  let kette = [], steine = [], verlauf = [], gewaehlt = null;
  let gelegt = 0, kettenNr = 0;

  const linksWert = () => kette[0][0];
  const rechtsWert = () => kette[kette.length - 1][1];
  const passt = (st, wert) => st[0] === wert || st[1] === wert;

  function neueKette() {
    const folge = macheKette(handGr, maxWert);
    kette = [folge[0]];
    steine = shuffle(folge.slice(1).map(st => Math.random() < .5 ? st : [st[1], st[0]]));
    verlauf = []; gewaehlt = null;
    kettenNr++;
    zeichne();
  }

  function zeichne() {
    // Kette
    reihe.innerHTML = "";
    kette.forEach(([a, b]) => reihe.append(dominoNode(a, b, false)));
    const st = gewaehlt == null ? null : steine[gewaehlt];
    /* Das offene Ende wird als Augenbild gezeigt, nicht als Ziffer:
       Dann heißt die Aufgabe sichtbar „gleiches Muster suchen“ statt
       „Zahl im Kopf vergleichen“. */
    [[links, linksWert()], [rechts, rechtsWert()]].forEach(([zone, wert]) => {
      zone.innerHTML = "";
      const augen = el("div", "augen");
      PIP_POS[wert].forEach(pos => {
        const [r, c] = pos.split("/");
        const pip = el("div", "pip");
        pip.style.gridArea = r + "/" + c;
        augen.append(pip);
      });
      const passend = !!st && passt(st, wert);
      zone.append(augen, el("div", "wort", passend ? "anlegen" : String(wert)));
      zone.classList.toggle("aktiv", passend);
      zone.setAttribute("aria-label", "Offenes Ende mit " + wert
        + (passend ? " — hier anlegen" : ""));
    });

    // Hand
    hand.innerHTML = "";
    steine.forEach(([a, b], k) => {
      const d = dominoNode(a, b, true);
      if (k === gewaehlt) d.classList.add("gewaehlt");
      d.addEventListener("click", () => {
        gewaehlt = (gewaehlt === k) ? null : k;
        zeichne();
      });
      hand.append(d);
    });

    zurueck.hidden = verlauf.length === 0;
    text();
  }

  function text() {
    const st = gewaehlt == null ? null : steine[gewaehlt];
    p.innerHTML = "";
    if (steine.length === 0) {
      p.append(document.createTextNode("Kette fertig."));
      p.append(el("small", null, "Gleich kommt die nächste."));
      return;
    }
    const festgefahren = !steine.some(x => passt(x, linksWert()) || passt(x, rechtsWert()));
    if (festgefahren) {
      p.append(document.createTextNode("Kein Stein passt mehr."));
      p.append(el("small", null, "Nehmen Sie den letzten Stein zurück und legen Sie ihn anders an."));
      return;
    }
    if (!st) {
      p.append(document.createTextNode("Legen Sie alle Steine an die Kette."));
      p.append(el("small", null, "Kette " + kettenNr + " von " + ketten
        + " — noch " + steine.length + (steine.length === 1 ? " Stein" : " Steine")
        + ". Erst einen Stein antippen, dann ein Ende."));
      return;
    }
    const wohin = [];
    if (passt(st, linksWert())) wohin.push("links");
    if (passt(st, rechtsWert())) wohin.push("rechts");
    p.append(document.createTextNode(wohin.length
      ? "Wohin damit?"
      : "Dieser Stein passt an kein Ende."));
    p.append(el("small", null, wohin.length
      ? "Das passende Ende ist hervorgehoben."
      : "Tippen Sie einen anderen Stein an."));
  }

  function lege(seite) {
    if (gewaehlt == null) return;
    const st = steine[gewaehlt];
    const wert = seite === "links" ? linksWert() : rechtsWert();
    if (!passt(st, wert)) { fehler(seite === "links" ? links : rechts); return; }

    if (seite === "links") {
      kette.unshift(st[1] === wert ? [st[0], st[1]] : [st[1], st[0]]);
    } else {
      kette.push(st[0] === wert ? [st[0], st[1]] : [st[1], st[0]]);
    }
    verlauf.push({ seite, stein: st });
    steine.splice(gewaehlt, 1);
    gewaehlt = null;
    richtig();
    gelegt++; setProgress(gelegt);

    if (steine.length === 0) {
      zeichne();
      if (kettenNr >= ketten) { setTimeout(finish, 750); return; }
      setTimeout(() => { if (run && run.game.id === "domino") neueKette(); }, 1100);
      return;
    }
    zeichne();
  }

  links.addEventListener("click", () => lege("links"));
  rechts.addEventListener("click", () => lege("rechts"));

  zurueck.addEventListener("click", () => {
    const letzt = verlauf.pop();
    if (!letzt) return;
    if (letzt.seite === "links") kette.shift(); else kette.pop();
    steine.push(letzt.stein);
    gelegt = Math.max(0, gelegt - 1); setProgress(gelegt);
    gewaehlt = null;
    tone(300, .1, "sine", .09);
    zeichne();
  });

  setProgress(0);
  neueKette();
}

function playSpruch(stage, level) {
  const runden = 8;
  const anzahl = [3, 5, 6][level];
  const setProgress = progressBar(stage, runden, "gelöst");
  promptText(stage,
    level === 2 ? "Wie fängt dieses Sprichwort an?" : "Wie geht der Satz weiter?",
    level === 2 ? "Tippen Sie den passenden Anfang an." : "Tippen Sie das passende Wort an.");

  const satz = el("div", "saying");
  const words = el("div", "words");
  stage.append(satz, words);

  const pool = frischeAuswahl("spruch", SPRUECHE, runden);
  let i = 0;

  function rundeRueckwaerts(anfang, loesung) {
    satz.innerHTML = "";
    const gap = el("span", "gap", "…");
    satz.append(gap);
    satz.append(document.createTextNode(" " + loesung + "."));

    // Die falschen Anfänge stammen aus anderen Sprichwörtern
    const fremd = shuffle(SPRUECHE.map(x => x[0]).filter(a => a !== anfang));
    const opts = shuffle([anfang, ...fremd.slice(0, anzahl - 1)]);
    words.innerHTML = "";
    opts.forEach(a => {
      const b = el("button", "word", a);
      b.style.fontSize = "1.05rem";
      b.addEventListener("click", () => {
        if (a !== anfang) {
          fehler(b);
          maybeHint(() => [...words.children].find(x => x.textContent === anfang));
          return;
        }
        richtig();
        gap.textContent = anfang;
        gap.style.whiteSpace = "normal";
        b.classList.add("ok");
        [...words.children].forEach(x => x.disabled = true);
        i++; setProgress(i);
        setTimeout(() => { i >= runden ? finish() : runde(); }, 1300);
      });
      words.append(b);
    });
  }

  function runde() {
    const [anfang, loesung, falsch] = pool[i];

    /* Stufe 3 dreht die Aufgabe um: das Ende steht da, der Anfang wird
       gesucht. Vorwärts läuft der Abruf fast von selbst — rückwärts
       muss man die Redewendung wirklich aufrufen und prüfen. */
    if (level === 2) return rundeRueckwaerts(anfang, loesung);

    satz.innerHTML = "";
    satz.append(document.createTextNode(anfang + " "));
    const gap = el("span", "gap", " ");
    satz.append(gap);

    /* Die mitgelieferten falschen Wörter sind bewusst harmlos. Ab Stufe 2
       werden sie mit Lösungen ANDERER Sprichwörter aufgefüllt — lauter
       Wörter, die in einer Redewendung stehen könnten. Damit hilft das
       Sprachgefühl allein nicht mehr weiter, man muss den Spruch wirklich
       kennen. */
    let ablenker = shuffle(falsch.slice());
    if (level >= 1) {
      /* Nur Wörter derselben grammatischen Gestalt: Ein Verb neben einem
         Hauptwort („Liebe geht durch den rostet") schließt sich von
         selbst aus und wäre ein geschenkter Treffer. Groß- gegen
         Kleinschreibung ist im Deutschen dafür ein brauchbarer Test. */
      const istHauptwort = w => /^[A-ZÄÖÜ]/.test(w);
      const gestalt = istHauptwort(loesung);
      const fremd = shuffle(SPRUECHE.map(x => x[1]).filter(w =>
        w !== loesung && !falsch.includes(w) && istHauptwort(w) === gestalt
        && w.split(" ").length === loesung.split(" ").length));
      const anteil = level === 1 ? 2 : 4;
      ablenker = shuffle([...fremd.slice(0, anteil), ...ablenker]);
    }
    const opts = shuffle([loesung, ...ablenker.slice(0, anzahl - 1)]);
    words.innerHTML = "";
    opts.forEach(w => {
      const b = el("button", "word", w);
      b.addEventListener("click", () => {
        if (w !== loesung) {
          fehler(b);
          maybeHint(() => [...words.children].find(x => x.textContent === loesung));
          return;
        }
        richtig();
        gap.textContent = loesung;
        b.classList.add("ok");
        [...words.children].forEach(x => x.disabled = true);
        i++; setProgress(i);
        setTimeout(() => { i >= runden ? finish() : runde(); }, 1100);
      });
      words.append(b);
    });
  }
  runde(); setProgress(0);
}

/* Für die schwerste Stufe: aus welcher Nachbarkategorie darf der
   Ausreißer kommen? Nur eindeutige Paare — bei „Obst gegen Gemüse"
   etwa nie die Tomate, sonst wird die Aufgabe strittig statt schwer. */
const NACHBARN = {
  "Obst":            ["Gemüse"],
  "Gemüse":          ["Obst"],
  "Backwaren":       ["Süßigkeiten"],
  "Süßigkeiten":     ["Backwaren"],
  "Vögel":           ["Meerestiere", "Insekten"],
  "Meerestiere":     ["Vögel", "Insekten"],
  "Insekten":        ["Vögel", "Meerestiere"],
  "Tiere":           ["Vögel", "Meerestiere"],
  "Kleidung":        ["Schmuck"],
  "Schmuck":         ["Kleidung"],
  "Wetter":          ["Am Himmel"],
  "Am Himmel":       ["Wetter"],
  "Musikinstrumente":["Spielzeug"],
  "Sport":           ["Spielzeug"],
  "Geschirr":        ["Küchengeräte"],
  "Küchengeräte":    ["Geschirr"],
  "Getränke":        ["Geschirr"],
  "Möbel":           ["Dinge im Bad"],
  "Dinge im Bad":    ["Möbel"],
  "Werkzeuge":       ["Dinge im Büro"],
  "Dinge im Büro":   ["Werkzeuge"],
  "Fahrzeuge":       ["Am Himmel"],
  "Körperteile":     ["Kleidung"],
  "Winter":          ["Sport"],
  "Dinge im Wald":   ["Blumen"],
  "Blumen":          ["Dinge im Wald"],
  "Spielzeug":       ["Sport", "Musikinstrumente"]
};
const STRITTIG = ["Tomate"];   // taugt nie als Ausreißer

function playOdd(stage, level) {
  const runden = 8;
  const anzahl = [4, 6, 7][level];
  const setProgress = progressBar(stage, runden, "gelöst");
  const p = promptText(stage, "Was passt hier nicht dazu?", "Tippen Sie das eine Bild an, das nicht zu den anderen gehört.");

  const words = el("div", "words");
  stage.append(words);
  let i = 0;

  // Genug Gruppen für den ganzen Durchgang, jede höchstens einmal
  const folge = frischeAuswahl("odd", GRUPPEN.filter(g => g.gut.length >= anzahl - 1), runden);

  function runde() {
    const a = folge[i % folge.length];

    /* Stufe 1 und 2 nehmen eine weit entfernte Kategorie — der Ausreißer
       springt ins Auge. Stufe 3 nimmt eine benachbarte: Obst gegen
       Gemüse, Vogel gegen Fisch. Dann muss man die Kategorie erst
       benennen, bevor man den Ausreißer sieht. */
    const nahThemen = NACHBARN[a.thema] || [];
    let b = null;
    if (level === 2 && nahThemen.length) {
      const kandidaten = GRUPPEN.filter(g => nahThemen.includes(g.thema));
      if (kandidaten.length) b = pick(kandidaten);
    }
    if (!b) {
      b = pick(GRUPPEN);
      let schutz = 0;
      while ((b.thema === a.thema || nahThemen.includes(b.thema)) && schutz++ < 40) b = pick(GRUPPEN);
    }

    const passend = shuffle(a.gut.slice()).slice(0, Math.min(anzahl - 1, a.gut.length));
    // Der Ausreißer darf nicht zufällig auch in die Zielgruppe gehören
    const namenA = a.gut.map(x => x[1]);
    const moeglich = b.gut.filter(x => !namenA.includes(x[1]) && !STRITTIG.includes(x[1]));
    const ausreisser = pick(moeglich.length ? moeglich : b.gut.filter(x => !namenA.includes(x[1])));
    const alle = shuffle([...passend.map(x => ({ x, odd: false })), { x: ausreisser, odd: true }]);

    p.innerHTML = "Was passt hier nicht dazu?";
    p.append(el("small", null, "Tippen Sie das eine Bild an, das nicht zu den anderen gehört."));

    words.innerHTML = "";
    alle.forEach(({ x, odd }) => {
      const b2 = el("button", "word");
      const pic = el("div", "pic", x[0]);
      b2.append(pic, el("span", null, x[1]));
      b2.addEventListener("click", () => {
        if (!odd) { fehler(b2); maybeHint(() => [...words.children][alle.findIndex(z => z.odd)]); return; }
        richtig();
        b2.classList.add("ok");
        [...words.children].forEach(z => z.disabled = true);
        p.innerHTML = "";
        p.append(document.createTextNode("Richtig — alle anderen gehören zu: " + a.thema + "."));
        i++; setProgress(i);
        setTimeout(() => { i >= runden ? finish() : runde(); }, 1500);
      });
      words.append(b2);
    });
  }
  runde(); setProgress(0);
}

/* ================= 5. Zahlenreihe ================= */

function playReihe(stage, level) {
  /* Stufe 3 ist bewusst ein anderes Spiel: abwechselnd Zahl und
     Buchstabe. Das ist die Form, die in der Neuropsychologie das
     Umschalten zwischen zwei Regeln prüft — deutlich fordernder als
     bloßes Durchzählen, weil man zwei Reihen gleichzeitig im Kopf
     behalten muss. */
  const wechsel = level === 2;
  const paare = 8;                               // nur für Stufe 3
  const n = wechsel ? paare * 2 : [6, 12][level];

  // Reihenfolge der Beschriftungen aufbauen
  const folge = [];
  if (wechsel) {
    for (let k = 0; k < paare; k++) {
      folge.push(String(k + 1));
      folge.push(String.fromCharCode(65 + k));   // A, B, C ...
    }
  } else {
    for (let k = 0; k < n; k++) folge.push(String(k + 1));
  }

  const setProgress = progressBar(stage, n, "getippt");
  const anleitung = wechsel
    ? "Abwechselnd Zahl und Buchstabe: 1, A, 2, B, 3, C …"
    : "Tippen Sie die Zahlen der Reihe nach an.";
  const p = promptText(stage, anleitung, "Als Nächstes: " + folge[0]);

  const field = el("div", "field");
  stage.append(field);
  let naechste = 0;                              // Index in folge

  // Positionen ohne Überlappung streuen
  const punkte = [];
  const groesse = [22, 15, 13][level];           // % der Feldbreite
  const abstand = groesse * 1.12;
  for (let k = 0; k < n; k++) {
    let pos, versuche = 0;
    do {
      pos = { x: rint(3, 97 - groesse), y: rint(3, 97 - groesse) };
      versuche++;
    } while (versuche < 500 && punkte.some(q => Math.hypot(q.x - pos.x, (q.y - pos.y) * .75) < abstand));
    punkte.push(pos);
  }

  punkte.forEach((pos, k) => {
    const s = el("button", "spot", folge[k]);
    s.style.cssText = `left:${pos.x}%;top:${pos.y}%;width:${groesse}%;aspect-ratio:1/1;`;
    if (k === 0) s.classList.add("next");
    s.addEventListener("click", () => {
      if (k !== naechste) {
        fehler(s);
        if (run.streak >= 2) field.children[naechste].classList.add("next");
        return;
      }
      richtig();
      s.classList.add("gone");
      setTimeout(() => { s.style.visibility = "hidden"; }, 320);
      naechste++;
      setProgress(naechste);
      if (naechste >= n) { setTimeout(finish, 650); return; }
      p.innerHTML = anleitung;
      p.append(el("small", null, "Als Nächstes: " + folge[naechste]));
    });
    field.append(s);
  });
  setProgress(0);
}

/* ================= 6. Ziele treffen ================= */

function playZiel(stage, level) {
  const n = [12, 14, 16][level];
  const groesse = [26, 17, 12][level];       // % der Feldbreite
  const tempo = [0, .5, 1.1][level];         // Wanderung des Ziels
  const stoerer = [0, 0, 3][level];          // Ablenker, die nicht gehören
  const setProgress = progressBar(stage, n, "getroffen");
  promptText(stage,
    stoerer ? "Tippen Sie nur den grünen Punkt an."
            : "Tippen Sie den Punkt an.",
    stoerer ? "Die roten Punkte gehören nicht dazu. Es läuft keine Uhr."
            : "Lassen Sie sich Zeit — es läuft keine Uhr.");

  const field = el("div", "field");
  stage.append(field);

  let treffer = 0, t = null, animation = null;

  function streuePosition() {
    return { x: rint(2, 98 - groesse), y: rint(2, 98 - groesse) };
  }

  /* Störer zwingen dazu, vor dem Tippen hinzusehen, statt blind auf
     jede Bewegung zu reagieren. Ein Fehlgriff wird nur quittiert,
     nicht bestraft. */
  function setzeStoerer() {
    field.querySelectorAll(".stoerer").forEach(x => x.remove());
    for (let k = 0; k < stoerer; k++) {
      const d = el("button", "target stoerer");
      const pos = streuePosition();
      d.style.cssText = `left:${pos.x}%;top:${pos.y}%;width:${groesse}%;aspect-ratio:1/1;`;
      d.setAttribute("aria-label", "Dieser Punkt gehört nicht dazu");
      d.addEventListener("click", () => fehler(d));
      field.append(d);
    }
  }

  function neu() {
    if (t) t.remove();
    if (stoerer) setzeStoerer();
    t = el("button", "target");
    const pos = streuePosition();
    t.style.cssText = `left:${pos.x}%;top:${pos.y}%;width:${groesse}%;aspect-ratio:1/1;`;
    t.setAttribute("aria-label", "Ziel antippen");
    t.addEventListener("click", () => {
      richtig();
      t.classList.add("gone");
      treffer++; setProgress(treffer);
      if (animation) { clearInterval(animation); animation = null; }
      if (treffer >= n) {
        setTimeout(() => { t.remove(); field.querySelectorAll(".stoerer").forEach(x => x.remove()); finish(); }, 340);
        return;
      }
      setTimeout(neu, 300);
    });
    field.append(t);

    if (tempo > 0) {
      let px = pos.x, py = pos.y;
      let dx = (Math.random() - .5) * tempo, dy = (Math.random() - .5) * tempo;
      animation = setInterval(() => {
        // Übung verlassen: Takt beenden, statt im Hintergrund Akku zu ziehen
        if (!document.body.contains(t)) { clearInterval(animation); animation = null; return; }
        px += dx; py += dy;
        if (px < 2 || px > 98 - groesse) dx *= -1;
        if (py < 2 || py > 98 - groesse) dy *= -1;
        px = Math.max(2, Math.min(98 - groesse, px));
        py = Math.max(2, Math.min(98 - groesse, py));
        t.style.left = px + "%"; t.style.top = py + "%";
      }, 40);
    }
  }
  // Fehltipp ins Leere zählt als Ungenauigkeit, hat aber keine Folge
  field.addEventListener("pointerdown", e => { if (e.target === field) run.fehler++; });
  neu(); setProgress(0);
}

/* ================= 7. Linie nachfahren ================= */

/* Die Bahn wird jedes Mal neu gewürfelt, damit die Übung nicht
   auswendig gelernt wird. Mehr Stützpunkte = engere Kurven. */
function machePfad(level) {
  const stuetzen = [3, 4, 6][level];
  const x0 = 95, x1 = 905;
  const pts = [];
  for (let i = 0; i < stuetzen; i++) {
    pts.push({ x: x0 + (x1 - x0) * i / (stuetzen - 1), y: rint(140, 460) });
  }
  // Aufeinanderfolgende Punkte auseinanderziehen, sonst wird die Bahn flach
  for (let i = 1; i < pts.length; i++) {
    if (Math.abs(pts[i].y - pts[i - 1].y) < 150) {
      pts[i].y = pts[i - 1].y < 300 ? rint(370, 460) : rint(140, 230);
    }
  }
  let d = "M " + pts[0].x + " " + pts[0].y;
  for (let i = 1; i < pts.length; i++) {
    const dx = (pts[i].x - pts[i - 1].x) * .55;
    d += " C " + (pts[i - 1].x + dx) + " " + pts[i - 1].y + ", " +
                 (pts[i].x - dx) + " " + pts[i].y + ", " +
                 pts[i].x + " " + pts[i].y;
  }
  return d;
}

function playLinie(stage, level) {
  const punkteZahl = [20, 30, 40][level];
  const bahnbreite = [54, 40, 26][level];
  /* Der erlaubte Abstand ist jetzt an die sichtbare Bahn gekoppelt:
     Wer den grauen Streifen verlässt, ist draußen — vorher durfte man
     weit daneben fahren und es zählte trotzdem. */
  const bahnRand = bahnbreite / 2 + 7;
  const rueckschritt = [1, 3, 6][level];      // verlorene Punkte beim Abkommen

  const setProgress = progressBar(stage, punkteZahl, "der Strecke");
  const p = promptText(stage, "Fahren Sie mit dem Finger der Linie entlang.", " ");

  const d = machePfad(level);
  const wrap = el("div", "tracewrap");
  wrap.innerHTML =
    '<svg viewBox="0 0 1000 600" aria-hidden="true">' +
      '<path id="spur" d="' + d + '" fill="none" stroke="var(--akzent-soft)" stroke-width="' + bahnbreite + '" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path id="spur2" d="' + d + '" fill="none" stroke="var(--akzent)" stroke-width="3" stroke-dasharray="12 14" stroke-linecap="round" opacity=".45"/>' +
      '<path id="fertig" d="' + d + '" fill="none" stroke="var(--akzent)" stroke-width="' + bahnbreite + '" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle id="marke" r="' + Math.round(bahnbreite * .46) + '" fill="var(--honey-soft)" stroke="var(--honey)" stroke-width="5"/>' +
    '</svg>';
  stage.append(wrap);

  const svg = $("svg", wrap), spur = $("#spur", wrap), fertig = $("#fertig", wrap), marke = $("#marke", wrap);
  const laenge = spur.getTotalLength();

  // Zielpunkte entlang der Strecke
  const ziele = [];
  for (let k = 0; k < punkteZahl; k++) ziele.push(spur.getPointAtLength(laenge * (k + 1) / punkteZahl));

  /* Dichtes Raster der Bahn, um den Abstand zur Linie zu messen.
     Gesucht wird nur in einem Fenster um den aktuellen Fortschritt —
     sonst würde eine weit entfernte Schleife der Bahn fälschlich als
     „drauf" gelten. */
  const RASTER = 400;
  const proben = [];
  for (let i = 0; i <= RASTER; i++) proben.push(spur.getPointAtLength(laenge * i / RASTER));

  const reichweite = laenge / punkteZahl * 1.35;   // wie weit der nächste Punkt greift

  const start = spur.getPointAtLength(0);
  fertig.style.strokeDasharray = laenge;
  fertig.style.strokeDashoffset = laenge;
  fertig.style.transition = "stroke-dashoffset .18s linear";
  marke.setAttribute("cx", start.x); marke.setAttribute("cy", start.y);

  let idx = 0, unten = false, ausrutscher = 0, draussen = false;

  function stand(zusatz) {
    p.innerHTML = "Fahren Sie mit dem Finger der Linie entlang.";
    const t = zusatz ? zusatz
      : (ausrutscher === 0
          ? "Bleiben Sie auf dem breiten Streifen. Absetzen ist erlaubt."
          : "Bleiben Sie auf dem breiten Streifen. Abgekommen: " + ausrutscher + "×");
    p.append(el("small", null, t));
  }
  stand();

  const toSvg = e => {
    const r = svg.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * 1000, y: (e.clientY - r.top) / r.height * 600 };
  };

  function abstandZurBahn(pkt) {
    const mitte = Math.round(idx / punkteZahl * RASTER);
    const von = Math.max(0, mitte - 25), bis = Math.min(RASTER, mitte + 55);
    let min = Infinity;
    for (let i = von; i <= bis; i++) {
      const dx = pkt.x - proben[i].x, dy = pkt.y - proben[i].y;
      const dist = Math.hypot(dx, dy);
      if (dist < min) min = dist;
    }
    return min;
  }

  function setzeMarke(punkt) {
    marke.setAttribute("cx", punkt.x); marke.setAttribute("cy", punkt.y);
  }

  function abgekommen() {
    draussen = true;
    unten = false;                       // absetzen und neu ansetzen
    ausrutscher++; run.fehler++; run.streak++;
    sndNope();
    idx = Math.max(0, idx - rueckschritt);
    fertig.style.strokeDashoffset = laenge - laenge * idx / punkteZahl;
    setProgress(idx);
    setzeMarke(idx === 0 ? start : ziele[idx - 1]);
    marke.setAttribute("stroke", "#B03A28");
    setTimeout(() => marke.setAttribute("stroke", "var(--honey)"), 700);
    stand("Von der Bahn abgekommen. Setzen Sie am Punkt neu an.");
  }

  function bewege(e) {
    if (!unten || idx >= punkteZahl) return;
    const pkt = toSvg(e);

    if (abstandZurBahn(pkt) > bahnRand) { abgekommen(); return; }
    if (draussen) { draussen = false; stand(); }

    // Etwas schnelleres Fahren erlauben: bis zu drei Punkte auf einmal
    for (let k = 0; k < 3 && idx < punkteZahl; k++) {
      const z = ziele[idx];
      if (Math.hypot(pkt.x - z.x, pkt.y - z.y) > reichweite) break;
      idx++;
      if (idx % 3 === 0) tone(420 + idx * 12, .06, "sine", .07);
      setzeMarke(z);
      fertig.style.strokeDashoffset = laenge - laenge * idx / punkteZahl;
      setProgress(idx);
    }
    if (idx >= punkteZahl) {
      unten = false;
      richtig();
      p.innerHTML = "Geschafft.";
      p.append(el("small", null, ausrutscher === 0
        ? "Ohne einen einzigen Ausrutscher."
        : "Abgekommen: " + ausrutscher + "×"));
      setTimeout(finish, 700);
    }
  }

  wrap.addEventListener("pointerdown", e => {
    // Nur dort ansetzen, wo man stehengeblieben ist
    const pkt = toSvg(e);
    const hier = idx === 0 ? start : ziele[idx - 1];
    if (Math.hypot(pkt.x - hier.x, pkt.y - hier.y) > bahnRand * 2.2) {
      stand("Setzen Sie am hellen Punkt an.");
      return;
    }
    unten = true; draussen = false;
    try { wrap.setPointerCapture(e.pointerId); } catch {}
    stand();
    bewege(e);
  });
  wrap.addEventListener("pointermove", bewege);
  wrap.addEventListener("pointerup", () => { unten = false; });
  wrap.addEventListener("pointercancel", () => { unten = false; });
  setProgress(0);
}

              ["Fahrzeug · im Wasser","⚓"],["Fahrzeug · an Land","🛣️"]],
      dinge:[["🐟",0],["🐬",0],["🦀",0],
             ["🐕",1],["🐈",1],["🐄",1],
             ["🚢",2],["⛵",2],["🛶",2],
             ["🚗",3],["🚌",3],["🚲",3]] }
  ]
];

function playSort(stage, level) {
  const satz = frischeAuswahl("sort" + level, SORTIER[level], 1, 2)[0];
  const dinge = shuffle(satz.dinge.slice()).slice(0, [6, 10, 12][level]);
  const setProgress = progressBar(stage, dinge.length, "einsortiert");
  promptText(stage, "Legen Sie jedes Ding in die richtige Kiste.",
    "Ziehen Sie es hinüber — oder tippen Sie erst das Ding, dann die Kiste an.");

  const tray = el("div", "tray");
  const baskets = el("div", "baskets");
  stage.append(tray, baskets);

  const kisten = satz.kisten.map(([name, sym]) => {
    const b = el("div", "basket");
    b.append(el("div", "pic", sym), el("b", null, name), el("div", "in"));
    b.tabIndex = 0;
    baskets.append(b);
    return b;
  });
  kisten.forEach(k => { $(".pic", k).style.fontSize = "2rem"; });

  let gewaehlt = null, fertigZahl = 0;

  function ablegen(item, kisteIdx) {
    const ziel = +item.dataset.ziel;
    const kiste = kisten[kisteIdx];
    if (ziel !== kisteIdx) { fehler(kiste); kiste.classList.remove("over"); return false; }
    richtig();
    $(".in", kiste).append(el("span", null, item.textContent));
    item.remove();
    kiste.classList.remove("over");
    fertigZahl++; setProgress(fertigZahl);
    if (fertigZahl >= dinge.length) setTimeout(finish, 650);
    return true;
  }

  function waehle(item) {
    if (gewaehlt) gewaehlt.classList.remove("picked");
    gewaehlt = gewaehlt === item ? null : item;
    if (gewaehlt) { gewaehlt.classList.add("picked"); tone(560, .08, "sine", .08); }
  }

  kisten.forEach((k, i) => {
    const nimm = () => { if (gewaehlt) { const g = gewaehlt; gewaehlt = null; g.classList.remove("picked"); ablegen(g, i); } };
    k.addEventListener("click", nimm);
    k.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); nimm(); } });
  });

  dinge.forEach(([sym, ziel]) => {
    const it = el("div", "item", sym);
    it.dataset.ziel = ziel;
    it.tabIndex = 0;
    it.setAttribute("role", "button");
    it.setAttribute("aria-label", "Gegenstand aufnehmen");

    let ziehen = false, moved = false, dx = 0, dy = 0;

    it.addEventListener("pointerdown", e => {
      const r = it.getBoundingClientRect();
      dx = e.clientX - r.left; dy = e.clientY - r.top;
      ziehen = true; moved = false;
      it.dataset.w = r.width; it.dataset.h = r.height;
      try { it.setPointerCapture(e.pointerId); } catch {}
    });

    it.addEventListener("pointermove", e => {
      if (!ziehen) return;
      if (!moved && Math.abs(e.movementX) + Math.abs(e.movementY) < 2) return;
      if (!moved) {
        moved = true;
        it.classList.add("dragging");
        it.style.width = it.dataset.w + "px";
        it.style.height = it.dataset.h + "px";
      }
      it.style.left = (e.clientX - dx) + "px";
      it.style.top = (e.clientY - dy) + "px";
      const unter = kisteUnter(e.clientX, e.clientY);
      kisten.forEach((k, i) => k.classList.toggle("over", i === unter));
    });

    const loslassen = e => {
      if (!ziehen) return;
      ziehen = false;
      if (!moved) { waehle(it); return; }
      it.classList.remove("dragging");
      it.style.cssText = "";
      const unter = kisteUnter(e.clientX, e.clientY);
      kisten.forEach(k => k.classList.remove("over"));
      if (unter != null) ablegen(it, unter);
    };
    it.addEventListener("pointerup", loslassen);
    it.addEventListener("pointercancel", () => {
      ziehen = false; it.classList.remove("dragging"); it.style.cssText = "";
      kisten.forEach(k => k.classList.remove("over"));
    });
    it.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); waehle(it); } });

    tray.append(it);
  });

  function kisteUnter(x, y) {
    for (let i = 0; i < kisten.length; i++) {
      const r = kisten[i].getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return i;
    }
    return null;
  }
  setProgress(0);
}

/* ================= 9. Folge merken =================
   Die Merkspanne ist der Kern kognitiver Schwierigkeit: Man muss
   etwas halten, während man nichts sieht. Deshalb wächst die Folge
   mit jedem Erfolg — und rückwärts ist sie noch einmal deutlich
   schwerer, weil das Gehaltene zusätzlich umgedreht werden muss. */

const warte = ms => new Promise(r => setTimeout(r, ms));

function playSpanne(stage, level) {
  const rueckwaerts = level === 2;
  const runden = 6;
  let laenge = [4, 6, 5][level];

  const setProgress = progressBar(stage, runden, "Folgen");
  const p = promptText(stage, "Gleich geht es los.", " ");

  const gitter = el("div", "spannegitter");
  const felder = [];
  for (let i = 0; i < 9; i++) {
    const f = el("button", "spannefeld");
    f.setAttribute("aria-label", "Feld " + (i + 1));
    gitter.append(f); felder.push(f);
  }
  stage.append(gitter);

  const meinLauf = run;
  let folge = [], eingabe = [], geloest = 0, misserfolge = 0, sperre = true;

  function sichtbar() { return run === meinLauf && document.body.contains(gitter); }

  function neueFolge() {
    folge = [];
    for (let i = 0; i < laenge; i++) {
      let k = rint(0, 8);
      if (i > 0 && k === folge[i - 1]) k = (k + 1 + rint(0, 6)) % 9;   // nie zweimal dasselbe Feld
      folge.push(k);
    }
    zeigeFolge();
  }

  let folgeLauf = 0;   // nur der jüngste Durchlauf darf weiterleuchten
  async function zeigeFolge() {
    const meiner = ++folgeLauf;
    const aktuell = () => sichtbar() && meiner === folgeLauf;
    sperre = true;
    felder.forEach(f => { f.disabled = true; f.className = "spannefeld"; });
    p.innerHTML = "Merken Sie sich die Reihenfolge.";
    p.append(el("small", null, laenge + " Felder"
      + (rueckwaerts ? " — nachher rückwärts eingeben" : "")));
    await warte(700);
    for (const k of folge) {
      if (!aktuell()) return;
      felder[k].classList.add("an");
      tone(360 + k * 55, .32, "sine", .13);
      await warte(560);
      felder[k].classList.remove("an");
      await warte(240);
    }
    if (!aktuell()) return;
    eingabe = [];
    sperre = false;
    felder.forEach(f => { f.disabled = false; });
    zeigeAufforderung();
  }

  function zeigeAufforderung() {
    p.innerHTML = rueckwaerts ? "Jetzt rückwärts nachtippen." : "Jetzt nachtippen.";
    p.append(el("small", null, eingabe.length + " von " + laenge));
  }

  felder.forEach((f, k) => {
    f.addEventListener("click", async () => {
      if (sperre) return;
      const soll = rueckwaerts ? folge[folge.length - 1 - eingabe.length] : folge[eingabe.length];
      if (k !== soll) {
        fehler(f);
        sperre = true;
        misserfolge++;
        // Nach zwei Fehlversuchen wird die Folge wieder kürzer — die
        // Übung soll fordern, nicht blockieren.
        if (misserfolge >= 2 && laenge > 2) { laenge--; misserfolge = 0; }
        await warte(900);
        if (sichtbar()) neueFolge();
        return;
      }
      f.classList.add("getippt");
      tone(360 + k * 55, .2, "sine", .1);
      eingabe.push(k);
      if (eingabe.length < laenge) { zeigeAufforderung(); return; }

      // Folge vollständig
      richtig();
      sperre = true;
      geloest++; misserfolge = 0;
      setProgress(geloest);
      // Die erreichte Spanne ist die aussagekräftigste Zahl der App
      run.ergebnis = { wert: laenge, einheit: "Felder",
                       text: "Längste Folge: " + laenge + " Felder"
                             + (rueckwaerts ? " rückwärts." : ".") };
      if (geloest >= runden) { await warte(600); if (sichtbar()) finish(); return; }
      laenge++;
      await warte(800);
      if (sichtbar()) neueFolge();
    });
  });

  // Wer mittendrin die Anleitung öffnet, verpasst sonst das Aufleuchten
  // Solange die Anleitung offen ist, leuchtet und klingt hinten nichts weiter.
  run.vorHilfe = () => { folgeLauf++; felder.forEach(f => f.classList.remove("an")); };
  run.nachHilfe = () => { if (sichtbar()) zeigeFolge(); };

  setProgress(0);
  neueFolge();
}

/* ================= 10. Was fehlt? ================= */

const FEHLT_DINGE = [
  "🍎","🔑","🌻","🚗","☕","🏠","🐈","🌳","⭐","👓","🎩","🍞","🕰️","☂️","🚲","🦋",
  "🍐","🌙","🍄","🎈","🐟","🧦","🕯️","🍊","🚌","🐇","🎸","🧸","🍇","🐝","🦉","🧢",
  "🔨","🪑","🧀","🥕","📖","✂️","🎻","🥨","🧤","🐕","🌷","⚽","🍫","🛁"
];

function playFehlt(stage, level) {
  const anzahl  = [5, 8, 12][level];     // wie viele Dinge liegen da
  const weglegen = [1, 2, 3][level];     // wie viele verschwinden
  const runden = 6;
  const setProgress = progressBar(stage, runden, "gelöst");
  const p = promptText(stage, "", "");

  const schau = el("div", "schau");
  const words = el("div", "words");
  const weiter = el("button", "btn primary", "Ich habe es mir gemerkt");
  weiter.style.maxWidth = "22rem";
  weiter.style.margin = "0 auto 1.2rem";
  stage.append(schau, weiter, words);

  const meinLauf = run;
  let i = 0, satz = [], fehlend = [], gefunden = 0;

  function sichtbar() { return run === meinLauf && document.body.contains(schau); }

  function merkenPhase() {
    satz = frischeAuswahl("fehlt", FEHLT_DINGE, anzahl);
    p.innerHTML = "Prägen Sie sich diese Dinge ein.";
    p.append(el("small", null, anzahl + " Stück — lassen Sie sich Zeit, es läuft keine Uhr."));
    schau.innerHTML = "";
    satz.forEach(d => schau.append(el("div", null, d)));
    words.innerHTML = "";
    weiter.hidden = false;
  }

  weiter.addEventListener("click", () => {
    weiter.hidden = true;
    schau.innerHTML = "";
    /* Genau EINE Rechenaufgabe dazwischen. Ohne sie hat man die Bilder
       noch im Auge und muss sich gar nichts merken — mit ihr ist der
       Blick kurz besetzt und der Abruf echt. */
    ablenkung();
  });

  function ablenkung() {
    const a = rint(4, 9), b2 = rint(3, 9);
    const loesung = a * b2;
    p.innerHTML = "Kurz etwas anderes: Wie viel ist das?";
    p.append(el("small", null, "Eine Aufgabe, dann geht es mit den Bildern weiter."));
    schau.innerHTML = "";
    schau.append(el("div", "aufgabe", a + " × " + b2 + " ="));
    words.innerHTML = "";
    shuffle([loesung, loesung + rint(1, 4), Math.max(2, loesung - rint(1, 4))]).forEach(z => {
      const b3 = el("button", "word zahl", String(z));
      b3.addEventListener("click", () => {
        if (z !== loesung) { fehler(b3); return; }
        tone(600, .1, "sine", .09);
        setTimeout(() => { if (sichtbar()) ratenPhase(); }, 350);
      });
      words.append(b3);
    });
  }

  function ratenPhase() {
    fehlend = shuffle(satz.slice()).slice(0, weglegen);
    gefunden = 0;
    const rest = shuffle(satz.filter(d => !fehlend.includes(d)));
    schau.innerHTML = "";
    rest.forEach(d => schau.append(el("div", null, d)));

    zeigeFrage();

    /* Die Köder stammen aus Dingen, die NIE dabei waren — niemals aus
       den oben noch sichtbaren. Sonst braucht man kein Gedächtnis:
       Man streicht alles weg, was oben noch liegt, und der Rest ist
       zwangsläufig die Lösung. Jetzt muss man sich für jedes Bild
       erinnern, ob man es vorhin gesehen hat. */
    const nieDabei = shuffle(FEHLT_DINGE.filter(d => !satz.includes(d)))
                       .slice(0, weglegen + 2);
    const opts = shuffle([...fehlend, ...nieDabei]);
    words.innerHTML = "";
    opts.forEach(d => {
      const b4 = el("button", "word");
      b4.append(el("div", "pic", d));
      b4.addEventListener("click", () => {
        if (!fehlend.includes(d) || b4.classList.contains("ok")) {
          fehler(b4);
          maybeHint(() => [...words.children].find(x =>
            fehlend.includes(x.textContent) && !x.classList.contains("ok")));
          return;
        }
        richtig();
        b4.classList.add("ok");
        b4.disabled = true;
        gefunden++;
        if (gefunden < weglegen) { zeigeFrage(); return; }

        [...words.children].forEach(x => x.disabled = true);
        i++; setProgress(i);
        setTimeout(() => {
          if (!sichtbar()) return;
          i >= runden ? finish() : merkenPhase();
        }, 1200);
      });
      words.append(b4);
    });
  }

  function zeigeFrage() {
    const offen = weglegen - gefunden;
    p.innerHTML = weglegen === 1 ? "Welches Ding ist verschwunden?" : "Welche Dinge sind verschwunden?";
    p.append(el("small", null,
      (weglegen === 1 ? "Eines fehlt. " : "Es sind " + weglegen + " Stück — noch " + offen + " zu finden. ")
      + "Die übrigen Bilder unten waren von Anfang an nicht dabei."));
  }

  setProgress(0);
  merkenPhase();
}

/* ================= 11. Kopfrechnen =================
   Die Ablenker sind bewusst knapp daneben — typische Rechenfehler wie
   vergessener Übertrag oder vertauschte Ziffern. Zufallszahlen wären
   durch bloßes Überschlagen auszuschließen. */

function macheRechnung(level) {
  let text, loesung;
  if (level === 0) {
    const art = pick(["plus", "minus"]);
    if (art === "plus") {
      const a = rint(2, 9), b = rint(2, 9);
      text = a + " + " + b; loesung = a + b;
    } else {
      const a = rint(6, 19), b = rint(2, a - 1);
      text = a + " − " + b; loesung = a - b;
    }
  } else if (level === 1) {
    const art = pick(["plus", "minus", "mal"]);
    if (art === "plus") {
      const a = rint(18, 79), b = rint(13, 49);
      text = a + " + " + b; loesung = a + b;
    } else if (art === "minus") {
      const a = rint(41, 98), b = rint(13, 39);
      text = a + " − " + b; loesung = a - b;
    } else {
      const a = rint(3, 9), b = rint(3, 9);
      text = a + " × " + b; loesung = a * b;
    }
  } else {
    const art = pick(["zweischritt", "prozent", "geteilt", "malgross"]);
    if (art === "zweischritt") {
      const a = rint(4, 9), b = rint(4, 9), c = rint(7, 29);
      text = a + " × " + b + " − " + c; loesung = a * b - c;
    } else if (art === "prozent") {
      const p = pick([5, 10, 15, 20, 25, 40, 75]);
      const g = pick([40, 60, 80, 120, 160, 200, 240]);
      text = p + " % von " + g; loesung = Math.round(g * p / 100);
    } else if (art === "geteilt") {
      const b = rint(3, 9), erg = rint(4, 19);
      text = (b * erg) + " ÷ " + b; loesung = erg;
    } else {
      const a = rint(12, 29), b = rint(4, 9);
      text = a + " × " + b; loesung = a * b;
    }
  }

  // Typische Fehlerergebnisse als Ablenker
  const kandidaten = new Set();
  [loesung + 1, loesung - 1, loesung + 10, loesung - 10,
   loesung + 2, loesung - 2, loesung + 9, loesung - 9,
   Math.round(loesung * 1.1), Math.round(loesung / 2) * 2 + 4
  ].forEach(x => { if (x !== loesung && x > 0) kandidaten.add(x); });
  const ablenker = shuffle([...kandidaten]).slice(0, 5);
  return { text, loesung, ablenker };
}

function playRechnen(stage, level) {
  const runden = [10, 12, 14][level];
  const anzahl = [3, 5, 6][level];
  const setProgress = progressBar(stage, runden, "gerechnet");
  promptText(stage, "Wie viel ist das?", "Im Kopf rechnen, nichts aufschreiben.");

  const aufgabe = el("div", "aufgabe");
  const words = el("div", "words");
  stage.append(aufgabe, words);
  let i = 0;

  function runde() {
    const { text, loesung, ablenker } = macheRechnung(level);
    aufgabe.textContent = text + " =";
    const opts = shuffle([loesung, ...ablenker.slice(0, anzahl - 1)]);
    words.innerHTML = "";
    opts.forEach(z => {
      const b = el("button", "word zahl", String(z));
      b.addEventListener("click", () => {
        if (z !== loesung) {
          fehler(b);
          maybeHint(() => [...words.children].find(x => x.textContent === String(loesung)));
          return;
        }
        richtig();
        b.classList.add("ok");
        [...words.children].forEach(x => x.disabled = true);
        i++; setProgress(i);
        setTimeout(() => { i >= runden ? finish() : runde(); }, 850);
      });
      words.append(b);
    });
  }
  runde(); setProgress(0);
}

/* ================= 12. Geld abzählen =================
   Rechnen plus Planen, und zugleich eine Alltagsfähigkeit, die nach
   einem Schlaganfall oft gezielt wieder geübt wird. */

const GELDWERTE = [
  { c:1,    txt:"1 ct",  art:"muenze" },
  { c:2,    txt:"2 ct",  art:"muenze" },
  { c:5,    txt:"5 ct",  art:"muenze" },
  { c:10,   txt:"10 ct", art:"muenze silber" },
  { c:20,   txt:"20 ct", art:"muenze silber" },
  { c:50,   txt:"50 ct", art:"muenze silber" },
  { c:100,  txt:"1 €",   art:"muenze silber" },
  { c:200,  txt:"2 €",   art:"muenze silber" },
  { c:500,  txt:"5 €",   art:"schein" },
  { c:1000, txt:"10 €",  art:"schein blau" },
  { c:2000, txt:"20 €",  art:"schein blau" }
];

function alsEuro(cent) {
  return (cent / 100).toFixed(2).replace(".", ",") + " €";
}

function playGeld(stage, level) {
  const runden = 5;
  // Stufe 1 nur volle Euro, Stufe 2 halbe Schritte, Stufe 3 krumme Beträge
  const werte = [
    GELDWERTE.filter(g => g.c >= 100),
    GELDWERTE.filter(g => g.c >= 10),
    GELDWERTE
  ][level];

  const setProgress = progressBar(stage, runden, "gelegt");
  promptText(stage, "Legen Sie den Betrag passend hin.",
    "Antippen legt hin. Im Feld darunter antippen nimmt zurück.");

  const anzeige = el("div", "betrag");
  const soll = el("span", "soll");
  const ist = el("span", "ist");
  anzeige.append(soll, ist);

  const gelegt = el("div", "gelegt");
  const kasse = el("div", "kasse");
  stage.append(anzeige, gelegt, kasse);

  let ziel = 0, summe = 0, i = 0, fertig = false;

  function neueAufgabe() {
    fertig = false;
    summe = 0;
    gelegt.innerHTML = "";
    if (level === 0)      ziel = rint(3, 28) * 100;
    else if (level === 1) ziel = rint(6, 56) * 50;
    else                  ziel = rint(137, 4863);
    soll.textContent = alsEuro(ziel);
    zeigeStand();
  }

  function zeigeStand() {
    const rest = ziel - summe;
    ist.textContent = summe === 0
      ? "noch nichts gelegt"
      : "gelegt: " + alsEuro(summe) + (rest > 0 ? " — es fehlen " + alsEuro(rest)
                                                : rest < 0 ? " — " + alsEuro(-rest) + " zu viel" : "");
  }

  function pruefe() {
    if (summe !== ziel || fertig) return;
    fertig = true;
    richtig();
    i++; setProgress(i);
    ist.textContent = "Genau richtig.";
    setTimeout(() => { i >= runden ? finish() : neueAufgabe(); }, 1100);
  }

  werte.forEach(g => {
    const b = el("button", g.art, g.txt);
    b.addEventListener("click", () => {
      if (fertig) return;
      if (summe + g.c > ziel) { fehler(b); return; }   // Überzahlen wird sanft abgewiesen
      summe += g.c;
      const kopie = el("button", g.art, g.txt);
      kopie.addEventListener("click", () => {
        if (fertig) return;
        summe -= g.c; kopie.remove(); tone(300, .08, "sine", .08); zeigeStand();
      });
      gelegt.append(kopie);
      tone(520 + Math.min(g.c, 400), .09, "sine", .09);
      zeigeStand();
      pruefe();
    });
    kasse.append(b);
  });

  setProgress(0);
  neueAufgabe();
}

/* ================= 13. Liste merken =================
   Dieselbe Liste über mehrere Durchgänge — der Klassiker des verbalen
   Lernens. Entscheidend ist nicht der erste Durchgang, sondern dass
   von Durchgang zu Durchgang mehr hängen bleibt. */

const LISTENWOERTER = [
  "Apfel","Fenster","Hammer","Wolke","Teller","Schlüssel","Garten","Mantel",
  "Brücke","Kerze","Pferd","Zeitung","Sessel","Regen","Tasche","Bäcker",
  "Straße","Löffel","Vogel","Spiegel","Koffer","Wiese","Bürste","Kanne",
  "Turm","Decke","Stiefel","Nadel","Hafen","Birne","Leiter","Kissen"
];

function playListe(stage, level) {
  const laenge = [6, 9, 12][level];
  const durchgaenge = [2, 3, 3][level];
  const setProgress = progressBar(stage, durchgaenge, "Durchgänge");
  const p = promptText(stage, "", "");

  const schau = el("div", "schau");
  schau.style.gridTemplateColumns = "repeat(auto-fit, minmax(7rem, 9rem))";
  const words = el("div", "words");
  const weiter = el("button", "btn primary", "Ich habe es mir gemerkt");
  weiter.style.maxWidth = "22rem";
  weiter.style.margin = "0 auto 1.2rem";
  stage.append(schau, weiter, words);

  const meinLauf = run;
  const liste = frischeAuswahl("liste", LISTENWOERTER, laenge);
  let dg = 0, gefunden = 0, treffer = [];

  const sichtbar = () => run === meinLauf && document.body.contains(schau);

  function lernen() {
    p.innerHTML = "Merken Sie sich diese Wörter.";
    p.append(el("small", null, "Durchgang " + (dg + 1) + " von " + durchgaenge
      + (dg === 0 ? " — es sind immer dieselben Wörter." : " — dieselben wie vorhin.")));
    schau.innerHTML = "";
    liste.forEach(w => {
      const d = el("div", null, w);
      d.style.fontSize = "1.15rem";
      d.style.aspectRatio = "auto";
      d.style.padding = ".8rem .5rem";
      schau.append(d);
    });
    words.innerHTML = "";
    weiter.hidden = false;
  }

  weiter.addEventListener("click", () => { weiter.hidden = true; abfragen(); });

  function abfragen() {
    gefunden = 0; treffer = [];
    schau.innerHTML = "";
    const fremde = shuffle(LISTENWOERTER.filter(w => !liste.includes(w))).slice(0, laenge);
    const alle = shuffle([...liste, ...fremde]);
    zeigeStand();
    words.innerHTML = "";
    alle.forEach(w => {
      const b = el("button", "word", w);
      b.style.fontSize = "1.1rem";
      b.addEventListener("click", () => {
        if (b.classList.contains("ok") || b.disabled) return;
        if (!liste.includes(w)) { fehler(b); b.disabled = true; return; }
        richtig();
        b.classList.add("ok"); b.disabled = true;
        gefunden++; treffer.push(w);
        if (gefunden < liste.length) { zeigeStand(); return; }
        dg++; setProgress(dg);
        [...words.children].forEach(x => x.disabled = true);
        p.innerHTML = "Alle " + liste.length + " gefunden.";
        p.append(el("small", null, dg >= durchgaenge ? "Fertig." : "Gleich noch einmal dieselbe Liste."));
        setTimeout(() => {
          if (!sichtbar()) return;
          dg >= durchgaenge ? finish() : lernen();
        }, 1400);
      });
      words.append(b);
    });
  }

  function zeigeStand() {
    p.innerHTML = "Welche Wörter standen auf der Liste?";
    p.append(el("small", null, gefunden + " von " + liste.length + " gefunden — die Hälfte hier war nicht dabei."));
  }

  setProgress(0);
  lernen();
}

/* ================= 14. Später abrufen =================
   Verzögerter Abruf mit wachsendem Abstand: erst nach einer
   Ablenkung fragen, dann nach einer längeren noch einmal. Das ist
   der Aufbau, an dem sich Gedächtnisleistung im Alltag entscheidet. */

function playSpaeter(stage, level) {
  const anzahl = [4, 6, 8][level];
  const rechenAufgaben = [3, 5, 7][level];      // Länge der Ablenkung
  const abfragen = 2;
  const setProgress = progressBar(stage, abfragen, "Abfragen");
  const p = promptText(stage, "", "");

  const schau = el("div", "schau");
  const words = el("div", "words");
  const weiter = el("button", "btn primary", "Ich habe es mir gemerkt");
  weiter.style.maxWidth = "22rem";
  weiter.style.margin = "0 auto 1.2rem";
  stage.append(schau, weiter, words);

  const meinLauf = run;
  const satz = frischeAuswahl("spaeter", FEHLT_DINGE, anzahl);
  let runde = 0, gefunden = 0, gewaehlt = [];

  const sichtbar = () => run === meinLauf && document.body.contains(schau);

  function lernen() {
    p.innerHTML = "Merken Sie sich diese Dinge.";
    p.append(el("small", null, "Sie werden erst später danach gefragt — nach einer Ablenkung."));
    schau.innerHTML = "";
    satz.forEach(d => schau.append(el("div", null, d)));
    words.innerHTML = "";
    weiter.hidden = false;
  }

  weiter.addEventListener("click", () => { weiter.hidden = true; ablenken(0); });

  function ablenken(nr) {
    if (nr >= rechenAufgaben * (runde + 1)) { abfrage(); return; }
    const a = rint(4, 9), b = rint(3, 9), loesung = a * b;
    p.innerHTML = "Zwischendurch etwas Rechnen.";
    p.append(el("small", null, "Aufgabe " + (nr % rechenAufgaben + 1) + " von " + rechenAufgaben));
    schau.innerHTML = "";
    schau.append(el("div", "aufgabe", a + " × " + b + " ="));
    words.innerHTML = "";
    shuffle([loesung, loesung + rint(1, 5), Math.max(2, loesung - rint(1, 5)), loesung + 10]).forEach(z => {
      const bt = el("button", "word zahl", String(z));
      bt.addEventListener("click", () => {
        if (z !== loesung) { fehler(bt); return; }
        tone(600, .08, "sine", .08);
        setTimeout(() => { if (sichtbar()) ablenken(nr + 1); }, 220);
      });
      words.append(bt);
    });
  }

  function abfrage() {
    gefunden = 0; gewaehlt = [];
    schau.innerHTML = "";
    const fremde = shuffle(FEHLT_DINGE.filter(d => !satz.includes(d))).slice(0, anzahl);
    const alle = shuffle([...satz, ...fremde]);
    zeigeStand();
    words.innerHTML = "";
    alle.forEach(d => {
      const b = el("button", "word");
      b.append(el("div", "pic", d));
      b.addEventListener("click", () => {
        if (b.disabled) return;
        if (!satz.includes(d)) { fehler(b); b.disabled = true; return; }
        richtig();
        b.classList.add("ok"); b.disabled = true;
        gefunden++;
        if (gefunden < satz.length) { zeigeStand(); return; }
        runde++; setProgress(runde);
        [...words.children].forEach(x => x.disabled = true);
        if (runde >= abfragen) {
          p.innerHTML = "Alles wiedergefunden.";
          p.append(el("small", null, "Auch nach der zweiten Ablenkung."));
          setTimeout(() => { if (sichtbar()) finish(); }, 1300);
          return;
        }
        p.innerHTML = "Richtig — alle wiedergefunden.";
        p.append(el("small", null, "Behalten Sie sie noch. Es kommt gleich noch einmal."));
        setTimeout(() => { if (sichtbar()) ablenken(rechenAufgaben * runde); }, 1600);
      });
      words.append(b);
    });
  }

  function zeigeStand() {
    p.innerHTML = runde === 0 ? "Was war vorhin zu sehen?" : "Und noch einmal: Was war es?";
    p.append(el("small", null, gefunden + " von " + satz.length
      + " gefunden — die Hälfte hier war nicht dabei."));
  }

  setProgress(0);
  lernen();
}

/* ================= 15. Nicht vergessen =================
   Prospektives Gedächtnis: einen Auftrag behalten und im richtigen
   Moment von selbst daran denken, ohne dass jemand erinnert. */

function playAuftrag(stage, level) {
  const aufgaben = [10, 14, 18][level];
  const signale = [3, 4, 5][level];
  const setProgress = progressBar(stage, signale, "Aufträge erfüllt");
  const p = promptText(stage, "", "");

  const merkzettel = el("div", "merksatz");
  merkzettel.style.maxWidth = "34rem";
  merkzettel.style.margin = "0 auto 1.2rem";
  const glockenreihe = el("div", "glockenreihe");
  const rechnung = el("div", "aufgabe");
  const words = el("div", "words");
  stage.append(merkzettel, glockenreihe, rechnung, words);

  const meinLauf = run;
  const sichtbar = () => run === meinLauf && document.body.contains(rechnung);

  // Wann taucht das Signal auf? Gleichmäßig verteilt, aber nicht am Anfang
  const zeitpunkte = shuffle(
    Array.from({ length: aufgaben - 3 }, (_, k) => k + 3)
  ).slice(0, signale).sort((a, b) => a - b);

  let nr = 0, erfuellt = 0, glockeOffen = false;

  merkzettel.textContent = "Ihr Auftrag: Sobald die Glocke erscheint, tippen Sie zuerst auf die Glocke — erst danach rechnen Sie weiter.";

  function runde() {
    if (nr >= aufgaben) { finish(); return; }
    glockeOffen = zeitpunkte.includes(nr);
    glockenreihe.innerHTML = "";
    if (glockeOffen) {
      const g = el("button", "glocke", "🔔");
      g.setAttribute("aria-label", "Glocke antippen");
      g.addEventListener("click", () => {
        if (!glockeOffen) return;
        glockeOffen = false;
        richtig();
        erfuellt++; setProgress(erfuellt);
        g.classList.add("erledigt");
        g.disabled = true;
        p.innerHTML = "Auftrag erfüllt.";
        p.append(el("small", null, "Weiter mit der Rechnung."));
      });
      glockenreihe.append(g);
    }

    const a = rint(4, 9), b = rint(3, 9), loesung = a * b;
    rechnung.textContent = a + " × " + b + " =";
    if (!glockeOffen || !zeitpunkte.includes(nr)) zeigeText();
    else zeigeText();

    words.innerHTML = "";
    shuffle([loesung, loesung + rint(1, 5), Math.max(2, loesung - rint(1, 5)), loesung + 9]).forEach(z => {
      const bt = el("button", "word zahl", String(z));
      bt.addEventListener("click", () => {
        if (z !== loesung) { fehler(bt); return; }
        if (glockeOffen) {
          // Auftrag vergessen — das ist der eigentliche Fehler dieser Übung
          glockeOffen = false;
          run.fehler++;
          sndNope();
          const g = glockenreihe.querySelector(".glocke");
          if (g) { g.classList.add("verpasst"); g.disabled = true; }
          p.innerHTML = "Die Glocke war da — und blieb ungetippt.";
          p.append(el("small", null, "Beim nächsten Mal zuerst die Glocke."));
          nr++;
          setTimeout(() => { if (sichtbar()) runde(); }, 1900);
          return;
        }
        tone(600, .09, "sine", .09);
        nr++;
        setTimeout(() => { if (sichtbar()) runde(); }, 300);
      });
      words.append(bt);
    });
  }

  function zeigeText() {
    p.innerHTML = "Wie viel ist das?";
    p.append(el("small", null, "Aufgabe " + (nr + 1) + " von " + aufgaben
      + " — den Auftrag nicht vergessen."));
  }

  setProgress(0);
  runde();
}

/* ================= 16. Namen merken =================
   Namen zu Gesichtern sind die häufigste Alltagsklage. Die Gesichter
   werden gezeichnet statt fotografiert — so ist niemand abgebildet,
   und die Merkmale lassen sich gezielt unterscheidbar halten. */

const VORNAMEN = [
  "Helga","Ingrid","Renate","Ursula","Monika","Brigitte","Karin","Elke","Gisela","Christa",
  "Klaus","Werner","Dieter","Gerhard","Hans","Wolfgang","Jürgen","Manfred","Horst","Günter"
];
const HAUTTOENE  = ["#F2D6BC","#E3BB97","#C89575","#A5744F","#7B5336"];
const HAARFARBEN = ["#2B2724","#6B4A2B","#B8860B","#9A9691","#F0EBE1","#8C3B22"];
const HEMDFARBEN = ["#2F6B4C","#8A3A72","#2F55A0","#A9691A","#7C2940","#1E6584","#55701F","#4A5A66"];

/* Die Gesichter werden gezeichnet, nicht fotografiert — so ist niemand
   abgebildet. Wichtig ist, dass sie sich auf einen Blick unterscheiden:
   Nicht die feine Nasenform macht sie merkbar, sondern Frisur, Brille,
   Bart und vor allem die Farbe der Kleidung. Genau so merkt man sich
   Menschen auch im Alltag. */
function gesichtSVG(m) {
  const haut = HAUTTOENE[m.haut % HAUTTOENE.length];
  const haar = HAARFARBEN[m.haar % HAARFARBEN.length];
  const hemd = HEMDFARBEN[m.hemd % HEMDFARBEN.length];

  const frisuren = [
    // kurz
    '<path d="M24 44c0-18 10-27 26-27s26 9 26 27c-5-9-13-13-26-13s-21 4-26 13z" fill="' + haar + '"/>',
    // lang, fällt über die Schultern
    '<path d="M20 50c0-22 12-33 30-33s30 11 30 33v26h-11V46c-4-6-11-9-19-9s-15 3-19 9v30H20z" fill="' + haar + '"/>',
    // Glatze mit Kranz
    '<path d="M24 52c0-4 .4-8 1.2-11 1 6 3 9 5 10-1-4-1-8 0-11 3 8 7 11 10 12h-2c8 2 17 2 25 0 3-2 6-6 8-13 1 4 1 8 .5 12 2-1 3-4 3.5-9 .8 3 1.2 6 1.2 10-4-8-12-13-26-13s-22 5-26 13z" fill="' + haar + '"/>',
    // Seitenscheitel
    '<path d="M24 45c0-18 10-28 26-28s26 10 26 28c-3-8-8-12-14-14-3 5-13 8-24 7-6 1-11 3-14 7z" fill="' + haar + '"/>'
  ];

  return '<svg viewBox="0 0 100 100" role="img" aria-label="Gezeichnetes Gesicht">'
    + '<rect width="100" height="100" fill="#F4F6F4"/>'
    + (m.frisur === 1 ? frisuren[1] : '')
    // Schultern in kräftiger Kleidungsfarbe — der stärkste Merkhinweis
    + '<path d="M16 100c0-14 15-22 34-22s34 8 34 22z" fill="' + hemd + '"/>'
    + '<path d="M43 74h14v10H43z" fill="' + haut + '"/>'
    + '<ellipse cx="50" cy="52" rx="24" ry="28" fill="' + haut + '"/>'
    + '<ellipse cx="26" cy="55" rx="4" ry="6" fill="' + haut + '"/>'
    + '<ellipse cx="74" cy="55" rx="4" ry="6" fill="' + haut + '"/>'
    + (m.frisur === 1 ? '' : frisuren[m.frisur])
    + (m.bart
        ? '<path d="M28 60c3 17 11 24 22 24s19-7 22-24c-5 9-13 13-22 13s-17-4-22-13z" fill="' + haar + '"/>'
        : '')
    + '<circle cx="41" cy="51" r="3.2" fill="#241F1B"/><circle cx="59" cy="51" r="3.2" fill="#241F1B"/>'
    + (m.schnurrbart && !m.bart
        ? '<path d="M42 64q8 4 16 0" stroke="' + haar + '" stroke-width="5" fill="none" stroke-linecap="round"/>'
        : '')
    + '<path d="M43 70q7 5 14 0" stroke="#8A5A47" stroke-width="3" fill="none" stroke-linecap="round"/>'
    + (m.brille
        ? '<g stroke="#33312E" stroke-width="3" fill="none">'
          + '<circle cx="41" cy="51" r="9.5"/><circle cx="59" cy="51" r="9.5"/>'
          + '<path d="M50.5 51h-1"/><path d="M31.5 49l-6-2"/><path d="M68.5 49l6-2"/></g>'
        : '')
    + '</svg>';
}

function playNamen(stage, level) {
  const anzahl = [3, 5, 7][level];
  const setProgress = progressBar(stage, anzahl, "Namen");
  const p = promptText(stage, "", "");

  const galerie = el("div", "galerie");
  const words = el("div", "words");
  const weiter = el("button", "btn primary", "Ich habe sie mir gemerkt");
  weiter.style.maxWidth = "22rem";
  weiter.style.margin = "0 auto 1.2rem";
  stage.append(galerie, weiter, words);

  const meinLauf = run;
  const sichtbar = () => run === meinLauf && document.body.contains(galerie);

  const namen = frischeAuswahl("namen", VORNAMEN, anzahl);
  /* Merkmale werden verteilt, nicht gewürfelt: Jede Person bekommt eine
     eigene Kleidungsfarbe und eine eigene Haarfarbe. Sonst können zwei
     Gesichter zufällig fast gleich aussehen — das wäre nicht schwer,
     sondern ungerecht. */
  const hemden = shuffle(HEMDFARBEN.map((_, k) => k));
  const haare  = shuffle(HAARFARBEN.map((_, k) => k));
  const leute = namen.map((name, k) => {
    const weiblich = VORNAMEN.indexOf(name) < 10;
    return {
      name, weiblich,
      merkmale: {
        haut: rint(0, HAUTTOENE.length - 1),
        haar: haare[k % haare.length],
        hemd: hemden[k % hemden.length],
        frisur: weiblich ? (k % 2 === 0 ? 1 : 3) : [0, 2, 3][k % 3],
        brille: (k % 3) === 1,
        bart: !weiblich && (k % 4) === 2,
        schnurrbart: !weiblich && (k % 5) === 3
      }
    };
  });
  let i = 0, reihenfolge = [];

  function lernen() {
    p.innerHTML = "Merken Sie sich, wer wie heißt.";
    p.append(el("small", null, anzahl + (anzahl === 1 ? " Person" : " Personen")
      + " — lassen Sie sich Zeit."));
    galerie.innerHTML = "";
    leute.forEach(pers => {
      const k = el("figure", "person");
      const bild = el("div", "kopf");
      bild.innerHTML = gesichtSVG(pers.merkmale);
      k.append(bild, el("figcaption", null, pers.name));
      galerie.append(k);
    });
    words.innerHTML = "";
    weiter.hidden = false;
  }

  weiter.addEventListener("click", () => {
    weiter.hidden = true;
    reihenfolge = shuffle(leute.slice());
    frage();
  });

  function frage() {
    const pers = reihenfolge[i];
    p.innerHTML = "Wie heißt diese Person?";
    p.append(el("small", null, (i + 1) + " von " + anzahl));
    galerie.innerHTML = "";
    const k = el("figure", "person gross");
    const bild = el("div", "kopf");
    bild.innerHTML = gesichtSVG(pers.merkmale);
    k.append(bild);
    galerie.append(k);

    const falsche = shuffle(VORNAMEN.filter(n => !namen.includes(n))).slice(0, 3);
    const opts = shuffle([pers.name, ...leute.filter(x => x !== pers).map(x => x.name).slice(0, 2), ...falsche]).slice(0, Math.min(6, anzahl + 2));
    if (!opts.includes(pers.name)) opts[0] = pers.name;
    words.innerHTML = "";
    shuffle(opts).forEach(n => {
      const b = el("button", "word", n);
      b.addEventListener("click", () => {
        if (n !== pers.name) {
          fehler(b);
          maybeHint(() => [...words.children].find(x => x.textContent === pers.name));
          return;
        }
        richtig();
        b.classList.add("ok");
        [...words.children].forEach(x => x.disabled = true);
        i++; setProgress(i);
        setTimeout(() => {
          if (!sichtbar()) return;
          i >= anzahl ? finish() : frage();
        }, 1000);
      });
      words.append(b);
    });
  }

  setProgress(0);
  lernen();
}
