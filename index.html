<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="description" content="Kleine Übungen für Gedächtnis, Sprache und Handgeschicklichkeit — für Menschen nach einem Schlaganfall oder mit einer Demenzerkrankung. Ohne Zeitdruck und ohne Punkte.">
<meta name="theme-color" content="#EFF2EE">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kopf & Hand">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>Kopf &amp; Hand</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<style>
/* ------------------------------------------------------------------
   Kopf & Hand — Übungen für Kopf und Hände
   Bewusst ein einziges, helles Farbschema: für Menschen mit
   Sehschwäche ist heller Grund mit dunkler Schrift verlässlich
   lesbar. Statt Dunkelmodus gibt es einen Kontrast-Regler.
   ------------------------------------------------------------------ */

:root{
  --paper:      #F7F2E7;
  --paper-deep: #EDE4D0;
  --card:       #FFFDF8;
  --ink:        #342C23;
  --ink-2:      #6E6150;
  --line:       #E2D7C1;
  --line-2:     #CBBB9C;
  --green:      #2A6B4C;
  --green-deep: #1D4C36;
  --green-soft: #DFEDE4;
  --honey:      #A5761F;
  --honey-soft: #F3E8CE;
  --sky:        #4C6B84;
  --sky-soft:   #DFE4E7;
  --soil:       #A38A6A;
  --soil-deep:  #7C6650;
  /* Nur ein Hauch Tiefe — die Flächen tragen sich über Ton und Rand,
     nicht über Schatten. */
  --shadow:     0 1px 2px rgba(90,70,40,.07);
  --radius:     12px;
  --tap:        4.4rem;

  /* Jede Übung setzt ihre eigene Farbe in diese vier Marken ein.
     --wash tönt den ganzen Bildschirm ganz leicht mit ein, damit man
     schon am Hintergrund merkt, worin man gerade steckt. */
  --akzent:      #65795C;
  --akzent-voll: #65795C;   /* Flächen mit weißer Schrift — mind. 4,5:1 */
  --akzent-deep: #485641;
  --akzent-soft: #E2E2D6;
  --wash:        #F7F2E7;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", "Noto Sans", sans-serif;
  /* Namen und Überschriften in einer Serifenschrift — sie gibt der App
     ihre Wärme. Fließtext und ALLE Zahlen bleiben serifenlos:
     Georgias Ziffern sind Minuskelziffern und taugen nicht zum Rechnen. */
  --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
}

/* Kontrastverstärkung (Einstellungen) */
body.hc{
  --paper:      #FFFFFF;
  --paper-deep: #F0F0F0;
  --card:       #FFFFFF;
  --ink:        #000000;
  --ink-2:      #262626;
  --line:       #666666;
  --line-2:     #333333;
  --green:      #0B4A2E;
  --green-deep: #06301D;
  --green-soft: #FFFFFF;
  --honey:      #6B3D00;
  --honey-soft: #FFFFFF;
  --sky:        #123B54;
  --sky-soft:   #FFFFFF;
  --soil:       #6B573F;
  --soil-deep:  #3A2E20;
  --shadow:     0 0 0 rgba(0,0,0,0);
  /* Die Übungsfarben bleiben als Erkennungsmerkmal erhalten, die
     zarten Tönungen weichen aber reinem Weiß. */
  --akzent-soft: #FFFFFF;
  --wash:        #FFFFFF;
}
body.hc .tile{ --kachel-bg:#FFFFFF; --kachel-line:var(--line-2); }

html{ font-size:18px; -webkit-text-size-adjust:100%; }
html.t-gross{ font-size:21px; }
html.t-sehrgross{ font-size:25px; }

body{
  margin:0;
  background:var(--wash);
  color:var(--ink);
  font-family:var(--font);
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}

*{ box-sizing:border-box; }
button{ font:inherit; color:inherit; }
[hidden]{ display:none !important; }

/* Alles im Spielfeld ist Tippfläche, keine Textauswahl, kein Zoom-Ruckeln */
.stage, .tile, .btn, .card, .dom, .basket, .item{
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

:focus-visible{
  outline:4px solid var(--sky);
  outline-offset:3px;
}

/* ---------------- Gerüst ---------------- */

.app{
  max-width:60rem;
  margin:0 auto;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}

/* Die Navigationsleiste wächst bewusst NICHT mit dem Textgrößen-Regler:
   sie ist ohnehin großzügig bemessen, und mitwachsend würde sie bei
   „Sehr groß“ den Titel aus der Zeile drängen. */
.bar{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  background:var(--paper-deep);
  border-bottom:1px solid var(--line-2);
  position:sticky; top:0; z-index:20;
}

.bar h1{
  font-family:var(--serif);
  font-weight:600;
  font-size:19px;
  font-weight:650;
  letter-spacing:.005em;
  margin:0;
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* Schmale Handys: Zurück, Hilfe und Vorlesen brauchen Platz. Der Titel
   darf dann zweizeilig werden, statt mit „…“ abgeschnitten zu werden. */
@media (max-width:34rem){
  .bar{ gap:6px; padding:10px 10px; }
  .bar #back{ padding:0 10px; gap:6px; }
  .bar .iconbtn.rund{ padding:0; min-width:48px; justify-content:center; }
  .bar h1{
    font-size:17.5px; line-height:1.15;
    white-space:normal; text-overflow:clip;
    hyphens:auto; -webkit-hyphens:auto;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2;
  }
}
@media (max-width:380px){
  .bar{ padding:10px 8px; }
  .bar #back{ font-size:16px; }
  .bar #back svg{ width:22px; height:22px; }
  .bar h1{ font-size:16px; }
}
/* Sehr kleine Handys: am Zurück-Knopf nur der Pfeil. Das Wort bleibt
   für Screenreader und Vorlesen erhalten. */
@media (max-width:340px){
  .bar #back{ min-width:52px; padding:0; justify-content:center; }
  .zurueck-text{
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap;
  }
}

.iconbtn{
  display:inline-flex; align-items:center; gap:8px;
  min-height:56px; padding:0 17px;
  background:var(--card);
  border:2px solid var(--line-2);
  border-radius:12px;
  font-size:17px; font-weight:600;
  cursor:pointer;
}
.iconbtn:active{ transform:translateY(1px); }
.iconbtn svg{ width:25px; height:25px; flex:none; }

main{ flex:1; padding:1.1rem .8rem 3rem; }

/* ---------------- Startseite ---------------- */

.lede{
  margin:.2rem .2rem 1.5rem;
  font-size:1.05rem;
  color:var(--ink-2);
  max-width:38ch;
}

.sectionhead{
  display:flex; align-items:baseline; gap:.7rem;
  margin:2rem .2rem .9rem;
}
.sectionhead:first-of-type{ margin-top:.4rem; }
.sectionhead h2{
  font-size:.86rem; font-weight:700; margin:0;
  letter-spacing:.1em; text-transform:uppercase;
  color:var(--kapitel, var(--ink-2));
}
.sectionhead span{ font-size:.95rem; color:var(--ink-2); }

.gruppen{ margin:0 0 2rem; border-top:1px solid var(--line-2); }
.gruppe-h{ margin:0; font:inherit; }
.gruppenkopf{
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  width:100%; min-height:4.2rem; padding:.85rem .3rem;
  background:none; border:none; border-bottom:1px solid var(--line-2);
  text-align:left; cursor:pointer; color:var(--ink);
}
.gruppenkopf:active{ background:var(--paper-deep); }
.gruppentext{ display:flex; flex-direction:column; gap:.15rem; min-width:0; }
.gruppenkopf .titel{ font-family:var(--serif); font-size:1.32rem; font-weight:500;
  line-height:1.2; color:var(--kapitel, var(--ink)); }
.gruppenkopf .unter{ font-size:.95rem; color:var(--ink-2); line-height:1.35; }
.gruppenkopf .chev{ flex:none; width:1.6rem; height:1.6rem; color:var(--ink-2);
  transition:transform .2s ease; }
.gruppenkopf .chev svg{ width:100%; height:100%; display:block; }
.gruppenkopf[aria-expanded="true"] .chev{ transform:rotate(180deg); }
.gruppen .grid{ padding:.9rem 0 1.2rem; border-bottom:1px solid var(--line-2); }

.grid{
  display:grid;
  /* min() verhindert, dass die Mindestbreite bei großer Schrift breiter
     wird als der Bildschirm — sonst läuft die Startseite seitlich über. */
  grid-template-columns:repeat(auto-fill, minmax(min(15.5rem, 100%), 1fr));
  gap:.85rem;
}

.tile{
  display:flex; align-items:center; gap:.9rem;
  text-align:left;
  padding:1.1rem 1rem;
  background:var(--kachel-bg, var(--card));
  border:1.5px solid var(--kachel-line, var(--line));
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  cursor:pointer;
  min-height:6.2rem;
}
.tile:active{ transform:translateY(1px); }
/* Kein farbiges Quadrat mehr hinter dem Symbol — das war der
   stärkste Grund, warum die Kacheln nach Vorlage aussahen. Das
   Symbol steht frei in der Farbe der Übung. */
.tile .ic{
  flex:none; width:2.9rem; height:2.9rem;
  display:grid; place-items:center;
  color:var(--kachel-farbe, var(--akzent));
}
.tile .ic svg{ width:2.6rem; height:2.6rem; }
.tile b{ display:block; font-family:var(--serif); font-size:1.2rem;
  font-weight:400; line-height:1.25; letter-spacing:.005em; }
.tile small{ display:block; font-size:.94rem; color:#4A3F33; margin-top:.2rem; }

/* ---------------- Schwierigkeit ---------------- */

.choose{ max-width:30rem; margin:1rem auto; }
.choose h2{ font-family:var(--serif); font-weight:500; font-size:1.65rem; margin:0 0 .3rem; letter-spacing:-.01em; }
.choose p{ color:var(--ink-2); margin:0 0 1.6rem; font-size:1.05rem; }

.btn{
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  width:100%;
  min-height:var(--tap);
  padding:.9rem 1.2rem;
  margin-bottom:.75rem;
  background:var(--card);
  border:2px solid var(--line-2);
  border-radius:14px;
  font-size:1.2rem; font-weight:620;
  text-align:left;
  cursor:pointer;
  box-shadow:var(--shadow);
}
.btn:active{ transform:translateY(1px); }
.btn em{ font-style:normal; font-weight:500; font-size:.95rem; color:var(--ink-2); }
.btn.primary{
  background:var(--akzent-voll); border-color:var(--akzent-deep); color:#fff;
  justify-content:center;
}
.btn.primary em{ color:rgba(255,255,255,.85); }

/* Spielerklärung vor dem ersten Zug */
.regeln{ max-width:32rem; margin:.5rem auto; }
.regeln h2{ font-family:var(--serif); font-weight:500; font-size:1.6rem; margin:0 0 1.2rem; letter-spacing:-.01em; }
.regeln ol{
  margin:0 0 1.6rem; padding:0; list-style:none;
  counter-reset:schritt;
}
.regeln li{
  counter-increment:schritt;
  position:relative;
  padding:.1rem 0 1.1rem 3.1rem;
  font-size:1.08rem; line-height:1.5;
}
.regeln li::before{
  content:counter(schritt);
  position:absolute; left:0; top:0;
  width:2.2rem; height:2.2rem; border-radius:99px;
  background:var(--akzent-voll); color:#fff;
  display:grid; place-items:center;
  font-weight:700; font-size:1.05rem;
}
.regeln li:last-of-type{ padding-bottom:.6rem; }
.regeln .merksatz{
  background:var(--akzent-soft);
  border:2px solid var(--akzent);
  border-radius:12px; padding:.9rem 1.1rem; margin:0 0 1.6rem;
  font-size:1.05rem; line-height:1.5;
}

/* ---------------- Spielfläche ---------------- */

.stage{ max-width:52rem; margin:0 auto; }

.prompt{
  font-family:var(--serif); font-weight:500;
  font-size:1.35rem;
  text-align:center;
  margin:.2rem auto 1.2rem;
  max-width:32ch;
  text-wrap:balance;
  line-height:1.35;
}
.prompt small{ display:block; font-weight:500; font-size:.95rem; color:var(--ink-2); margin-top:.35rem; }

.progress{
  display:flex; align-items:center; gap:.7rem;
  margin:0 auto 1.3rem; max-width:32rem;
}
.progress .track{
  flex:1; height:.9rem;
  background:var(--akzent-soft);
  border:2px solid var(--line);
  border-radius:99px;
  overflow:hidden;
}
.progress .fill{
  height:100%; width:0;
  background:var(--akzent-voll);
  border-radius:99px;
  transition:width .45s cubic-bezier(.2,.8,.3,1);
}
.progress .num{
  font-size:.98rem; font-weight:640; color:var(--ink-2);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}

/* Memory */
.memgrid{ display:grid; gap:.7rem; margin:0 auto; max-width:34rem; }
.card{
  position:relative;
  aspect-ratio:1/1;
  border:none; padding:0; background:none;
  cursor:pointer;
  perspective:900px;
}
.card .inner{
  position:absolute; inset:0;
  transition:transform .4s cubic-bezier(.3,.9,.35,1);
  transform-style:preserve-3d;
}
.card.open .inner, .card.done .inner{ transform:rotateY(180deg); }
.card .face{
  position:absolute; inset:0;
  display:grid; place-items:center;
  border-radius:14px;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  font-size:clamp(2rem, 11vw, 3.4rem);
  line-height:1;
}
.card .back{
  background:var(--akzent-voll);
  border:2px solid var(--akzent-deep);
  color:rgba(255,255,255,.85);
}
.card .front{
  background:var(--card);
  border:2px solid var(--line-2);
  transform:rotateY(180deg);
}
.card.done .front{
  background:var(--akzent-soft);
  border-color:var(--akzent);
}
.card.done{ animation:pop .4s ease; }

/* Domino */
.domrow{
  display:flex; gap:.35rem; justify-content:center; align-items:center;
  flex-wrap:nowrap; margin-bottom:1.6rem; min-height:5.4rem;
  overflow-x:auto; padding-bottom:.3rem;
}
.domrow .lead{ font-size:1.5rem; color:var(--ink-2); padding:0 .2rem; }
.dom{
  display:flex;
  background:var(--card);
  border:2px solid var(--line-2);
  border-radius:10px;
  overflow:hidden;
  padding:0;
  cursor:pointer;
}
.dom.laid{ cursor:default; border-color:var(--line); }
.dom .half{
  width:2.6rem; height:2.6rem;
  flex:none;
  display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr);
  padding:.32rem;
}
.dom .half + .half{ border-left:2px solid var(--line-2); }
.dom .pip{
  width:.52rem; height:.52rem; border-radius:99px;
  background:var(--ink); place-self:center;
}
/* Handsteine sind die Tippfläche und deshalb deutlich größer */
.domhand{ display:flex; gap:.9rem; justify-content:center; flex-wrap:wrap; }
.domhand .dom{ border-width:3px; border-radius:14px; box-shadow:var(--shadow); }
.domhand .dom .half{ width:3.7rem; height:3.7rem; padding:.45rem; }
.domhand .dom .half + .half{ border-left-width:3px; }
.domhand .dom .pip{ width:.78rem; height:.78rem; }
.domhand .dom.hint{ animation:glow 1.1s ease infinite; border-color:var(--honey); }
.openend{
  display:inline-grid; place-items:center;
  padding:.15rem .6rem; border-radius:8px;
  background:var(--honey-soft); color:var(--honey);
  font-weight:700;
}

/* Domino-Kette mit zwei offenen Enden */
.kettenzeile{
  display:flex; align-items:center; justify-content:center;
  gap:.35rem; margin-bottom:1.4rem;
  max-width:100%;
}
/* Die Kette darf schrumpfen und rollen, die Enden bleiben stehen —
   so kleben die offenen Zahlen immer sichtbar an der Kette. */
.kettenzeile .domrow{ flex:0 1 auto; margin-bottom:0; min-height:4.6rem; }
.endzone{
  flex:none;
  display:flex; flex-direction:column; align-items:center; gap:.15rem;
  min-width:4.2rem; padding:.4rem .45rem;
  border:3px dashed var(--line-2);
  border-radius:12px;
  background:var(--card);
  color:var(--ink-2);
  cursor:pointer;
}
.endzone .augen{
  width:2.6rem; height:2.6rem;
  display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr);
  padding:.28rem;
}
.endzone .augen .pip{
  width:.5rem; height:.5rem; border-radius:99px;
  background:currentColor; place-self:center;
}
.endzone .wort{
  font-size:.76rem; font-weight:700; letter-spacing:.03em;
  text-transform:uppercase;
}
.endzone.aktiv{
  border-style:solid; border-color:var(--akzent);
  background:var(--akzent-soft); color:var(--akzent-deep);
  animation:glow 1.2s ease infinite;
}
.domhand .dom.gewaehlt{
  border-color:var(--honey); border-width:4px;
  background:var(--honey-soft);
}
.zuruecknehmen{
  display:block; margin:0 auto 1.2rem;
  min-height:3.4rem; padding:0 1.2rem;
  background:var(--card); border:2px solid var(--line-2);
  border-radius:12px; font-size:1.02rem; font-weight:600; cursor:pointer;
}

/* Wortkacheln (Sprichwörter, Kategorien) */
.words{ display:grid; gap:.75rem; grid-template-columns:repeat(auto-fit,minmax(11rem,1fr)); max-width:38rem; margin:0 auto; }
.word{
  font-family:var(--serif); font-weight:400;
  min-height:var(--tap);
  padding:1rem .9rem;
  background:var(--card);
  border:2px solid var(--line-2);
  border-radius:14px;
  font-size:1.25rem; font-weight:620;
  cursor:pointer;
  box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.3rem;
}
.word .pic{ font-size:2.2rem; line-height:1; }
/* Zahlen gehören nie in die Serifenschrift — Georgia setzt
   Minuskelziffern, bei denen 3, 4, 5, 7 und 9 unter die Grundlinie
   fallen. Zum Vergleichen von Rechenergebnissen ist das untauglich. */
.word.zahl{
  font-family:var(--font); font-weight:650;
  font-variant-numeric:tabular-nums lining-nums;
}
.word.hint{ border-color:var(--honey); animation:glow 1.1s ease infinite; }
.word.ok{ background:var(--akzent-soft); border-color:var(--akzent); }
.saying{
  font-family:var(--serif); font-weight:500;
  font-size:1.55rem; text-align:center; line-height:1.5;
  max-width:26ch; margin:0 auto 1.6rem; text-wrap:balance;
}
.saying .gap{
  display:inline-block; min-width:5.5rem;
  border-bottom:4px solid var(--honey);
  color:var(--akzent-deep); font-weight:700;
  text-align:center; white-space:nowrap;
}

/* Zahlenreihe + Ziele: freies Feld */
.field{
  position:relative;
  width:100%; aspect-ratio:4/3;
  max-height:62vh;
  background:var(--card);
  border:2px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
}
.spot{
  position:absolute;
  display:grid; place-items:center;
  border-radius:99px;
  background:var(--akzent-soft);
  border:3px solid var(--akzent);
  color:var(--akzent-deep);
  font-size:1.6rem; font-weight:700;
  cursor:pointer;
  font-variant-numeric:tabular-nums;
}
.spot.next{ border-color:var(--honey); }
.spot.gone{ animation:pop .34s ease forwards; pointer-events:none; }
/* Der Zielpunkt ist immer grün, unabhängig von der Übungsfarbe — die
   Anleitung sagt „nur den grünen Punkt antippen“, und auf der schweren
   Stufe stehen rote Störer daneben. Mit der Übungsfarbe Terrakotta
   sahen Ziel und Störer fast gleich aus. */
.target{
  position:absolute; border-radius:99px;
  background:radial-gradient(circle at 34% 30%, #CFE2C3, #3F7A38 62%);
  border:3px solid #2B5626;
  cursor:pointer;
}
.target::after{
  content:""; position:absolute; inset:22%;
  border:3px solid rgba(255,255,255,.75); border-radius:99px;
}
/* Ablenker auf der schwersten Stufe — klar andere Farbe, nicht nur
   ein anderer Ton, damit auch bei Farbsehschwäche unterscheidbar */
.target.stoerer{
  background:radial-gradient(circle at 34% 30%, #E8A08D, #B03A28 70%);
  border-color:#7C2416;
}
.target.stoerer::after{
  inset:30%; border-style:dashed;
}

/* Linie nachfahren */
.tracewrap{
  background:var(--card); border:2px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow);
  overflow:hidden; touch-action:none;
}
.tracewrap svg{ display:block; width:100%; height:auto; }

/* Sortieren */
.tray{
  display:flex; gap:.7rem; flex-wrap:wrap; justify-content:center;
  min-height:7rem; margin-bottom:1.4rem;
  padding:.8rem; border:2px dashed var(--line-2); border-radius:var(--radius);
}
.item{
  /* Bewusst kleiner als die übrigen Tippflächen: bei zwölf Dingen und
     großer Schrift müsste man sonst zwischen Ding und Kiste scrollen,
     was das Ziehen unmöglich macht. 3.6rem sind auch bei kleinster
     Einstellung noch deutlich über der empfohlenen Mindestgröße. */
  width:3.6rem; height:3.6rem;
  display:grid; place-items:center;
  font-size:2rem; line-height:1;
  background:var(--card);
  border:2px solid var(--line-2);
  border-radius:14px;
  cursor:grab;
  box-shadow:var(--shadow);
  touch-action:none;
}
.item.picked{ border-color:var(--honey); border-width:4px; background:var(--honey-soft); }
.item.dragging{ position:fixed; z-index:60; pointer-events:none; box-shadow:0 14px 30px -8px rgba(22,32,26,.5); }
.baskets{ display:flex; gap:.8rem; justify-content:center; flex-wrap:wrap; }
.basket{
  flex:1 1 9rem; max-width:15rem; min-height:9rem;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:.4rem;
  padding:.9rem .6rem;
  background:var(--paper-deep);
  border:3px solid var(--line-2);
  border-radius:var(--radius);
  cursor:pointer;
}
.basket b{ font-size:1.1rem; }
.basket.over{ border-color:var(--akzent); background:var(--akzent-soft); }
.basket .in{ display:flex; flex-wrap:wrap; gap:.25rem; justify-content:center; font-size:1.6rem; line-height:1; }

/* Rückmeldung */
.wrong{ animation:shake .42s ease; }
@keyframes shake{
  0%,100%{ transform:translateX(0) }
  20%{ transform:translateX(-9px) } 40%{ transform:translateX(9px) }
  60%{ transform:translateX(-5px) } 80%{ transform:translateX(5px) }
}
@keyframes pop{ 0%{ transform:scale(1) } 45%{ transform:scale(1.13) } 100%{ transform:scale(1) } }
@keyframes glow{ 0%,100%{ box-shadow:0 0 0 0 rgba(166,106,21,.45) } 50%{ box-shadow:0 0 0 12px rgba(166,106,21,0) } }
@keyframes rise{ from{ opacity:0; transform:translateY(14px) } to{ opacity:1; transform:none } }

/* Abschluss */
.done-screen{ text-align:center; max-width:26rem; margin:1.5rem auto; animation:rise .5s ease both; }
.done-screen .bloom{ width:9rem; height:9rem; margin:0 auto 1rem; }
.done-screen h2{ font-family:var(--serif); font-weight:500; font-size:2rem; margin:0 0 .3rem; letter-spacing:-.015em; }
.done-screen p{ font-size:1.1rem; color:var(--ink-2); margin:0 0 2rem; }

/* Folge merken */
.spannegitter{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:.8rem;
  max-width:26rem; margin:0 auto;
}
.spannefeld{
  aspect-ratio:1/1;
  border:3px solid var(--line-2);
  border-radius:16px;
  background:var(--card);
  cursor:pointer;
  transition:background .12s, transform .12s;
}
.spannefeld.an{
  background:var(--akzent-voll); border-color:var(--akzent-deep);
  transform:scale(1.04);
}
.spannefeld.getippt{ background:var(--akzent-soft); border-color:var(--akzent); }
.spannefeld:disabled{ cursor:default; }

/* Was fehlt */
.schau{
  display:grid; gap:.7rem; justify-content:center;
  grid-template-columns:repeat(auto-fit, minmax(4.6rem, 5.6rem));
  max-width:30rem; margin:0 auto 1.4rem;
}
.schau div{
  aspect-ratio:1/1;
  display:grid; place-items:center;
  font-size:2.6rem; line-height:1;
  background:var(--card);
  border:2px solid var(--line-2);
  border-radius:14px;
  box-shadow:var(--shadow);
  animation:rise .3s ease both;
}

/* Kopfrechnen */
.aufgabe{
  font-size:2.6rem; font-weight:700; text-align:center;
  letter-spacing:.01em; margin:.4rem auto 1.6rem;
  font-variant-numeric:tabular-nums;
  color:var(--akzent-deep);
}

/* Geld abzählen */
.betrag{
  text-align:center; margin:0 auto 1.2rem;
}
.betrag .soll{
  font-size:2.4rem; font-weight:700; color:var(--akzent-deep);
  font-variant-numeric:tabular-nums; display:block;
}
.betrag .ist{
  font-size:1.1rem; color:var(--ink-2); font-variant-numeric:tabular-nums;
}
.gelegt{
  display:flex; flex-wrap:wrap; gap:.4rem; justify-content:center;
  min-height:4.4rem; padding:.7rem;
  border:2px dashed var(--line-2); border-radius:var(--radius);
  margin-bottom:1.2rem;
}
.gelegt:empty::after{
  content:"";
}
.kasse{
  display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center;
}
.muenze, .schein{
  display:grid; place-items:center;
  border:3px solid;
  font-weight:700; font-variant-numeric:tabular-nums;
  cursor:pointer; line-height:1;
  box-shadow:var(--shadow);
}
.muenze{
  width:4.2rem; height:4.2rem; border-radius:99px;
  font-size:1rem;
  background:#F0E3C2; border-color:#B99B58; color:#5C4A20;
}
.muenze.silber{ background:#E6E8EA; border-color:#A8AEB4; color:#3A4046; }
.schein{
  width:5.4rem; height:3.2rem; border-radius:8px;
  font-size:1.1rem;
  background:#DCE9DA; border-color:#7FA37A; color:#2C4A28;
}
.schein.blau{ background:#D9E4F2; border-color:#7C97BE; color:#22405F; }
.gelegt .muenze, .gelegt .schein{ transform:scale(.72); margin:-.5rem; }

/* Nicht vergessen — das Signal */
.glockenreihe{ min-height:5rem; display:flex; justify-content:center; align-items:center; }
.glocke{
  width:4.6rem; height:4.6rem; border-radius:99px;
  font-size:2.4rem; line-height:1;
  background:var(--honey-soft); border:4px solid var(--honey);
  cursor:pointer;
  animation:glow 1.1s ease infinite;
}
.glocke.erledigt{ background:var(--akzent-soft); border-color:var(--akzent); animation:none; }
.glocke.verpasst{ background:#F6DCD6; border-color:#B03A28; animation:none; opacity:.7; }

/* Namen merken — gezeichnete Gesichter */
.galerie{
  display:flex; flex-wrap:wrap; gap:1rem; justify-content:center;
  margin:0 auto 1.4rem; max-width:36rem;
}
.person{ margin:0; text-align:center; }
.person .kopf{
  width:6.4rem; height:6.4rem; margin:0 auto .4rem;
  border-radius:14px; overflow:hidden;
  background:var(--card); border:3px solid var(--line-2);
  box-shadow:var(--shadow);
}
.person.gross .kopf{ width:10rem; height:10rem; }
.person svg{ display:block; width:100%; height:100%; }
.person figcaption{ font-size:1.15rem; font-weight:650; }

/* Gut zugehört — der Text */
.geschichte{
  max-width:34rem; margin:0 auto 1.4rem;
  background:var(--card); border:2px solid var(--line);
  border-radius:var(--radius); padding:1.2rem 1.3rem;
  font-size:1.15rem; line-height:1.65;
  box-shadow:var(--shadow);
}

/* Alles finden — Explorationstraining */
.suchfeld{
  background:var(--card); border:2px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow);
  padding:.6rem .6rem .6rem 0;
  max-width:52rem; margin:0 auto;
}
.suchzeile{
  display:flex; align-items:center; gap:.5rem;
  padding:.35rem 0;
}
.suchzeile + .suchzeile{ border-top:1px solid var(--line); }
/* Der Anker ist der ganze Zweck der Übung: ein fester Punkt links,
   den man jedes Mal zuerst ansteuert. */
.anker{
  flex:none; width:.75rem; align-self:stretch; min-height:3rem;
  border-radius:99px; background:#C0392B;
}
.suchinhalt{
  flex:1; min-width:0;
  display:flex; align-items:center;
  justify-content:space-around; gap:.15rem; flex-wrap:nowrap;
}
.zeichen{
  background:none; border:none; padding:.2rem;
  line-height:1; cursor:default; border-radius:10px;
}
.zeichen.ziel{ cursor:pointer; }
.zeichen.weg{ opacity:.25; }
.zeichen.ziel:not(.weg){ outline:none; }

/* Übungskalender — die Belohnung ist der sichtbare Nachweis, dass man
   drangeblieben ist. Kein Punktestand, keine Serie, kein Vergleich:
   ein abgehakter Tag verschwindet nie wieder, ein ausgelassener wird
   nirgends angemahnt. */
.kalender{
  background:var(--card);
  border:2px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:1.2rem 1rem 1.4rem;
  max-width:34rem; margin:0 auto;
}
.kalender .monat{
  font-size:1.05rem; font-weight:650; color:var(--ink-2);
  margin:0 0 .8rem; text-align:center;
}
.wochentage, .wochen{
  display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:.35rem;
}
.wochentage{ margin-bottom:.45rem; }
@media (max-width:360px){
  .kalender{ padding:1rem .55rem 1.2rem; }
  .wochentage, .wochen{ gap:.22rem; }
}
.wochentage span{
  text-align:center; font-size:.82rem; font-weight:650;
  color:var(--ink-2); letter-spacing:.04em;
}
.tag{
  aspect-ratio:1/1;
  display:grid; place-items:center;
  border-radius:10px;
  border:2px solid var(--line);
  background:var(--paper-deep);
  font-size:.95rem; font-weight:600;
  color:var(--ink-2);
  font-variant-numeric:tabular-nums;
  position:relative;
}
.tag.leer{ background:transparent; border:2px dashed var(--line-2); color:var(--ink-2); font-weight:500; }
.tag.geuebt{
  background:var(--akzent-voll); border-color:var(--akzent-deep); color:#fff;
}
.tag.geuebt.viel{ box-shadow:inset 0 0 0 3px rgba(255,255,255,.45); }
.tag.heute{ outline:3px solid var(--honey); outline-offset:2px; }
.tag.kuenftig{ visibility:hidden; }

.bilanz{
  display:flex; gap:.7rem; flex-wrap:wrap;
  max-width:34rem; margin:1.1rem auto 0;
}
.bilanz .zahlkarte{
  flex:1 1 8rem;
  background:var(--card); border:2px solid var(--line);
  border-radius:14px; padding:.9rem 1rem;
  box-shadow:var(--shadow);
}
.bilanz .zahlkarte b{
  display:block; font-size:1.9rem; line-height:1.1;
  color:var(--akzent-deep); font-variant-numeric:tabular-nums;
}
.bilanz .zahlkarte span{ font-size:.94rem; color:var(--ink-2); }
.kalendertext{
  text-align:center; font-size:1.05rem; color:var(--ink-2);
  max-width:34rem; margin:1.2rem auto 0; text-wrap:balance;
}
.legende{
  display:flex; gap:1.1rem; justify-content:center; flex-wrap:wrap;
  margin-top:1rem; font-size:.9rem; color:var(--ink-2);
}
.legende i{
  display:inline-block; width:1rem; height:1rem; border-radius:5px;
  vertical-align:-.15em; margin-right:.35rem; border:2px solid var(--line);
}
.legende i.voll{ background:var(--akzent-voll); border-color:var(--akzent-deep); }

/* Abschluss */
.haken{
  width:6.5rem; height:6.5rem; margin:0 auto 1.2rem;
  border-radius:99px; background:var(--akzent-voll);
  display:grid; place-items:center;
  animation:pop .5s ease;
}
.haken svg{ width:3.4rem; height:3.4rem; stroke:#fff; }

/* Einstellungen / Verlauf */
.panel{ max-width:34rem; margin:0 auto; }
.panel h2{ font-family:var(--serif); font-weight:500; font-size:1.45rem; margin:1.8rem 0 .8rem; letter-spacing:-.01em; }
.panel h2:first-child{ margin-top:.2rem; }
.panel p.note{ color:var(--ink-2); font-size:.98rem; margin:.2rem 0 1rem; }
.seg{ display:flex; flex-wrap:wrap; gap:.5rem; }
.seg button{
  flex:1; min-height:3.6rem; padding:.3rem .5rem;
  background:var(--card); border:2px solid var(--line-2);
  border-radius:12px; font-size:1.05rem; font-weight:600; cursor:pointer;
}
.seg button[aria-pressed="true"]{ background:var(--akzent-voll); border-color:var(--akzent-deep); color:#fff; }

/* Kachelinhalt darf schrumpfen; lange Wörter werden bei sehr großer
   Schrift auf kleinen Handys getrennt statt aus der Kachel zu ragen. */
.tile > div{ min-width:0; }
.tile b{ hyphens:auto; -webkit-hyphens:auto; overflow-wrap:break-word; }

table.log{ width:100%; border-collapse:collapse; font-size:1rem; }
table.log th, table.log td{ text-align:left; padding:.6rem .5rem; border-bottom:1px solid var(--line); }
table.log th{ font-size:.88rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-2); font-weight:650; }
table.log td.n{ text-align:right; font-variant-numeric:tabular-nums; }
.scroller{ overflow-x:auto; }

.danger{ border-color:var(--line-2); color:var(--ink-2); }

/* ---------- Bericht ---------- */
.bericht{ max-width:46rem; margin:0 auto; }
.bericht-steuer{ margin:0 0 1.4rem; }
.feldlabel{ display:block; font-size:.95rem; color:var(--ink-2); margin:.4rem 0 .4rem; }
.feld{ width:100%; min-height:3.2rem; padding:.6rem .8rem; margin:0 0 1rem;
  font:inherit; font-size:1.05rem; color:var(--ink);
  background:var(--card); border:2px solid var(--line-2); border-radius:10px; }
.bericht-blatt{
  background:#FFFFFF; color:#1F1A15;
  border:1px solid var(--line-2); border-radius:12px;
  padding:1.4rem 1.2rem 1.2rem;
}
.bericht-marke{ margin:0 0 .3rem; font-size:.8rem; font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; color:#5A4E40; }
.bericht-kopf h2{ font-family:var(--serif); font-weight:500; font-size:1.6rem; margin:0 0 .4rem; }
.bericht-name{ margin:0 0 .2rem; font-size:1.05rem; font-weight:600; }
.bericht-meta{ margin:0 0 1.2rem; font-size:.95rem; color:#4A4035; }
.zusammenfassung{ display:grid; grid-template-columns:repeat(auto-fit, minmax(min(7.5rem,100%),1fr)); gap:.6rem; margin:0 0 1.4rem; }
.kennzahl{ border:1px solid #D8CDB8; border-radius:10px; padding:.7rem .8rem; }
.kennzahl b{ display:block; font-size:1.5rem; font-variant-numeric:tabular-nums lining-nums; }
.kennzahl span{ font-size:.9rem; color:#4A4035; }
.bericht-blatt h3{ font-family:var(--serif); font-weight:500; font-size:1.2rem; margin:1.2rem 0 .5rem; }
.berichttab{ width:100%; border-collapse:collapse; font-size:.95rem; }
.berichttab th, .berichttab td{ text-align:left; padding:.45rem .4rem; border-bottom:1px solid #DDD3C2; vertical-align:top; }
.berichttab th{ font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; color:#4A4035; font-weight:700; }
.berichttab td.n, .berichttab th.n{ text-align:right; font-variant-numeric:tabular-nums lining-nums; }
.bericht-hinweis{ margin:1.4rem 0 .6rem; padding:.7rem .8rem; border-left:4px solid #8E6A3C;
  background:#FAF5EA; font-size:.92rem; line-height:1.5; }
.bericht-fuss{ margin:0; font-size:.82rem; color:#5A4E40; }

@media print{
  @page{ size:A4; margin:16mm 14mm; }
  html, body{ background:#FFFFFF !important; }
  body{ color:#000; font-size:11pt; }
  .bar, .bericht-steuer, .hilfe-hinter, .textknopf{ display:none !important; }
  main{ padding:0 !important; }
  .bericht{ max-width:none; }
  .bericht-blatt{ border:none; padding:0; border-radius:0; }
  .berichttab{ font-size:10pt; }
  .berichttab tr, .kennzahl{ break-inside:avoid; }
  .bericht-blatt h3{ break-after:avoid; }
  .scroller{ overflow:visible !important; }
}
.iconbtn.rund{ min-width:56px; padding:0; justify-content:center; }
.iconbtn.spricht{ background:var(--ink); color:var(--card); border-color:var(--ink); }
.textknopf.links{ margin:.4rem 0 0; }
.hilfe-hinter{
  position:fixed; inset:0; z-index:80;
  background:rgba(52,44,35,.55);
  display:flex; align-items:flex-end; justify-content:center;
  padding:1rem;
}
.hilfe{
  width:100%; max-width:34rem; max-height:88dvh; overflow:auto;
  background:var(--card); color:var(--ink);
  border-radius:16px 16px 12px 12px; padding:1.3rem 1.2rem 1.1rem;
  box-shadow:0 -8px 40px rgba(52,44,35,.35);
}
.hilfe h2{ font-family:var(--serif); font-weight:500; font-size:1.55rem; margin:0 0 1rem; }
.hilfe .hilfe-name{ margin:0 0 .15rem; font-size:.86rem; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); }
.hilfe ol, .hilfe ul{ margin:0 0 1.2rem; padding-left:1.4rem; }
.hilfe li{ margin-bottom:.6rem; font-size:1.05rem; line-height:1.5; }
.hilfe .merksatz{ margin:0 0 1rem; }
body.hilfe-auf{ overflow:hidden; }
@media (min-width:40rem){ .hilfe-hinter{ align-items:center; } }
.sicherungsfeld{
  width:100%; margin:0 0 .75rem;
  font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size:.85rem; line-height:1.4;
  padding:.7rem; border:2px solid var(--line-2); border-radius:12px;
  background:var(--card); color:var(--ink); resize:vertical;
}

/* Tagesrunde — der kürzeste Weg zum Üben */
.rundenknopf{
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  width:100%; text-align:left;
  padding:1.15rem 1.2rem;
  margin:0 0 1.8rem;
  background:#A8563A; border:none;
  border-radius:var(--radius); color:#FDF8EF;
  box-shadow:var(--shadow); cursor:pointer;
}
.rundenknopf:active{ transform:translateY(1px); }
.rundenknopf b{ display:block; font-family:var(--serif); font-size:1.35rem; font-weight:500; }
.rundenknopf small{ display:block; font-size:.97rem; margin-top:.2rem; }
.rundenknopf .pfeil{ flex:none; width:2rem; height:2rem; }
.rundenknopf .pfeil svg{ width:100%; height:100%; }
/* Heute schon geschafft: ruhige Fläche statt Aufforderung */
.rundenknopf.erledigt{
  background:var(--card); color:var(--ink);
  border:2px solid #4F6E43;
}
.rundenknopf.erledigt .pfeil{ color:#3E5A34; }
.rundenknopf.erledigt small{ opacity:1; color:var(--ink-2); }
.textknopf{
  display:block; margin:-1.2rem 0 1.6rem auto; padding:.6rem .4rem;
  background:none; border:none; cursor:pointer;
  font-size:.95rem; color:var(--ink-2); text-decoration:underline;
  text-underline-offset:.2em; min-height:2.75rem;
}
/* Wo man in der Runde steht */
.rundenleiste{
  display:flex; align-items:center; justify-content:space-between; gap:.8rem;
  max-width:52rem; margin:0 auto 1rem;
  padding:.55rem .9rem;
  background:var(--card); border:1px solid var(--line-2); border-radius:10px;
  font-size:.95rem; font-weight:600; color:var(--ink);
}
.rundenleiste .punkte{ display:flex; gap:.35rem; }
.rundenleiste i{ width:.8rem; height:.8rem; border-radius:99px;
  border:2px solid var(--ink-2); background:transparent; }
.rundenleiste i.fertig{ background:var(--ink-2); }
.rundenleiste i.jetzt{ background:var(--akzent-voll); border-color:var(--akzent-deep); }


/* Noch auszufüllen — fällt absichtlich auf, damit es niemand übersieht */
.platzhalter{
  background:var(--honey-soft);
  border:2px dashed var(--honey);
  border-radius:12px;
  padding:.8rem 1rem;
  margin:.6rem 0 1rem;
  color:var(--ink);
  font-size:1rem;
}
.platzhalter b{ display:block; color:var(--honey); font-size:.9rem;
  text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; }
.panel p.fliess{ font-size:1.02rem; line-height:1.55; margin:.2rem 0 1rem; max-width:60ch; }
.panel a{ color:var(--akzent-deep); text-underline-offset:.2em; }

/* Auf schmalen Geräten — vor allem bei großer Schrift — stapeln,
   statt Überschrift und Beschreibung nebeneinander zu quetschen. */
@media (max-width:34rem){
  .sectionhead{ flex-direction:column; align-items:flex-start; gap:.15rem; }
  main{ padding-left:.6rem; padding-right:.6rem; }
  .iconbtn{ padding:0 13px; gap:6px; }
}

@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
</style>
</head>

    <button class="iconbtn" id="back" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      <span class="zurueck-text">Zurück</span>
    </button>
    <h1 id="title">Kopf &amp; Hand</h1>
    <button class="iconbtn rund" id="hilfebtn" hidden aria-label="So wird gespielt" title="So wird gespielt">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.4-2.7 4.1"/><path d="M12 17.6h.01" stroke-width="3"/></svg>
    </button>
    <button class="iconbtn rund" id="vorlesebtn" hidden aria-label="Vorlesen" title="Vorlesen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18.3 6.5a7.6 7.6 0 0 1 0 11"/></svg>
    </button>
    <button class="iconbtn" id="gardenbtn" title="Meine Übungen" aria-label="Meine Übungen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><path d="M8.5 14.5l2.5 2.5 4.5-4.5"/></svg>
      <span id="gcount">0</span>
    </button>

</div>

<script>
(() => {
"use strict";

/* ==================================================================
   WIE WIRD DIE SEITE ANGEBOTEN?
   ------------------------------------------------------------------
   false = Der Link wird nur persönlich weitergegeben. Die Seite wird
           nicht beworben, nicht verlinkt und von Suchmaschinen
           ausgeschlossen. Es wird kein Impressum angezeigt.

   true  = Die Seite wird öffentlich angeboten. Dann muss der Block
           IMPRESSUM darunter ausgefüllt sein — für öffentlich
           angebotene Telemedien ist ein Impressum mit ladungsfähiger
           Anschrift vorgeschrieben (§ 5 DDG), ein Postfach genügt
           nicht. Fehlen die Angaben, weist die App darauf hin.
   ================================================================== */

const OEFFENTLICH = false;

const IMPRESSUM = {
  name:    "",          // z. B. "Jonas Mustermann"
  strasse: "",          // z. B. "Musterweg 12"
  ort:     "",          // z. B. "12345 Musterstadt"
  email:   "",          // z. B. "kontakt@example.de"
  telefon: ""           // freiwillig, darf leer bleiben
};

// Wo die Seite liegt — steht in der Datenschutzangabe.
// Stand dieser Fassung — erscheint unter „Über diese App“ und im Bericht
const VERSION = "1.1";
const STAND = "November 2026";

/* Was ist neu? Bei JEDEM Update hier oben einen Eintrag mit der neuen
   Versionsnummer ergänzen und VERSION oben hochzählen. Wer die App schon
   benutzt hat, sieht beim ersten Öffnen danach genau einmal ein Fenster
   mit diesen Punkten. Kurz und in Alltagssprache halten.
   bauen.py bricht ab, wenn für VERSION kein Eintrag existiert. */
const NEUIGKEITEN = [
  { version: "1.1", punkte: [
    "Die App kann vorlesen: Tippen Sie oben auf den Lautsprecher.",
    "Jede Übung erklärt sich jetzt selbst. Das Fragezeichen oben hilft auch mitten in der Übung.",
    "Die Tagesrunde merkt sich, wo Sie stehen, und zeigt „Übung 2 von 3“.",
    "Die Übungen auf der Startseite sind in Gruppen sortiert, die sich auf- und zuklappen lassen.",
    "Neu unter „Meine Übungen“: ein Bericht zum Ausdrucken, etwa für Therapie oder Arzt.",
    "Memory deckt nicht mehr von selbst alle Karten auf. Wer das möchte, schaltet es in den Einstellungen ein."
  ]}
];

const HOSTER = "GitHub, Inc. (GitHub Pages)";


/* ================================================================== */

const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
const rint = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));

/* Merkt sich je Inhaltstopf, was zuletzt dran war, und meidet es beim
   nächsten Griff. So bringt auch der dritte Durchgang hintereinander
   noch Neues. Reicht der Vorrat nicht, wird die Sperre gelockert. */
const zuletztGenutzt = {};
function frischeAuswahl(topf, pool, anzahl, gedaechtnis) {
  const merke = gedaechtnis == null ? anzahl * 2 : gedaechtnis;
  const alt = zuletztGenutzt[topf] || [];
  let frei = pool.filter(x => !alt.includes(x));
  if (frei.length < anzahl) {
    // Vorrat zu klein: nur noch den letzten Durchgang meiden
    const kurz = alt.slice(0, anzahl);
    frei = pool.filter(x => !kurz.includes(x));
    if (frei.length < anzahl) frei = pool.slice();
  }
  const gewaehlt = shuffle(frei).slice(0, anzahl);
  zuletztGenutzt[topf] = [...gewaehlt, ...alt].slice(0, merke);
  return gewaehlt;
}

const view = $("#view"), backBtn = $("#back"), titleEl = $("#title"), gcount = $("#gcount");

/* ================= Speicher ================= */

const KEY = "kopfundhand.v1";
// Ganz neue Nutzer bekommen keine „Was ist neu“-Meldung — für sie ist alles neu
const ersterStart = (() => { try { return !localStorage.getItem(KEY); } catch { return false; } })();
const store = Object.assign({
  gesamt: 0,          // abgeschlossene Übungen insgesamt
  tage: {},           // "2026-08-16" -> Anzahl an diesem Tag
  sprache: true,      // sprachlastige Übungen anzeigen? (bei Aphasie aus)
  letzteRunde: [],    // welche Übungen die letzte Tagesrunde hatte
  runde: null,        // laufende Tagesrunde { datum, ids:[], stufen:[], index }
  rundenFertig: {},   // "2026-11-14" -> Zahl der heute abgeschlossenen Runden
  gruppenOffen: {},   // welche Gruppen auf der Startseite aufgeklappt sind
  gesehen: {},        // Übungen, deren Anleitung schon einmal gezeigt wurde
  anleitung: "erstes",// „erstes“: nur beim ersten Mal · „immer“: vor jedem Durchgang
  memoryHilfe: false, // Memory: nach mehreren Fehlgriffen kurz alle Karten zeigen
  version: "",        // zuletzt gesehene App-Version (für „Neu in Kopf & Hand“)
  vorlesen: "knopf",  // „aus“ · „knopf“: auf Tippen · „auto“: von selbst
  berichtName: "",    // nur für den Ausdruck, bleibt auf dem Gerät
  text: "normal",
  kontrast: "normal",
  ton: true,
  log: []            // { d:"2026-08-16", spiel:"Bilderpaare", stufe:"Mittel", fehler:3, sek:92 }
}, load());

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}

/* Übergang von der früheren Gartenfassung: die gesammelten Blumen
   waren nichts anderes als die Zahl abgeschlossener Übungen, und die
   Tage lassen sich aus dem Verlauf nachbilden. Niemand verliert also
   seinen bisherigen Stand. */
function migriere() {
  if (typeof store.tage !== "object" || store.tage === null) store.tage = {};
  if (!store.gesamt && store.flowers) store.gesamt = store.flowers;
  if (!Object.keys(store.tage).length && Array.isArray(store.log)) {
    store.log.forEach(r => { if (r && r.d) store.tage[r.d] = (store.tage[r.d] || 0) + 1; });
  }
  if ("flowers" in store) delete store.flowers;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {}
}
function applySettings() {
  document.documentElement.className = store.text === "normal" ? "" : "t-" + store.text;
  document.body.classList.toggle("hc", store.kontrast === "stark");
  gcount.textContent = store.gesamt;
  if (typeof aktualisiereVorleseKnopf === "function") aktualisiereVorleseKnopf();
  // Der Hintergrund hängt vom Kontrastmodus ab, also neu setzen
  if (typeof setAkzent === "function") setAkzent(aktuelleFarbe);
}

/* ================= Ton ================= */

let ac = null;
function tone(freq, dur = .16, type = "sine", gain = .16) {
  if (!store.ton) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, ac.currentTime);
    g.gain.linearRampToValueAtTime(gain, ac.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
    o.connect(g).connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur + .02);
  } catch {}
}
const sndGood = () => { tone(660, .13, "sine"); setTimeout(() => tone(880, .18, "sine"), 90); };
const sndNope = () => tone(196, .22, "triangle", .11);
const sndDone = () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .3, "sine", .13), i * 130)); };


/* ================= Vorlesen =================
   Die App ist textlastig, und nicht jeder kann gut lesen — wegen der
   Augen, wegen einer Sprachstörung, oder weil Lesen nach einem
   Schlaganfall einfach anstrengt. Es gibt drei Stufen: aus, auf Tippen
   des Lautsprecher-Knopfs, oder von selbst bei jedem neuen Schritt.

   Es werden nur Stimmen benutzt, die auf dem Gerät selbst laufen.
   Manche Browser bieten zusätzlich Stimmen an, die den Text über das
   Netz an einen fremden Dienst schicken. Das widerspräche der Zusage,
   dass nichts dieses Gerät verlässt — also bleiben sie außen vor. */

const sprachAusgabe = ("speechSynthesis" in window && "SpeechSynthesisUtterance" in window)
  ? window.speechSynthesis : null;
let stimme = null, aktuelleAeusserung = null;

/* Manche Systeme bringen Spaß- oder Roboterstimmen mit („Grandma“,
   „Grandpa“, „Eddy“ …). Die klingen für ältere Menschen befremdlich
   oder schwer verständlich und werden nie gewählt. Erweiterte und
   Premium-Stimmen werden bevorzugt. */
const SPASSSTIMMEN = /grandma|grandpa|eddy|flo\b|reed|rocko|sandy|shelley|bad news|bahh|bells|boing|bubbles|cellos|jester|organ|superstar|trinoids|whisper|wobble|zarvox|albert|fred|junior|kathy|ralph|good news/i;
function waehleStimme() {
  if (!sprachAusgabe) return;
  const deutsch = sprachAusgabe.getVoices()
    .filter(v => /^de([-_]|$)/i.test(v.lang) && v.localService && !SPASSSTIMMEN.test(v.name));
  const wert = v => (/premium|enhanced|erweitert|neural/i.test(v.name) ? 4 : 0)
                  + (/^de[-_]DE/i.test(v.lang) ? 2 : 0)
                  + (/anna|petra|markus|helena|yannick|katja|conrad|marlene|hans/i.test(v.name) ? 1 : 0)
                  + (v.default ? 1 : 0);
  stimme = deutsch.sort((a, b) => wert(b) - wert(a))[0] || null;
  aktualisiereVorleseKnopf();
}
if (sprachAusgabe) {
  waehleStimme();
  if (sprachAusgabe.addEventListener) sprachAusgabe.addEventListener("voiceschanged", waehleStimme);
  else sprachAusgabe.onvoiceschanged = waehleStimme;
  /* iOS spricht programmgesteuert erst, nachdem einmal innerhalb einer
     Berührung gesprochen wurde. Eine stumme Äußerung beim ersten
     Antippen schaltet das frei. */
  document.addEventListener("pointerdown", () => {
    try { const u = new SpeechSynthesisUtterance(""); u.volume = 0; sprachAusgabe.speak(u); } catch {}
  }, { once: true });
}

function aktualisiereVorleseKnopf() {
  const b = $("#vorlesebtn");
  if (b) b.hidden = !(stimme && store.vorlesen !== "aus");
}

/** Macht Text sprechbar: Rechenzeichen, Beträge, Bildzeichen. */
function fuerSprache(t) {
  return String(t)
    .replace(/[\p{Extended_Pictographic}️‍]/gu, " ")
    .replace(/×/g, " mal ").replace(/÷/g, " geteilt durch ").replace(/−/g, " minus ")
    .replace(/(\d)\s*-\s*(\d)/g, "$1 minus $2")
    .replace(/\+/g, " plus ").replace(/=/g, " gleich ")
    .replace(/(\d+)\s*%/g, "$1 Prozent")
    .replace(/(\d+),(\d{2})\s*€/g, (_, e, c) => e + " Euro" + (c === "00" ? "" : " " + (+c)))
    .replace(/€/g, " Euro ").replace(/\bct\b/g, " Cent").replace(/&/g, " und ")
    .replace(/…/g, " ").replace(/\s*[—–·]\s*/g, ", ")
    .replace(/\s*\n+\s*/g, ". ")
    .replace(/([.!?:])\s*\.(\s|$)/g, "$1$2").replace(/,\s*\./g, ".")
    .replace(/\s+/g, " ").trim();
}

function setzeSprechZustand(an) {
  const b = $("#vorlesebtn");
  if (!b) return;
  b.classList.toggle("spricht", an);
  b.setAttribute("aria-pressed", String(an));
  b.setAttribute("aria-label", an ? "Vorlesen anhalten" : "Vorlesen");
}

function sage(text) {
  if (!sprachAusgabe || !stimme) return;
  const t = fuerSprache(text);
  if (!t) return;
  sprachAusgabe.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.voice = stimme; u.lang = stimme.lang; u.rate = .9; u.pitch = 1;
  u.onstart = () => { if (u === aktuelleAeusserung) setzeSprechZustand(true); };
  u.onend = u.onerror = () => { if (u === aktuelleAeusserung) setzeSprechZustand(false); };
  aktuelleAeusserung = u;
  sprachAusgabe.speak(u);
}
function stilleSprache() {
  aktuelleAeusserung = null;
  if (sprachAusgabe) sprachAusgabe.cancel();
  setzeSprechZustand(false);
}

const hatBuchstaben = t => /[A-Za-zÄÖÜäöüß0-9]/.test(t);
const sichtbar_ = n => n && !n.closest("[hidden]");

/** Was auf dem aktuellen Bildschirm vorgelesen werden soll. */
function bildschirmText(nurWoerterAlsAuswahl) {
  const teile = [];
  // Jeder Teil endet mit einem Satzzeichen, damit die Stimme Pausen macht
  const nimm = t => {
    t = (t || "").replace(/\s*\n+\s*/g, ". ").trim();
    if (!t) return;
    if (!/[.!?:…]$/.test(t)) t += ".";
    teile.push(t);
  };

  if (hilfeOffen) {
    const h = hilfeOffen.hinter;
    nimm(h.querySelector(".hilfe-name").textContent);
    nimm(h.querySelector("h2").textContent);
    h.querySelectorAll("li").forEach(li => nimm(li.textContent));
    h.querySelectorAll(".merksatz").forEach(m => nimm(m.textContent));
    return teile.join(" ");
  }
  const regeln = view.querySelector(".regeln");
  if (regeln) {
    nimm(titleEl.textContent + ".");
    regeln.querySelectorAll("h2, .fliess, li, .merksatz").forEach(n => nimm(n.textContent));
    return teile.join(" ");
  }
  const fertig = view.querySelector(".done-screen");
  if (fertig) {
    fertig.querySelectorAll("h2, p").forEach(n => nimm(n.textContent));
    return teile.join(" ");
  }
  const wahl = view.querySelector(".choose");
  if (wahl) {
    nimm(titleEl.textContent + ".");
    wahl.querySelectorAll(":scope > p").forEach(n => nimm(n.textContent));
    nimm("Zur Wahl: Leicht, Mittel oder Schwerer.");
    return teile.join(" ");
  }
  const stage = view.querySelector(".stage");
  if (stage) {
    const leiste = view.querySelector(".rundenleiste");
    if (leiste) nimm(leiste.firstChild.textContent + ".");
    const pr = stage.querySelector(".prompt");
    if (pr) nimm(pr.innerText);
    const satz = stage.querySelector(".saying");
    if (satz) {
      let t = "";
      satz.childNodes.forEach(n => {
        if (n.nodeType === 1 && n.classList.contains("gap")) {
          const g = n.textContent.replace(/[\s …]/g, "");
          t += g ? " " + n.textContent + " " : " … Lücke … ";
        } else t += n.textContent;
      });
      nimm(t);
    }
    const aufgabe = stage.querySelector(".aufgabe");
    if (sichtbar_(aufgabe)) nimm(aufgabe.textContent);
    const soll = stage.querySelector(".betrag .soll");
    if (soll) nimm("Betrag: " + soll.textContent + ". " + stage.querySelector(".betrag .ist").textContent);
    const geschichte = stage.querySelector(".geschichte");
    if (sichtbar_(geschichte)) nimm(geschichte.textContent);
    // Wörter, die man sich gerade merken soll (nicht die Bilder)
    const merkKnopf = [...stage.querySelectorAll(".btn.primary")].find(b => !b.hidden && /gemerkt/.test(b.textContent));
    if (merkKnopf) {
      const woerter = [...stage.querySelectorAll(".schau div, .person figcaption")]
        .map(d => d.textContent.trim()).filter(hatBuchstaben);
      if (woerter.length) nimm(woerter.join(", ") + ".");
    }
    const optionen = [...stage.querySelectorAll(".words .word")]
      .filter(b => !b.disabled || b.classList.contains("ok"))
      .map(b => (b.querySelector("span") || b).textContent.trim())
      .filter(hatBuchstaben);
    const nurZahlen = optionen.every(o => /^[\d\s.,]+$/.test(o));
    if (optionen.length && !(nurWoerterAlsAuswahl && nurZahlen))
      nimm("Zur Auswahl: " + optionen.join(", ") + ".");
    return teile.join(" ");
  }
  // Übrige Bildschirme: Titel und das Wesentliche
  nimm(titleEl.textContent + ".");
  view.querySelectorAll(".lede, .rundenknopf, .kalendertext, .zahlkarte, .bericht-kopf .zusammenfassung, .panel > p.fliess")
    .forEach(n => nimm(n.innerText));
  return teile.join(" ");
}

$("#vorlesebtn").addEventListener("click", () => {
  if ($("#vorlesebtn").classList.contains("spricht")) stilleSprache();
  else sage(bildschirmText(false));
});

/* Von selbst vorlesen: nur wenn sich der eigentliche Inhalt ändert —
   die Aufforderung, die Rechnung, der Satz, die Anleitung. Zähler wie
   „2 von 6“ lösen nichts aus, sonst würde bei jedem Tippen geredet. */
let autoSchluessel = "", autoUhr = null;
function autoKennung() {
  if (hilfeOffen) return "hilfe:" + hilfeOffen.hinter.querySelector(".hilfe-name").textContent;
  const k = [];
  const r = view.querySelector(".regeln, .done-screen, .choose");
  if (r) k.push(titleEl.textContent, r.className, (r.querySelector("h2") || {}).textContent);
  const pr = view.querySelector(".stage .prompt");
  if (pr) k.push([...pr.childNodes].filter(n => n.nodeName !== "SMALL").map(n => n.textContent).join(""));
  const a = view.querySelector(".stage .aufgabe");
  if (sichtbar_(a)) k.push(a.textContent);
  const sz = view.querySelector(".stage .saying");
  if (sz) k.push(sz.textContent.replace(/[\s ]/g, ""));
  const g = view.querySelector(".stage .geschichte");
  if (sichtbar_(g)) k.push(g.textContent.slice(0, 40));
  return k.join("|");
}
new MutationObserver(() => {
  if (store.vorlesen !== "auto" || !stimme) return;
  clearTimeout(autoUhr);
  autoUhr = setTimeout(() => {
    const k = autoKennung();
    if (!k || k === autoSchluessel) return;
    autoSchluessel = k;
    sage(bildschirmText(true));
  }, 450);
}).observe(document.body, { subtree: true, childList: true, characterData: true });

/* ================= Navigation ================= */

let onBack = null;
let hilfeSpiel = null;
/* spiel: Gehört der Bildschirm zu einer Übung, erscheint der Hilfe-
   Knopf, und der Kalender-Knopf weicht, damit auf dem Handy Platz
   für den Titel bleibt. */
function screen(title, backTo, spiel) {
  if (typeof stilleSprache === "function") stilleSprache();
  schliesseHilfe(false);
  view.innerHTML = "";
  titleEl.textContent = title;
  onBack = backTo || null;
  backBtn.hidden = !backTo;
  hilfeSpiel = spiel || null;
  $("#hilfebtn").hidden = !spiel;
  $("#gardenbtn").hidden = !!spiel;
  window.scrollTo(0, 0);
  return view;
}

/* ---------- Anleitung als Fenster über der laufenden Übung ----------
   Öffnet sich, ohne die Übung abzubrechen. Wer mitten im Spiel den
   Faden verliert, soll nachlesen können, ohne von vorn anzufangen. */
let hilfeOffen = null;
function oeffneFenster(oben, titel, inhalt, knopfText, ausSpiel) {
  const zurueckFokus = document.activeElement;
  const hinter = el("div", "hilfe-hinter");
  const box = el("div", "hilfe");
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-modal", "true");
  box.setAttribute("aria-labelledby", "hilfe-titel");
  const h = el("h2", null, titel);
  h.id = "hilfe-titel";
  box.append(el("p", "hilfe-name", oben), h, ...inhalt);
  const zu = el("button", "btn primary", knopfText);
  zu.addEventListener("click", () => schliesseHilfe(true));
  box.append(zu);
  hinter.append(box);
  hinter.addEventListener("click", e => { if (e.target === hinter) schliesseHilfe(true); });
  document.body.append(hinter);
  document.body.classList.add("hilfe-auf");
  hilfeOffen = { hinter, zurueckFokus, ausSpiel };
  zu.focus();
}

function zeigeHilfe(game) {
  if (!game || hilfeOffen) return;
  if (run && run.vorHilfe) run.vorHilfe();
  const inhalt = [];
  const ol = el("ol");
  (game.regeln || []).forEach(r => ol.append(el("li", null, r)));
  inhalt.push(ol);
  if (game.merksatz) inhalt.push(el("p", "merksatz", game.merksatz));
  if (game.tipp) {
    const t = el("p", "merksatz");
    t.append(el("b", null, "Ein Kniff dazu: "), document.createTextNode(game.tipp));
    inhalt.push(t);
  }
  oeffneFenster(game.name, "So wird gespielt", inhalt,
    run && hilfeSpiel === game && view.querySelector(".stage") ? "Weiter üben" : "Verstanden", true);
}

/* „Neu in Kopf & Hand“: einmal nach jedem Update, nur für bisherige Nutzer.
   Wer mehrere Updates übersprungen hat, sieht die Punkte aller verpassten
   Versionen, die neueste zuerst. */
function versionsZahl(v) { return String(v || "0").split(".").map(Number); }
function neuerAls(a, b) {
  const x = versionsZahl(a), y = versionsZahl(b);
  for (let i = 0; i < Math.max(x.length, y.length); i++) {
    if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0);
  }
  return false;
}
function pruefeNeuigkeiten() {
  if (ersterStart) { store.version = VERSION; save(); return; }
  if (store.version === VERSION) return;
  const offen = NEUIGKEITEN
    .filter(n => !neuerAls(n.version, VERSION))
    .filter(n => store.version ? neuerAls(n.version, store.version) : n.version === VERSION)
    .sort((a, b) => neuerAls(a.version, b.version) ? -1 : 1);
  store.version = VERSION;     // gleich merken: das Fenster kommt nur einmal
  save();
  const punkte = offen.flatMap(n => n.punkte);
  if (!punkte.length || hilfeOffen) return;
  const ul = el("ul");
  punkte.forEach(t => ul.append(el("li", null, t)));
  oeffneFenster("Version " + VERSION + " · " + STAND, "Neu in Kopf & Hand", [ul], "Alles klar", false);
}
function schliesseHilfe(mitRueckruf) {
  if (!hilfeOffen) return;
  const { hinter, zurueckFokus, ausSpiel } = hilfeOffen;
  hilfeOffen = null;
  hinter.remove();
  document.body.classList.remove("hilfe-auf");
  if (typeof stilleSprache === "function") stilleSprache();
  if (zurueckFokus && document.body.contains(zurueckFokus)) zurueckFokus.focus();
  // Manche Übungen müssen nach dem Lesen etwas wiederholen — etwa die
  // Folge, die währenddessen unbemerkt aufgeleuchtet ist
  if (mitRueckruf && ausSpiel && run && run.nachHilfe) run.nachHilfe();
}

let aktuelleFarbe = null;
function setAkzent(name) {
  aktuelleFarbe = name;
  const s = document.documentElement.style;
  const f = FARBEN[name];
  if (!f) {
    ["--akzent","--akzent-voll","--akzent-deep","--akzent-soft","--wash"].forEach(k => s.removeProperty(k));
    return;
  }
  s.setProperty("--akzent", f.akzent);
  s.setProperty("--akzent-voll", f.voll);
  s.setProperty("--akzent-deep", f.deep);
  s.setProperty("--akzent-soft", f.soft);
  // Im Starkkontrast bleibt der Hintergrund weiß
  s.setProperty("--wash", store.kontrast === "stark" ? "#FFFFFF" : f.wash);
}

function faerbeKachel(t, farbe) {
  const f = FARBEN[farbe];
  if (!f) return;
  // Symbolfarbe so dunkel, dass sie auf der Tönung mindestens 3:1 erreicht
  t.style.setProperty("--kachel-farbe", f.ikon);
  /* Im Starkkontrast weiße Fläche und harter Rand. Die Übungsfarbe
     bleibt im Symbol erhalten — sie ist die Wiedererkennung, auf die
     niemand verzichten soll. Inline gesetzte Eigenschaften schlagen
     jede Regel aus dem Stylesheet, also muss das hier entschieden
     werden und nicht dort. */
  const stark = store.kontrast === "stark";
  t.style.setProperty("--kachel-bg", stark ? "#FFFFFF" : f.soft);
  t.style.setProperty("--kachel-line", stark ? "#333333" : f.rand);
}

function showHome() {
  setAkzent(null);
  const v = screen("Kopf & Hand", null);
  const lede = el("p", "lede", "Kleine Übungen für zwischendurch. Es gibt kein Zeitlimit und nichts, was man verlieren kann.");
  v.append(lede);

  /* Der kürzeste Weg zum Üben steht ganz oben — wer nicht wählen mag
     oder nicht wählen kann, braucht nur einen Knopf. */
  /* Der Knopf kennt drei Zustände: Runde offen, Runde heute schon
     geschafft, oder noch nichts. Vorher sah er immer gleich aus —
     wer vergisst, ob er heute schon geübt hat, sah es nirgends. */
  const rundeKnopf = el("button", "rundenknopf");
  const rk = el("div");
  const rpfeil = el("div", "pfeil");
  const PFEIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  const HAKEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg>';
  let klick = zeigeRunde;
  if (runde && runde.index < runde.spiele.length) {
    rk.append(el("b", null, "Runde fortsetzen"));
    rk.append(el("small", null, "Übung " + (runde.index + 1) + " von " + runde.spiele.length
      + ": " + runde.spiele[runde.index].game.name));
    rpfeil.innerHTML = PFEIL;
    klick = naechsteAusRunde;
  } else if (rundenHeute() > 0) {
    rundeKnopf.classList.add("erledigt");
    rk.append(el("b", null, rundenHeute() === 1
      ? "Heutige Runde erledigt" : rundenHeute() + " Runden heute erledigt"));
    rk.append(el("small", null, "Gut gemacht. Wer mag, kann noch eine Runde üben."));
    rpfeil.innerHTML = HAKEN;
  } else {
    rk.append(el("b", null, "Heutige Runde"));
    rk.append(el("small", null, "Drei Übungen, etwa zehn Minuten — selbst zusammengestellt"));
    rpfeil.innerHTML = PFEIL;
  }
  rundeKnopf.append(rk, rpfeil);
  rundeKnopf.addEventListener("click", klick);
  v.append(rundeKnopf);
  if (runde && runde.index < runde.spiele.length) {
    const ende = el("button", "textknopf", "Runde beenden");
    ende.addEventListener("click", () => { runde = null; rundeSpeichern(); showHome(); });
    v.append(ende);
  }

  /* Vier kleinere Gruppen statt zweier großer: Bei zwölf Übungen ist
     eine Liste aus neun Kacheln unter einer Überschrift zu viel auf
     einmal — gerade für die Zielgruppe. */
  const kapitel = [
    ["merken",  "Sofort merken",    "Behalten und gleich abrufen", "petrol"],
    ["spaeter", "Später erinnern",  "Was nach einer Weile noch da ist", "stahlblau"],
    ["sprache", "Sprache & Wissen", "Wörter, Sätze und Begriffe",  "pflaume"],
    ["zahlen",  "Zahlen",           "Rechnen und Ordnen",          "bordeaux"],
    ["hand",    "Sehen & Bewegen",  "Blick führen, zielen, ziehen", "terrakotta"]
  ];
  /* Die Gruppen sind einklappbar. Aufgeklappt war die Startseite auf
     dem Handy über vier Bildschirme lang — zwanzig Kacheln sind zu
     viel auf einmal. Jetzt steht oben die Runde, darunter fünf Zeilen
     wie ein Inhaltsverzeichnis. Was offen war, bleibt offen. */
  const gruppen = el("div", "gruppen");
  v.append(gruppen);
  for (const [art, h, sub, kfarbe] of kapitel) {
    const spiele = verfuegbareSpiele().filter(g => g.art === art);
    if (!spiele.length) continue;
    const offen = !!store.gruppenOffen[art];
    // Überschrift außen, Knopf innen — so verlangt es das Muster für
    // aufklappbare Abschnitte, damit Vorleseprogramme beides erkennen
    const head = el("h2", "gruppe-h");
    const kopf = el("button", "gruppenkopf");
    kopf.setAttribute("aria-expanded", String(offen));
    kopf.setAttribute("aria-controls", "gruppe-" + art);
    const txt = el("span", "gruppentext");
    const titel = el("span", "titel", h);
    titel.style.setProperty("--kapitel", FARBEN[kfarbe].deep);
    txt.append(titel, el("span", "unter",
      sub + " · " + spiele.length + (spiele.length === 1 ? "\u00A0Übung" : "\u00A0Übungen")));
    const chev = el("span", "chev");
    chev.setAttribute("aria-hidden", "true");
    chev.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
    kopf.append(txt, chev);
    head.append(kopf);
    const grid = el("div", "grid");
    grid.id = "gruppe-" + art;
    grid.hidden = !offen;
    kopf.addEventListener("click", () => {
      const auf = grid.hidden;
      grid.hidden = !auf;
      kopf.setAttribute("aria-expanded", String(auf));
      store.gruppenOffen[art] = auf; save();
    });
    spiele.forEach(g => {
      const t = el("button", "tile");
      faerbeKachel(t, g.farbe);
      const ic = el("div", "ic"); ic.innerHTML = ICONS[g.icon];
      const box = el("div");
      box.append(el("b", null, g.name), el("small", null, g.sub));
      t.append(ic, box);
      t.addEventListener("click", () => chooseLevel(g));
      grid.append(t);
    });
    gruppen.append(head, grid);
  }

  const foot = el("div", "sectionhead");
  const fh = el("h2", null, "Sonstiges");
  fh.style.setProperty("--kapitel", FARBEN.schiefer.deep);
  foot.append(fh);
  const fgrid = el("div", "grid");
  fgrid.append(
    simpleTile("Meine Übungen", "Kalender der geübten Tage", "gruen", showKalender),
    simpleTile("Einstellungen", "Schrift, Farben und Töne", "schiefer", showPanel)
  );
  v.append(foot, fgrid);
}
