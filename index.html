function playText(stage, level) {
  const runden = [3, 4, 4][level];
  const bleibtSichtbar = level === 0;     // nur auf der leichten Stufe darf man nachlesen
  const setProgress = progressBar(stage, runden, "Geschichten");
  const p = promptText(stage, "", "");

  const erzaehlung = el("div", "geschichte");
  const words = el("div", "words");
  const weiter = el("button", "btn primary", "Ich habe es gelesen");
  weiter.style.maxWidth = "22rem";
  weiter.style.margin = "0 auto 1.2rem";
  stage.append(erzaehlung, weiter, words);

  const meinLauf = run;
  const sichtbar = () => run === meinLauf && document.body.contains(erzaehlung);
  const pool = frischeAuswahl("text", GESCHICHTEN, runden);
  let i = 0, f = 0;

  function lesen() {
    const g = pool[i];
    p.innerHTML = "Lesen Sie in Ruhe.";
    p.append(el("small", null, "Danach kommen Fragen dazu."));
    erzaehlung.textContent = g.text;
    erzaehlung.hidden = false;
    words.innerHTML = "";
    weiter.hidden = false;
    f = 0;
  }

  weiter.addEventListener("click", () => { weiter.hidden = true; frage(); });

  function frage() {
    const g = pool[i];
    if (!bleibtSichtbar) erzaehlung.hidden = true;
    const [text, loesung, falsch] = g.fragen[f];
    p.innerHTML = text;
    p.append(el("small", null, "Frage " + (f + 1) + " von " + g.fragen.length));
    words.innerHTML = "";
    shuffle([loesung, ...falsch]).forEach(a => {
      const b = el("button", "word", a);
      b.style.fontSize = "1.1rem";
      b.addEventListener("click", () => {
        if (a !== loesung) {
          fehler(b);
          maybeHint(() => [...words.children].find(x => x.textContent === loesung));
          return;
        }
        richtig();
        b.classList.add("ok");
        [...words.children].forEach(x => x.disabled = true);
        f++;
        setTimeout(() => {
          if (!sichtbar()) return;
          if (f < g.fragen.length) { frage(); return; }
          i++; setProgress(i);
          i >= runden ? finish() : lesen();
        }, 900);
      });
      words.append(b);
    });
  }

  setProgress(0);
  lesen();
}

/* ================= 18. Alles finden =================
   Visuelles Explorationstraining. Nach einem rechtshemisphärischen
   Schlaganfall bleibt die linke Seite oft unbeachtet, ohne dass es
   dem Betroffenen auffällt. Zwei Dinge sind deshalb gebaut wie in der
   Therapie üblich: ein farbiger Anker am linken Rand jeder Zeile, und
   eine Auswertung, die getrennt ausweist, was links und was rechts
   gefunden wurde — damit eine Schieflage überhaupt sichtbar wird. */

function playSuchen(stage, level) {
  const zeilen   = [3, 4, 5][level];
  /* Auf dem Handy passen keine elf Zeichen nebeneinander. Kürzere
     Zeilen und mitwachsende Zeichen — die Übung bleibt dieselbe, nur
     das Suchfeld ist schmaler. */
  const schmal   = window.innerWidth < 560;
  const proZeile = schmal ? [5, 6, 7][level] : [7, 9, 11][level];
  const anteil   = [.40, .32, .26][level];     // wie viele davon Ziele sind
  const maxRem   = [2.6, 2.2, 1.9][level];
  // nie breiter als der Platz je Zeichen hergibt
  const groesse  = "min(" + maxRem + "rem, " + (62 / proZeile).toFixed(1) + "vw)";

  const ablenker = ["🔵","🟢","🟡","🟣","🟤"];

  const feld = el("div", "suchfeld");
  const p = promptText(stage, "Tippen Sie jeden roten Punkt an.",
    "Jede Zeile am roten Balken links beginnen, dann nach rechts.");
  stage.append(feld);

  let ziele = 0, gefunden = 0;
  let linksGesamt = 0, rechtsGesamt = 0, linksGefunden = 0, rechtsGefunden = 0;
  const reihenfolge = [];                       // Fundreihenfolge, für die Auswertung

  for (let z = 0; z < zeilen; z++) {
    const zeile = el("div", "suchzeile");
    const anker = el("div", "anker");
    anker.setAttribute("aria-hidden", "true");
    zeile.append(anker);

    const inhalt = el("div", "suchinhalt");

    /* Ziele werden bewusst gleichmäßig auf beide Hälften verteilt.
       Sonst sagt die Auswertung „links alles gefunden“, nur weil links
       ohnehin fast alle lagen — und wäre damit wertlos. */
    const mitte = Math.floor(proZeile / 2);
    const linkePlaetze  = shuffle(Array.from({ length: mitte }, (_, k) => k));
    const rechtePlaetze = shuffle(Array.from({ length: proZeile - mitte }, (_, k) => k + mitte));
    const proSeite = Math.max(1, Math.round(proZeile * anteil / 2));
    const istZiel = new Array(proZeile).fill(false);
    linkePlaetze.slice(0, proSeite).forEach(k => istZiel[k] = true);
    rechtePlaetze.slice(0, proSeite).forEach(k => istZiel[k] = true);
    // Der äußerste linke Platz wird am ehesten übersehen — oft besetzen
    if (Math.random() < .6) istZiel[0] = true;

    istZiel.forEach((ziel, k) => {
      const linkeHaelfte = k < mitte;      // dieselbe Grenze wie bei der Platzierung
      if (!ziel) {
        const d = el("div", "zeichen", pick(ablenker));
        d.style.fontSize = groesse;
        inhalt.append(d);
        return;
      }
      ziele++;
      if (linkeHaelfte) linksGesamt++; else rechtsGesamt++;
      const b = el("button", "zeichen ziel", "🔴");
      b.style.fontSize = groesse;
      b.setAttribute("aria-label", "Roter Punkt, Zeile " + (z + 1));
      b.addEventListener("click", () => {
        if (b.classList.contains("weg")) return;
        richtig();
        b.classList.add("weg");
        b.disabled = true;
        gefunden++;
        if (linkeHaelfte) linksGefunden++; else rechtsGefunden++;
        reihenfolge.push(k);          // Spalte merken, für die Auswertung
        setProgress(gefunden);
        if (gefunden >= ziele) {
          p.innerHTML = "Alle gefunden.";
          p.append(el("small", null, " "));
          setTimeout(fertig, 700);
        }
      });
      inhalt.append(b);
    });

    zeile.append(inhalt);
    feld.append(zeile);
  }

  // Ablenker, die versehentlich angetippt werden, sollen etwas sagen
  feld.querySelectorAll(".zeichen:not(.ziel)").forEach(d => {
    d.addEventListener("pointerdown", () => { run.fehler++; sndNope(); });
  });

  const setProgress = progressBar(stage, ziele, "gefunden");
  stage.insertBefore(stage.lastChild, stage.firstChild);   // Balken nach oben
  setProgress(0);

  function fertig() {
    /* Auswertung: Wurde links genauso zuverlässig gefunden wie rechts?
       Und kam das Linke erst zum Schluss? Beides sind Hinweise, die
       in ein Therapiegespräch gehören — nicht mehr, aber auch nicht
       weniger. */
    /* Zwei Dinge sind aussagekräftig: ob links so zuverlässig gefunden
       wurde wie rechts, und ob der Blick von rechts nach links wanderte.
       Letzteres zeigt sich daran, dass die zuerst gefundenen Ziele im
       Mittel weiter rechts lagen als die später gefundenen. */
    const n = reihenfolge.length;
    const mittelwert = a => a.reduce((x, y) => x + y, 0) / (a.length || 1);
    const ersteHaelfte = reihenfolge.slice(0, Math.ceil(n / 2));
    const zweiteHaelfte = reihenfolge.slice(Math.ceil(n / 2));
    const vonRechts = n >= 6 && mittelwert(ersteHaelfte) > mittelwert(zweiteHaelfte) + 1;

    let satz = "Links " + linksGefunden + " von " + linksGesamt
             + ", rechts " + rechtsGefunden + " von " + rechtsGesamt + ".";
    if (linksGefunden < linksGesamt && linksGefunden / Math.max(1, linksGesamt) < rechtsGefunden / Math.max(1, rechtsGesamt))
      satz += " Links blieb mehr liegen als rechts.";
    else if (vonRechts)
      satz += " Gefunden wurde alles, aber der Blick ging von rechts nach links — beim nächsten Mal bewusst am roten Balken anfangen.";
    else
      satz += " Gleichmäßig und der Reihe nach abgesucht.";
    run.ergebnis = { wert: linksGesamt ? Math.round(linksGefunden / linksGesamt * 100) : 100,
                     einheit: "% links", text: satz };
    finish();
  }
}

/* ================= Übungskalender ================= */

const WOCHENTAGE = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const MONATE = ["Januar","Februar","März","April","Mai","Juni",
                "Juli","August","September","Oktober","November","Dezember"];

function alsText(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
         + "-" + String(d.getDate()).padStart(2, "0");
}

/* An wie vielen der letzten n Tage wurde geübt? Zählt Tage, nicht
   Übungen — wer an einem Tag fünfmal übt, hat trotzdem einen Tag. */
function tageInDenLetzten(n) {
  const heute = new Date();
  let zahl = 0;
  for (let i = 0; i < n; i++) {
    const d = new Date(heute);
    d.setDate(heute.getDate() - i);
    if (store.tage[alsText(d)]) zahl++;
  }
  return zahl;
}

function showKalender() {
  setAkzent("gruen");
  const v = screen("Meine Übungen", showHome);

  const wochen = 6;
  const heute = new Date();
  heute.setHours(0, 0, 0, 0);

  // Auf den Montag der laufenden Woche zurückgehen, dann sieben Wochen davor
  const versatz = (heute.getDay() + 6) % 7;          // Mo = 0
  const start = new Date(heute);
  start.setDate(heute.getDate() - versatz - (wochen - 1) * 7);

  const kal = el("div", "kalender");

  const bis = new Date(start);
  bis.setDate(start.getDate() + wochen * 7 - 1);
  const spanne = start.getMonth() === bis.getMonth()
    ? MONATE[bis.getMonth()] + " " + bis.getFullYear()
    : MONATE[start.getMonth()] + " bis " + MONATE[bis.getMonth()] + " " + bis.getFullYear();
  kal.append(el("p", "monat", spanne));

  const kopf = el("div", "wochentage");
  WOCHENTAGE.forEach(t => kopf.append(el("span", null, t)));
  kal.append(kopf);

  const gitter = el("div", "wochen");
  const heuteText = alsText(heute);
  for (let i = 0; i < wochen * 7; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const text = alsText(d);
    const zahl = store.tage[text] || 0;

    const zelle = el("div", "tag", String(d.getDate()));
    if (d > heute) {
      zelle.className = "tag kuenftig";
    } else if (zahl > 0) {
      zelle.className = "tag geuebt" + (zahl >= 3 ? " viel" : "");
      zelle.title = zahl === 1 ? "1 Übung" : zahl + " Übungen";
      zelle.setAttribute("aria-label", d.getDate() + ". " + MONATE[d.getMonth()]
        + ": " + zelle.title);
    } else {
      zelle.className = "tag leer";
      zelle.setAttribute("aria-label", d.getDate() + ". " + MONATE[d.getMonth()] + ": nichts eingetragen");
    }
    if (text === heuteText) zelle.classList.add("heute");
    gitter.append(zelle);
  }
  kal.append(gitter);

  const legende = el("div", "legende");
  const l1 = el("span"); l1.innerHTML = '<i class="voll"></i>geübt';
  const l2 = el("span"); l2.innerHTML = '<i style="border-style:dashed"></i>nichts eingetragen';
  legende.append(l1, l2);
  kal.append(legende);

  v.append(kal);

  // Zahlen darunter — nur Dinge, die wachsen können
  const geuebteTage = Object.keys(store.tage).filter(k => store.tage[k] > 0).length;
  const bilanz = el("div", "bilanz");
  [[store.gesamt, store.gesamt === 1 ? "Übung insgesamt" : "Übungen insgesamt"],
   [geuebteTage, geuebteTage === 1 ? "Tag geübt" : "Tage geübt"],
   [tageInDenLetzten(7), "davon in den letzten 7 Tagen"]
  ].forEach(([zahl, wort]) => {
    const k = el("div", "zahlkarte");
    k.append(el("b", null, String(zahl)), el("span", null, wort));
    bilanz.append(k);
  });
  v.append(bilanz);

  if (store.gesamt === 0) {
    v.append(el("p", "kalendertext",
      "Sobald Sie eine Übung abschließen, wird der Tag hier eingetragen. "
      + "Einträge verschwinden nicht wieder."));
  } else {
    v.append(el("p", "kalendertext",
      "Jeder abgeschlossene Tag bleibt stehen. Es gibt nichts zu verlieren "
      + "und keine Serie, die reißen kann."));
  }

  const panel = el("div", "panel");
  const ber = el("button", "btn", "Bericht zum Mitnehmen");
  ber.style.marginTop = "1.4rem";
  ber.addEventListener("click", () => showBericht(showKalender));
  panel.append(ber);
  const b = el("button", "btn primary", "Eine Übung machen");
  b.style.marginTop = "1.4rem";
  b.addEventListener("click", showHome);
  panel.append(b);
  v.append(panel);
}


/* ================= Bericht zum Mitnehmen =================
   Eine druckbare Übersicht für Arzt-, Therapie- oder Klinikgespräche.
   Er zählt, was geübt wurde, und zeigt Messwerte im Verlauf — aber er
   deutet nichts. Er ist kein Befund, und das steht auch darauf. */

const ALTE_NAMEN = { "Bilderpaare": "memory", "Domino anlegen": "domino" };
function eintragId(r) {
  if (r.id) return r.id;
  const g = GAMES.find(x => x.name === r.spiel);
  return g ? g.id : (ALTE_NAMEN[r.spiel] || r.spiel);
}
function spielName(id) { const g = GAMES.find(x => x.id === id); return g ? g.name : id; }
function datumDeutsch(t) { const [j, m, d] = t.split("-"); return d + "." + m + "." + j; }
function wochenbeginn(d) {
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function kalenderwoche(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const tag = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - tag);
  const j = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - j) / 86400000 + 1) / 7);
}
function dauerText(sek) {
  const m = Math.round(sek / 60);
  return m < 60 ? m + " Min." : Math.floor(m / 60) + " Std. " + (m % 60) + " Min.";
}

let berichtWochen = 4;
function showBericht(zurueck) {
  zurueck = zurueck || showKalender;
  setAkzent("schiefer");
  const v = screen("Bericht", zurueck);
  const b = el("div", "bericht");

  // ---- Bedienung (erscheint nicht auf dem Ausdruck) ----
  const steuer = el("div", "bericht-steuer");
  steuer.append(segment("Zeitraum", [4, 12, 0], ["4 Wochen", "12 Wochen", "Alles"], berichtWochen,
    x => { berichtWochen = x; showBericht(zurueck); }));
  const lab = el("label", "feldlabel", "Name für den Ausdruck — freiwillig, bleibt auf diesem Gerät");
  lab.htmlFor = "bericht-name";
  const name = el("input", "feld");
  name.type = "text"; name.id = "bericht-name"; name.autocomplete = "off";
  name.maxLength = 80; name.value = store.berichtName || "";
  steuer.append(lab, name);
  const druck = el("button", "btn primary", "Drucken oder als PDF sichern");
  druck.addEventListener("click", () => window.print());
  steuer.append(druck);
  b.append(steuer);

  // ---- Zeitraum bestimmen ----
  const heute = new Date(); heute.setHours(0, 0, 0, 0);
  const alleTage = Object.keys(store.tage).filter(t => store.tage[t] > 0).sort();
  let ab;
  if (berichtWochen) {
    ab = wochenbeginn(heute); ab.setDate(ab.getDate() - (berichtWochen - 1) * 7);
  } else {
    ab = alleTage.length ? wochenbeginn(new Date(alleTage[0] + "T12:00:00")) : wochenbeginn(heute);
  }
  const abText = alsText(ab), bisText = alsText(heute);
  const imZeitraum = t => t >= abText && t <= bisText;
  const tage = alleTage.filter(imZeitraum);
  const eintraege = store.log.filter(r => r && r.d && imZeitraum(r.d));
  const uebungen = tage.reduce((n, t) => n + store.tage[t], 0);
  const sekunden = eintraege.reduce((n, r) => n + (r.sek || 0), 0);
  const wochenZahl = Math.max(1, Math.round((heute - ab) / 6048e5 + (1 / 7)));

  // ---- Das Blatt ----
  const blatt = el("article", "bericht-blatt");
  const kopf = el("header", "bericht-kopf");
  kopf.append(el("p", "bericht-marke", "Kopf & Hand · Übungsbericht"));
  kopf.append(el("h2", null, "Übersicht der geübten Tage"));
  const nameZeile = el("p", "bericht-name");
  const setzeName = () => { nameZeile.textContent = store.berichtName ? "Für: " + store.berichtName : ""; nameZeile.hidden = !store.berichtName; };
  setzeName();
  name.addEventListener("input", () => { store.berichtName = name.value.trim(); save(); setzeName(); });
  kopf.append(nameZeile);
  kopf.append(el("p", "bericht-meta", "Zeitraum " + datumDeutsch(abText) + " bis " + datumDeutsch(bisText)
    + " · erstellt am " + datumDeutsch(bisText)));
  blatt.append(kopf);

  if (!uebungen) {
    blatt.append(el("p", "fliess", "Im gewählten Zeitraum wurde keine Übung abgeschlossen."));
  } else {
    // Kennzahlen
    const zus = el("div", "zusammenfassung");
    [[tage.length, tage.length === 1 ? "Übungstag" : "Übungstage"],
     [uebungen, uebungen === 1 ? "Übung abgeschlossen" : "Übungen abgeschlossen"],
     [dauerText(sekunden), "Übungszeit"],
     [(tage.length / wochenZahl).toLocaleString("de-DE", { maximumFractionDigits: 1 }), "Übungstage je Woche"]
    ].forEach(([z, w]) => {
      const k = el("div", "kennzahl");
      k.append(el("b", null, String(z)), el("span", null, w));
      zus.append(k);
    });
    blatt.append(zus);

    // Wochen
    blatt.append(el("h3", null, "Je Woche"));
    const tw = el("table", "berichttab");
    tw.innerHTML = "<thead><tr><th scope='col'>Woche</th><th scope='col' class='n'>Tage</th>"
      + "<th scope='col' class='n'>Übungen</th><th scope='col' class='n'>Zeit</th></tr></thead>";
    const tbw = el("tbody");
    for (let w = new Date(ab); w <= heute; w.setDate(w.getDate() + 7)) {
      const ende = new Date(w); ende.setDate(ende.getDate() + 6);
      const von = alsText(w), bis = alsText(ende);
      const inWoche = t => t >= von && t <= bis;
      const wt = tage.filter(inWoche);
      const wu = wt.reduce((n, t) => n + store.tage[t], 0);
      const ws = eintraege.filter(r => inWoche(r.d)).reduce((n, r) => n + (r.sek || 0), 0);
      const tr = el("tr");
      tr.append(el("td", null, "KW " + kalenderwoche(w) + " · " + datumDeutsch(von).slice(0, 6)
        + "–" + datumDeutsch(bis).slice(0, 6)));
      tr.append(el("td", "n", String(wt.length)), el("td", "n", String(wu)),
                el("td", "n", wu ? dauerText(ws) : "—"));
      tbw.append(tr);
    }
    tw.append(tbw);
    blatt.append(wrapTabelle(tw));

    // Übungen
    blatt.append(el("h3", null, "Je Übung"));
    const nachId = {};
    eintraege.forEach(r => { (nachId[eintragId(r)] = nachId[eintragId(r)] || []).push(r); });
    const tu = el("table", "berichttab");
    tu.innerHTML = "<thead><tr><th scope='col'>Übung</th><th scope='col' class='n'>Durchgänge</th>"
      + "<th scope='col'>Stufen</th><th scope='col'>Zuletzt</th><th scope='col'>Messwert erster → letzter</th></tr></thead>";
    const tbu = el("tbody");
    Object.keys(nachId).sort((a, z) => nachId[z].length - nachId[a].length).forEach(id => {
      const liste = nachId[id];                         // neueste zuerst
      const stufen = LEVELS.map(l => [l, liste.filter(r => r.stufe === l).length]).filter(x => x[1]);
      const mitWert = liste.filter(r => r.wert != null);
      let mess = "—";
      if (mitWert.length) {
        const erst = mitWert[mitWert.length - 1], letzt = mitWert[0];
        const fmt = r => r.wert + " " + (r.einheit || "") + " (" + r.stufe + ")";
        mess = mitWert.length === 1 ? fmt(erst) : fmt(erst) + " → " + fmt(letzt);
      }
      const tr = el("tr");
      tr.append(el("td", null, spielName(id)), el("td", "n", String(liste.length)),
        el("td", null, stufen.map(x => x[0] + " " + x[1]).join(", ")),
        el("td", null, datumDeutsch(liste[0].d)), el("td", null, mess));
      tbu.append(tr);
    });
    tu.append(tbu);
    blatt.append(wrapTabelle(tu));
  }

  const hinweis = el("p", "bericht-hinweis", "Dieser Bericht fasst selbstständig durchgeführte "
    + "Übungen zusammen. Er ist kein Befund und ersetzt keine fachliche Untersuchung. "
    + "Messwerte sind nur innerhalb derselben Übung und Stufe vergleichbar; "
    + "Übungen ohne Messwert zeigen nur, dass und wie oft geübt wurde.");
  blatt.append(hinweis);
  blatt.append(el("p", "bericht-fuss", "Kopf & Hand · Version " + VERSION
    + " · Alle Daten liegen nur auf dem Gerät, auf dem geübt wurde."));
  b.append(blatt);
  v.append(b);
}
function wrapTabelle(t) { const w = el("div", "scroller"); w.append(t); return w; }

  p.append(el("p", "note", stimme
    ? "Texte und Aufgaben werden mit der Stimme dieses Geräts vorgelesen. „Auf Tippen“: "
      + "mit dem Lautsprecher-Knopf oben rechts. „Von selbst“: bei jedem neuen Schritt."
    : "Auf diesem Gerät ist keine deutsche Stimme verfügbar, die ohne Internet arbeitet. "
      + "In den Systemeinstellungen unter Bedienungshilfen lässt sich meist eine nachladen."));
  p.append(segment("Vorlesen", ["aus","knopf","auto"], ["Aus","Auf Tippen","Von selbst"], store.vorlesen,
    x => { store.vorlesen = x; save(); aktualisiereVorleseKnopf(); if (x === "aus") stilleSprache(); }));
  if (stimme) {
    const probe = el("button", "btn", "Stimme probehören");
    probe.addEventListener("click", () => sage("So klingt die Vorlesestimme. Sie liest Aufgaben, Anleitungen und Geschichten vor."));
    p.append(probe);
  }

  p.append(el("h2", null, "Übungen"));
  p.append(el("p", "note", "Nach einem Schlaganfall ist die Sprache oft mitbetroffen. "
    + "Steht dieser Schalter auf „Aus“, verschwinden alle Übungen, die Lesen oder "
    + "Wortwissen verlangen — Sprichwörter, Liste merken, Gut zugehört und Namen merken. "
    + "Die übrigen kommen ohne Sprache aus."));
  p.append(segment("Übungen mit Sprache", [true,false], ["An","Aus"], store.sprache,
    x => { store.sprache = x; save(); }));
  p.append(el("p", "note", "Memory-Hilfe: Klappt es mehrmals hintereinander nicht, "
    + "zeigt die App alle Karten kurz zum Einprägen — auf Leicht nach drei, auf Mittel "
    + "nach vier, auf Schwer nach sechs Fehlgriffen. Ab Werk ist sie aus."));
  p.append(segment("Memory-Hilfe", [false,true], ["Aus","An"], store.memoryHilfe,
    x => { store.memoryHilfe = x; save(); }));

  p.append(el("h2", null, "Anleitung"));
  p.append(el("p", "note", "Jede Übung erklärt sich vor dem ersten Durchgang selbst. "
    + "Danach steht die Anleitung über das Fragezeichen oben rechts jederzeit bereit. "
    + "Wer sich Abläufe schwer merkt, stellt hier „Vor jeder Übung“ ein."));
  p.append(segment("Anleitung zeigen", ["erstes","immer"], ["Beim ersten Mal","Vor jeder Übung"],
    store.anleitung, x => { store.anleitung = x; save(); }));

  /* Der Verlauf liegt hinter einem eigenen Tipp. Nicht weil er geheim
     wäre, sondern damit beim Verstellen der Schrift keine Fehlerzahlen
     ins Blickfeld geraten. Wer sie sehen will, tippt einmal mehr. */
  p.append(el("h2", null, "Verlauf"));
  const hinweis = el("p", "note", "Eine Übersicht der abgeschlossenen Übungen — nützlich für Therapie- oder Arzttermine. In den Übungen selbst gibt es bewusst keine Punkte und keine Bewertung.");
  p.append(hinweis);
  const berichtKnopf = el("button", "btn", "Bericht zum Mitnehmen");
  berichtKnopf.addEventListener("click", () => showBericht(showPanel));
  p.append(berichtKnopf);

  const auf = el("button", "btn", "Verlauf anzeigen");
  const behaelter = el("div");
  behaelter.hidden = true;
  auf.addEventListener("click", () => {
    behaelter.hidden = !behaelter.hidden;
    auf.textContent = behaelter.hidden ? "Verlauf anzeigen" : "Verlauf ausblenden";
    auf.setAttribute("aria-expanded", String(!behaelter.hidden));
  });
  auf.setAttribute("aria-expanded", "false");

  if (!store.log.length) {
    behaelter.append(el("p", "note", "Noch keine Übung abgeschlossen."));
  } else {
    const sc = el("div", "scroller");
    const t = el("table", "log");
    t.innerHTML = "<thead><tr><th>Datum</th><th>Übung</th><th>Stufe</th>"
      + "<th class='n'>Ergebnis</th><th class='n'>Fehlgriffe</th><th class='n'>Dauer</th></tr></thead>";
    const tb = el("tbody");
    store.log.slice(0, 40).forEach(r => {
      const tr = el("tr");
      const d = r.d.split("-");
      tr.append(el("td", null, d[2] + "." + d[1] + "."), el("td", null, r.spiel), el("td", null, r.stufe));
      tr.append(el("td", "n", r.wert == null ? "—" : r.wert + " " + (r.einheit || "")));
      tr.append(el("td", "n", String(r.fehler)), el("td", "n", Math.floor(r.sek / 60) + ":" + String(r.sek % 60).padStart(2, "0")));
      tb.append(tr);
    });
    t.append(tb); sc.append(t); behaelter.append(sc);
  }
  p.append(auf, behaelter);

  p.append(el("h2", null, "Entwicklung"));
  p.append(el("p", "note", "Je Übung der erste und der letzte Wert. Für ein Arzt- oder "
    + "Therapiegespräch ist das aussagekräftiger als eine einzelne Sitzung."));
  const mitWert = {};
  store.log.forEach(r => {
    if (r.wert == null) return;
    (mitWert[r.spiel] = mitWert[r.spiel] || []).push(r);     // neueste zuerst
  });
  const namenMitWert = Object.keys(mitWert);
  if (!namenMitWert.length) {
    p.append(el("p", "note", "Noch keine Übung mit messbarem Ergebnis abgeschlossen."));
  } else {
    const sc2 = el("div", "scroller");
    const t2 = el("table", "log");
    t2.innerHTML = "<thead><tr><th>Übung</th><th class='n'>zuerst</th>"
      + "<th class='n'>zuletzt</th><th class='n'>Versuche</th></tr></thead>";
    const tb2 = el("tbody");
    namenMitWert.forEach(name => {
      const reihe = mitWert[name];
      const erst = reihe[reihe.length - 1], letzt = reihe[0];
      const tr = el("tr");
      tr.append(el("td", null, name));
      tr.append(el("td", "n", erst.wert + " " + (erst.einheit || "")));
      const bis = el("td", "n", letzt.wert + " " + (letzt.einheit || ""));
      if (reihe.length > 1 && letzt.wert > erst.wert) bis.style.color = "var(--akzent-deep)";
      tr.append(bis, el("td", "n", String(reihe.length)));
      tb2.append(tr);
    });
    t2.append(tb2); sc2.append(t2); p.append(sc2);
  }

  p.append(el("h2", null, "Daten"));
  p.append(el("p", "note", "Alles bleibt auf diesem Gerät gespeichert. Es werden keine Daten übertragen."));
  p.append(el("p", "note", "Weil nichts auf einem Server liegt, ist alles weg, wenn der Browser "
    + "seine Websitedaten löscht. Die Sicherung unten schützt davor."));

  const sichern = el("button", "btn", "Daten sichern");
  const feld = el("textarea", "sicherungsfeld");
  feld.hidden = true;
  feld.setAttribute("aria-label", "Gesicherte Daten");
  feld.rows = 4;
  const einlesen = el("button", "btn", "Gesicherte Daten einlesen");
  einlesen.hidden = true;

  sichern.addEventListener("click", () => {
    feld.hidden = false;
    feld.value = JSON.stringify({ gesamt: store.gesamt, tage: store.tage, log: store.log });
    feld.select();
    einlesen.hidden = false;
    hinweisFeld.textContent = "Kopieren Sie den Text und bewahren Sie ihn auf — "
      + "per E-Mail an sich selbst genügt. Zum Zurückholen den Text hier wieder "
      + "einfügen und auf „Gesicherte Daten einlesen“ tippen.";
  });
  einlesen.addEventListener("click", () => {
    let d;
    try { d = JSON.parse(feld.value); } catch { hinweisFeld.textContent = "Der Text lässt sich nicht lesen. Bitte vollständig einfügen."; return; }
    if (!d || typeof d !== "object" || typeof d.tage !== "object") {
      hinweisFeld.textContent = "Das sieht nicht nach einer Sicherung dieser App aus."; return;
    }
    if (!confirm("Gesicherte Daten einlesen? Der jetzige Kalender wird ersetzt.")) return;
    store.gesamt = +d.gesamt || 0;
    store.tage = d.tage || {};
    store.log = Array.isArray(d.log) ? d.log : [];
    save(); applySettings();
    hinweisFeld.textContent = "Eingelesen.";
    setTimeout(showPanel, 900);
  });
  const hinweisFeld = el("p", "note", "");
  p.append(sichern, feld, einlesen, hinweisFeld);
  const reset = el("button", "btn danger", "Alle Einträge löschen");
  reset.addEventListener("click", () => {
    if (!confirm("Wirklich alles löschen? Kalender und Verlauf gehen verloren.")) return;
    store.gesamt = 0; store.tage = {}; store.log = []; save(); applySettings(); showPanel();
  });
  p.append(reset);

  const ueber = el("button", "btn", "Über diese App");
  ueber.addEventListener("click", showAbout);
  p.append(ueber);

  v.append(p);
}

/* ================= Über diese App =================
   Impressum und Datenschutz. Für eine öffentlich erreichbare Seite in
   Deutschland ist ein Impressum Pflicht; die eckigen Klammern müssen
   vor der Veröffentlichung ersetzt werden. */

function showAbout() {
  setAkzent("schiefer");
  const v = screen("Über diese App", showPanel);
  const p = el("div", "panel");

  p.append(el("h2", null, "Was diese App ist"));
  p.append(el("p", "fliess", "Kopf & Hand ist eine Sammlung kleiner Übungen für Gedächtnis, "
    + "Sprache, Aufmerksamkeit und Handgeschicklichkeit. Sie ist für Menschen gemacht, "
    + "die nach einem Schlaganfall oder bei einer Demenzerkrankung im Alltag üben möchten."));
  p.append(el("p", "fliess", "Sie ist ausdrücklich kein Medizinprodukt und ersetzt keine "
    + "Ergotherapie, Logopädie oder ärztliche Behandlung. Die Übungen stellen keine Diagnose "
    + "und erlauben keinen Rückschluss auf den Krankheitsverlauf. Sprechen Sie die Nutzung "
    + "im Zweifel mit der behandelnden Praxis ab."));

  p.append(el("p", "note", "Version " + VERSION + " · Stand " + STAND));

  p.append(el("h2", null, "Datenschutz"));
  p.append(el("p", "fliess", "Diese App sendet keine Daten. Es gibt keine Nutzerkonten, "
    + "keine Anmeldung, keine Werbung und keine Analysedienste. Der Kalender, der Verlauf und "
    + "die Einstellungen werden ausschließlich im Speicher Ihres eigenen Browsers abgelegt "
    + "und verlassen dieses Gerät nicht. Das gilt auch für den Namen, den Sie im Bericht "
    + "eintragen können. Über „Alle Einträge löschen“ in den "
    + "Einstellungen entfernen Sie alles wieder."));
  p.append(el("p", "fliess", "Die Vorlesefunktion benutzt ausschließlich Stimmen, die auf "
    + "diesem Gerät installiert sind. Stimmen, die Text über das Internet an einen Dienst "
    + "schicken, werden bewusst nicht verwendet."));
  if (HOSTER) {
    p.append(el("p", "fliess", "Diese Seite wird bei " + HOSTER + " gehostet. Beim Aufruf "
      + "verarbeitet der Anbieter technisch bedingt Ihre IP-Adresse, wie bei jedem "
      + "Seitenaufruf im Internet."));
  } else {
    p.append(el("p", "fliess", "Beim Aufruf der Seite verarbeitet der Anbieter des "
      + "Webspeichers technisch bedingt Ihre IP-Adresse, wie bei jedem Seitenaufruf "
      + "im Internet."));
    const anbieter = el("div", "platzhalter");
    anbieter.append(el("b", null, "Noch auszufüllen"));
    anbieter.append(document.createTextNode("Im Quelltext ganz oben bei HOSTER eintragen, "
      + "wo die Seite liegt."));
    p.append(anbieter);
  }

  const vollstaendig = IMPRESSUM.name && IMPRESSUM.strasse && IMPRESSUM.ort && IMPRESSUM.email;

  if (!OEFFENTLICH && !vollstaendig) {
    // Nur persönlich weitergegeben — kein Impressumsabschnitt, aber gesagt,
    // woher die App kommt und an wen man sich wendet.
    p.append(el("h2", null, "Woher diese App kommt"));
    p.append(el("p", "fliess", "Diese Seite wird nicht öffentlich angeboten. Sie erreichen "
      + "sie über einen Link, den Sie persönlich bekommen haben. Wenn etwas nicht "
      + "funktioniert oder Sie einen Vorschlag haben, wenden Sie sich bitte an die Person, "
      + "von der Sie den Link erhalten haben."));
    const zurueck0 = el("button", "btn primary", "Zurück zu den Einstellungen");
    zurueck0.addEventListener("click", showPanel);
    p.append(zurueck0);
    v.append(p);
    return;
  }

  p.append(el("h2", null, "Impressum"));
  p.append(el("p", "fliess", "Angaben gemäß § 5 Digitale-Dienste-Gesetz:"));

  if (vollstaendig) {
    const a = el("p", "fliess");
    [IMPRESSUM.name, IMPRESSUM.strasse, IMPRESSUM.ort].forEach((zeile, i) => {
      if (i) a.append(el("br"));
      a.append(document.createTextNode(zeile));
    });
    p.append(a);
    const k = el("p", "fliess");
    k.append(document.createTextNode("E-Mail: "));
    const link = el("a", null, IMPRESSUM.email);
    link.href = "mailto:" + IMPRESSUM.email;
    k.append(link);
    if (IMPRESSUM.telefon) {
      k.append(el("br"));
      k.append(document.createTextNode("Telefon: " + IMPRESSUM.telefon));
    }
    p.append(k);
    p.append(el("p", "note", "Verantwortlich für den Inhalt: " + IMPRESSUM.name + "."));
  } else {
    const impressum = el("div", "platzhalter");
    impressum.append(el("b", null, "Noch auszufüllen"));
    impressum.append(document.createTextNode(
      "Im Quelltext ganz oben den Block IMPRESSUM ausfüllen: Vor- und Nachname, "
      + "Straße und Hausnummer, Postleitzahl und Ort, E-Mail-Adresse. "
      + "Danach erscheint hier automatisch ein vollständiges Impressum."));
    p.append(impressum);
    p.append(el("p", "note", "Eine ladungsfähige Anschrift ist vorgeschrieben; ein Postfach "
      + "genügt nicht. Wer das nicht öffentlich machen möchte, kann die Seite stattdessen "
      + "unveröffentlicht lassen und den Link nur gezielt weitergeben."));
  }

  const zurueck = el("button", "btn primary", "Zurück zu den Einstellungen");
  zurueck.addEventListener("click", showPanel);
  p.append(zurueck);

  v.append(p);
}

function segment(label, werte, namen, aktiv, fn) {
  const box = el("div");
  box.style.marginBottom = "1.3rem";
  const l = el("p", "note", label);
  l.style.margin = "0 0 .45rem";
  const seg = el("div", "seg");
  werte.forEach((w, i) => {
    const b = el("button", null, namen[i]);
    b.setAttribute("aria-pressed", String(w === aktiv));
    b.addEventListener("click", () => { fn(w); [...seg.children].forEach((c, j) => c.setAttribute("aria-pressed", String(werte[j] === w))); });
    seg.append(b);
  });
  box.append(l, seg);
  return box;
}

/* ================= Start ================= */

document.documentElement.lang = "de";   // damit Vorlesefunktionen deutsch sprechen
migriere();
rundeLaden();
applySettings();
showHome();
pruefeNeuigkeiten();

})();
</script>

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
