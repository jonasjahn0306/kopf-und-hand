<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="description" content="Kleine Übungen für Gedächtnis, Sprache und Handgeschicklichkeit — für Menschen nach einem Schlaganfall oder mit einer Demenzerkrankung. Ohne Zeitdruck und ohne Punkte.">
<meta name="theme-color" content="#EFF2EE">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kopf & Hand">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>Kopf &amp; Hand</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<style>
/* ------------------------------------------------------------------
   Kopf & Hand — Übungen für Kopf und Hände
   Bewusst ein einziges, helles Farbschema: für Menschen mit
   Sehschwäche ist heller Grund mit dunkler Schrift verlässlich
   lesbar. Statt Dunkelmodus gibt es einen Kontrast-Regler.
   ------------------------------------------------------------------ */

:root{
  --paper:      #EFF2EE;
  --paper-deep: #E6E8E6;
  --card:       #FFFFFF;
  --ink:        #16201A;
  --ink-2:      #4E5A51;
  --line:       #D2D5D2;
  --line-2:     #B7BCB8;
  --green:      #2A6B4C;
  --green-deep: #1D4C36;
  --green-soft: #DFEDE4;
  --honey:      #A66A15;
  --honey-soft: #F6E9D2;
  --sky:        #2B5E7E;
  --sky-soft:   #DCE9F0;
  --soil:       #A38A6A;
  --soil-deep:  #7C6650;
  --shadow:     0 2px 0 rgba(22,32,26,.06), 0 8px 24px -12px rgba(22,32,26,.28);
  --radius:     16px;
  --tap:        4.4rem;

  /* Jede Übung setzt ihre eigene Farbe in diese vier Marken ein.
     --wash tönt den ganzen Bildschirm ganz leicht mit ein, damit man
     schon am Hintergrund merkt, worin man gerade steckt. */
  --akzent:      #2A6B4C;
  --akzent-deep: #1D4C36;
  --akzent-soft: #DCEBE2;
  --wash:        #EFF2EE;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", "Noto Sans", sans-serif;
}

/* Kontrastverstärkung (Einstellungen) */
body.hc{
  --paper:      #FFFFFF;
  --paper-deep: #F0F0F0;
  --card:       #FFFFFF;
  --ink:        #000000;
  --ink-2:      #262626;
  --line:       #666666;
  --line-2:     #333333;
  --green:      #0B4A2E;
  --green-deep: #06301D;
  --green-soft: #FFFFFF;
  --honey:      #6B3D00;
  --honey-soft: #FFFFFF;
  --sky:        #123B54;
  --sky-soft:   #FFFFFF;
  --soil:       #6B573F;
  --soil-deep:  #3A2E20;
  --shadow:     0 0 0 rgba(0,0,0,0);
  /* Die Übungsfarben bleiben als Erkennungsmerkmal erhalten, die
     zarten Tönungen weichen aber reinem Weiß. */
  --akzent-soft: #FFFFFF;
  --wash:        #FFFFFF;
}
body.hc .tile{ --kachel-bg:#FFFFFF; --kachel-line:var(--line-2); }

html{ font-size:18px; -webkit-text-size-adjust:100%; }
html.t-gross{ font-size:21px; }
html.t-sehrgross{ font-size:25px; }

body{
  margin:0;
  background:var(--wash);
  color:var(--ink);
  font-family:var(--font);
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}

*{ box-sizing:border-box; }
button{ font:inherit; color:inherit; }
[hidden]{ display:none !important; }

/* Alles im Spielfeld ist Tippfläche, keine Textauswahl, kein Zoom-Ruckeln */
.stage, .tile, .btn, .card, .dom, .basket, .item{
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

:focus-visible{
  outline:4px solid var(--sky);
  outline-offset:3px;
}

/* ---------------- Gerüst ---------------- */

.app{
  max-width:60rem;
  margin:0 auto;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}

/* Die Navigationsleiste wächst bewusst NICHT mit dem Textgrößen-Regler:
   sie ist ohnehin großzügig bemessen, und mitwachsend würde sie bei
   „Sehr groß“ den Titel aus der Zeile drängen. */
.bar{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 14px;
  background:var(--wash);
  border-bottom:2px solid var(--line);
  position:sticky; top:0; z-index:20;
}

.bar h1{
  font-size:19px;
  font-weight:650;
  letter-spacing:.005em;
  margin:0;
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.iconbtn{
  display:inline-flex; align-items:center; gap:8px;
  min-height:56px; padding:0 17px;
  background:var(--card);
  border:2px solid var(--line-2);
  border-radius:12px;
  font-size:17px; font-weight:600;
  cursor:pointer;
}
.iconbtn:active{ transform:translateY(1px); }
.iconbtn svg{ width:25px; height:25px; flex:none; }

main{ flex:1; padding:1.1rem .8rem 3rem; }

/* ---------------- Startseite ---------------- */

.lede{
  margin:.2rem .2rem 1.5rem;
  font-size:1.05rem;
  color:var(--ink-2);
  max-width:38ch;
}

.sectionhead{
  display:flex; align-items:baseline; gap:.7rem;
  margin:2rem .2rem .9rem;
}
.sectionhead:first-of-type{ margin-top:.4rem; }
.sectionhead h2{
  font-size:1.35rem; font-weight:680; margin:0;
  letter-spacing:-.01em;
  color:var(--kapitel, var(--ink));
}
.sectionhead span{ font-size:.95rem; color:var(--ink-2); }

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(15.5rem, 1fr));
  gap:.85rem;
}

.tile{
  display:flex; align-items:center; gap:1rem;
  text-align:left;
  padding:1.15rem 1.1rem;
  background:var(--kachel-bg, var(--card));
  border:2px solid var(--kachel-line, var(--line));
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  cursor:pointer;
  min-height:6.2rem;
}
.tile:active{ transform:translateY(1px); }
.tile .ic{
  flex:none; width:3.4rem; height:3.4rem;
  display:grid; place-items:center;
  border-radius:12px;
  background:var(--kachel-farbe, var(--akzent));
  color:#fff;
}
.tile .ic svg{ width:2.1rem; height:2.1rem; }
.tile b{ display:block; font-size:1.18rem; font-weight:650; line-height:1.25; }
.tile small{ display:block; font-size:.94rem; color:var(--ink-2); margin-top:.2rem; }

/* ---------------- Schwierigkeit ---------------- */

.choose{ max-width:30rem; margin:1rem auto; }
.choose h2{ font-size:1.5rem; margin:0 0 .3rem; letter-spacing:-.01em; }
.choose p{ color:var(--ink-2); margin:0 0 1.6rem; font-size:1.05rem; }

.btn{
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  width:100%;
  min-height:var(--tap);
  padding:.9rem 1.2rem;
  margin-bottom:.75rem;
  background:var(--card);
  border:2px solid var(--line-2);
  border-radius:14px;
  font-size:1.2rem; font-weight:620;
  text-align:left;
  cursor:pointer;
  box-shadow:var(--shadow);
}
.btn:active{ transform:translateY(1px); }
.btn em{ font-style:normal; font-weight:500; font-size:.95rem; color:var(--ink-2); }
.btn.primary{
  background:var(--akzent); border-color:var(--akzent-deep); color:#fff;
  justify-content:center;
}
.btn.primary em{ color:rgba(255,255,255,.85); }

/* ---------------- Spielfläche ---------------- */

.stage{ max-width:52rem; margin:0 auto; }

.prompt{
  font-size:1.3rem; font-weight:620;
  text-align:center;
  margin:.2rem auto 1.2rem;
  max-width:32ch;
  text-wrap:balance;
  line-height:1.35;
}
.prompt small{ display:block; font-weight:500; font-size:.95rem; color:var(--ink-2); margin-top:.35rem; }

.progress{
  display:flex; align-items:center; gap:.7rem;
  margin:0 auto 1.3rem; max-width:32rem;
}
.progress .track{
  flex:1; height:.9rem;
  background:var(--akzent-soft);
  border:2px solid var(--line);
  border-radius:99px;
  overflow:hidden;
}
.progress .fill{
  height:100%; width:0;
  background:var(--akzent);
  border-radius:99px;
  transition:width .45s cubic-bezier(.2,.8,.3,1);
}
.progress .num{
  font-size:.98rem; font-weight:640; color:var(--ink-2);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}

/* Memory */
.memgrid{ display:grid; gap:.7rem; margin:0 auto; max-width:34rem; }
.card{
  position:relative;
  aspect-ratio:1/1;
  border:none; padding:0; background:none;
  cursor:pointer;
  perspective:900px;
}
.card .inner{
  position:absolute; inset:0;
  transition:transform .4s cubic-bezier(.3,.9,.35,1);
  transform-style:preserve-3d;
}
.card.open .inner, .card.done .inner{ transform:rotateY(180deg); }
.card .face{
  position:absolute; inset:0;
  display:grid; place-items:center;
  border-radius:14px;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  font-size:clamp(2rem, 11vw, 3.4rem);
  line-height:1;
}
.card .back{
  background:var(--akzent);
  border:2px solid var(--akzent-deep);
  color:rgba(255,255,255,.5);
}
.card .front{
  background:var(--card);
  border:2px solid var(--line-2);
  transform:rotateY(180deg);
}
.card.done .front{
  background:var(--akzent-soft);
  border-color:var(--akzent);
}
.card.done{ animation:pop .4s ease; }

/* Domino */
.domrow{
  display:flex; gap:.35rem; justify-content:center; align-items:center;
  flex-wrap:nowrap; margin-bottom:1.6rem; min-height:5.4rem;
  overflow-x:auto; padding-bottom:.3rem;
}
.domrow .lead{ font-size:1.5rem; color:var(--ink-2); padding:0 .2rem; }
.dom{
  display:flex;
  background:var(--card);
  border:2px solid var(--line-2);
  border-radius:10px;
  overflow:hidden;
  padding:0;
  cursor:pointer;
}
.dom.laid{ cursor:default; border-color:var(--line); }
.dom .half{
  width:2.6rem; height:2.6rem;
  flex:none;
  display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr);
  padding:.32rem;
}
.dom .half + .half{ border-left:2px solid var(--line-2); }
.dom .pip{
  width:.52rem; height:.52rem; border-radius:99px;
  background:var(--ink); place-self:center;
}
/* Handsteine sind die Tippfläche und deshalb deutlich größer */
.domhand{ display:flex; gap:.9rem; justify-content:center; flex-wrap:wrap; }
.domhand .dom{ border-width:3px; border-radius:14px; box-shadow:var(--shadow); }
.domhand .dom .half{ width:3.7rem; height:3.7rem; padding:.45rem; }
.domhand .dom .half + .half{ border-left-width:3px; }
.domhand .dom .pip{ width:.78rem; height:.78rem; }
.domhand .dom.hint{ animation:glow 1.1s ease infinite; border-color:var(--honey); }
.openend{
  display:inline-grid; place-items:center;
  padding:.15rem .6rem; border-radius:8px;
  background:var(--honey-soft); color:var(--honey);
  font-weight:700;
}

/* Domino-Kette mit zwei offenen Enden */
.kettenzeile{
  display:flex; align-items:center; gap:.5rem;
  margin-bottom:1.4rem;
}
.kettenzeile .domrow{ flex:1; margin-bottom:0; min-height:4.6rem; }
.endzone{
  flex:none;
  min-width:3.6rem; min-height:4.6rem;
  padding:.2rem .5rem;
  border:3px dashed var(--line-2);
  border-radius:12px;
  background:var(--card);
  font-size:1.6rem; font-weight:700;
  color:var(--ink-2);
  font-variant-numeric:tabular-nums;
  cursor:pointer;
}
.endzone.aktiv{
  border-style:solid; border-color:var(--akzent);
  background:var(--akzent-soft); color:var(--akzent-deep);
  animation:glow 1.2s ease infinite;
}
.domhand .dom.gewaehlt{
  border-color:var(--honey); border-width:4px;
  background:var(--honey-soft);
}
.zuruecknehmen{
  display:block; margin:0 auto 1.2rem;
  min-height:3.4rem; padding:0 1.2rem;
  background:var(--card); border:2px solid var(--line-2);
  border-radius:12px; font-size:1.02rem; font-weight:600; cursor:pointer;
}

/* Wortkacheln (Sprichwörter, Kategorien) */
.words{ display:grid; gap:.75rem; grid-template-columns:repeat(auto-fit,minmax(11rem,1fr)); max-width:38rem; margin:0 auto; }
.word{
  min-height:var(--tap);
  padding:1rem .9rem;
  background:var(--card);
  border:2px solid var(--line-2);
  border-radius:14px;
  font-size:1.25rem; font-weight:620;
  cursor:pointer;
  box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.3rem;
}
.word .pic{ font-size:2.2rem; line-height:1; }
.word.hint{ border-color:var(--honey); animation:glow 1.1s ease infinite; }
.word.ok{ background:var(--akzent-soft); border-color:var(--akzent); }
.saying{
  font-size:1.5rem; text-align:center; line-height:1.5;
  max-width:26ch; margin:0 auto 1.6rem; text-wrap:balance;
}
.saying .gap{
  display:inline-block; min-width:5.5rem;
  border-bottom:4px solid var(--honey);
  color:var(--akzent-deep); font-weight:700;
  text-align:center; white-space:nowrap;
}

/* Zahlenreihe + Ziele: freies Feld */
.field{
  position:relative;
  width:100%; aspect-ratio:4/3;
  max-height:62vh;
  background:var(--card);
  border:2px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
}
.spot{
  position:absolute;
  display:grid; place-items:center;
  border-radius:99px;
  background:var(--akzent-soft);
  border:3px solid var(--akzent);
  color:var(--akzent-deep);
  font-size:1.6rem; font-weight:700;
  cursor:pointer;
  font-variant-numeric:tabular-nums;
}
.spot.next{ border-color:var(--honey); }
.spot.gone{ animation:pop .34s ease forwards; pointer-events:none; }
.target{
  position:absolute; border-radius:99px;
  background:radial-gradient(circle at 34% 30%, var(--akzent-soft), var(--akzent) 62%);
  border:3px solid var(--akzent-deep);
  cursor:pointer;
}
.target::after{
  content:""; position:absolute; inset:22%;
  border:3px solid rgba(255,255,255,.75); border-radius:99px;
}
/* Ablenker auf der schwersten Stufe — klar andere Farbe, nicht nur
   ein anderer Ton, damit auch bei Farbsehschwäche unterscheidbar */
.target.stoerer{
  background:radial-gradient(circle at 34% 30%, #E8A08D, #B03A28 70%);
  border-color:#7C2416;
}
.target.stoerer::after{
  inset:30%; border-style:dashed;
}

/* Linie nachfahren */
.tracewrap{
  background:var(--card); border:2px solid var(--line);
  border-radius:var(--radius); box-shadow:var(--shadow);
  overflow:hidden; touch-action:none;
}
.tracewrap svg{ display:block; width:100%; height:auto; }

/* Sortieren */
.tray{
  display:flex; gap:.7rem; flex-wrap:wrap; justify-content:center;
  min-height:7rem; margin-bottom:1.4rem;
  padding:.8rem; border:2px dashed var(--line-2); border-radius:var(--radius);
}
.item{
  /* Bewusst kleiner als die übrigen Tippflächen: bei zwölf Dingen und
     großer Schrift müsste man sonst zwischen Ding und Kiste scrollen,
     was das Ziehen unmöglich macht. 3.6rem sind auch bei kleinster
     Einstellung noch deutlich über der empfohlenen Mindestgröße. */
  width:3.6rem; height:3.6rem;
  display:grid; place-items:center;
  font-size:2rem; line-height:1;
  background:var(--card);
  border:2px solid var(--line-2);
  border-radius:14px;
  cursor:grab;
  box-shadow:var(--shadow);
  touch-action:none;
}
.item.picked{ border-color:var(--honey); border-width:4px; background:var(--honey-soft); }
.item.dragging{ position:fixed; z-index:60; pointer-events:none; box-shadow:0 14px 30px -8px rgba(22,32,26,.5); }
.baskets{ display:flex; gap:.8rem; justify-content:center; flex-wrap:wrap; }
.basket{
  flex:1 1 9rem; max-width:15rem; min-height:9rem;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:.4rem;
  padding:.9rem .6rem;
  background:var(--paper-deep);
  border:3px solid var(--line-2);
  border-radius:var(--radius);
  cursor:pointer;
}
.basket b{ font-size:1.1rem; }
.basket.over{ border-color:var(--akzent); background:var(--akzent-soft); }
.basket .in{ display:flex; flex-wrap:wrap; gap:.25rem; justify-content:center; font-size:1.6rem; line-height:1; }

/* Rückmeldung */
.wrong{ animation:shake .42s ease; }
@keyframes shake{
  0%,100%{ transform:translateX(0) }
  20%{ transform:translateX(-9px) } 40%{ transform:translateX(9px) }
  60%{ transform:translateX(-5px) } 80%{ transform:translateX(5px) }
}
@keyframes pop{ 0%{ transform:scale(1) } 45%{ transform:scale(1.13) } 100%{ transform:scale(1) } }
@keyframes glow{ 0%,100%{ box-shadow:0 0 0 0 rgba(166,106,21,.45) } 50%{ box-shadow:0 0 0 12px rgba(166,106,21,0) } }
@keyframes rise{ from{ opacity:0; transform:translateY(14px) } to{ opacity:1; transform:none } }

/* Abschluss */
.done-screen{ text-align:center; max-width:26rem; margin:1.5rem auto; animation:rise .5s ease both; }
.done-screen .bloom{ width:9rem; height:9rem; margin:0 auto 1rem; }
.done-screen h2{ font-size:2rem; margin:0 0 .3rem; letter-spacing:-.015em; }
.done-screen p{ font-size:1.1rem; color:var(--ink-2); margin:0 0 2rem; }

/* Folge merken */
.spannegitter{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:.8rem;
  max-width:26rem; margin:0 auto;
}
.spannefeld{
  aspect-ratio:1/1;
  border:3px solid var(--line-2);
  border-radius:16px;
  background:var(--card);
  cursor:pointer;
  transition:background .12s, transform .12s;
}
.spannefeld.an{
  background:var(--akzent); border-color:var(--akzent-deep);
  transform:scale(1.04);
}
.spannefeld.getippt{ background:var(--akzent-soft); border-color:var(--akzent); }
.spannefeld:disabled{ cursor:default; }

/* Was fehlt */
.schau{
  display:grid; gap:.7rem; justify-content:center;
  grid-template-columns:repeat(auto-fit, minmax(4.6rem, 5.6rem));
  max-width:30rem; margin:0 auto 1.4rem;
}
.schau div{
  aspect-ratio:1/1;
  display:grid; place-items:center;
  font-size:2.6rem; line-height:1;
  background:var(--card);
  border:2px solid var(--line-2);
  border-radius:14px;
  box-shadow:var(--shadow);
  animation:rise .3s ease both;
}

/* Kopfrechnen */
.aufgabe{
  font-size:2.6rem; font-weight:700; text-align:center;
  letter-spacing:.01em; margin:.4rem auto 1.6rem;
  font-variant-numeric:tabular-nums;
  color:var(--akzent-deep);
}

/* Geld abzählen */
.betrag{
  text-align:center; margin:0 auto 1.2rem;
}
.betrag .soll{
  font-size:2.4rem; font-weight:700; color:var(--akzent-deep);
  font-variant-numeric:tabular-nums; display:block;
}
.betrag .ist{
  font-size:1.1rem; color:var(--ink-2); font-variant-numeric:tabular-nums;
}
.gelegt{
  display:flex; flex-wrap:wrap; gap:.4rem; justify-content:center;
  min-height:4.4rem; padding:.7rem;
  border:2px dashed var(--line-2); border-radius:var(--radius);
  margin-bottom:1.2rem;
}
.gelegt:empty::after{
  content:"";
}
.kasse{
  display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center;
}
.muenze, .schein{
  display:grid; place-items:center;
  border:3px solid;
  font-weight:700; font-variant-numeric:tabular-nums;
  cursor:pointer; line-height:1;
  box-shadow:var(--shadow);
}
.muenze{
  width:4.2rem; height:4.2rem; border-radius:99px;
  font-size:1rem;
  background:#F0E3C2; border-color:#B99B58; color:#5C4A20;
}
.muenze.silber{ background:#E6E8EA; border-color:#A8AEB4; color:#3A4046; }
.schein{
  width:5.4rem; height:3.2rem; border-radius:8px;
  font-size:1.1rem;
  background:#DCE9DA; border-color:#7FA37A; color:#2C4A28;
}
.schein.blau{ background:#D9E4F2; border-color:#7C97BE; color:#22405F; }
.gelegt .muenze, .gelegt .schein{ transform:scale(.72); margin:-.5rem; }

/* Übungskalender — die Belohnung ist der sichtbare Nachweis, dass man
   drangeblieben ist. Kein Punktestand, keine Serie, kein Vergleich:
   ein abgehakter Tag verschwindet nie wieder, ein ausgelassener wird
   nirgends angemahnt. */
.kalender{
  background:var(--card);
  border:2px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:1.2rem 1rem 1.4rem;
  max-width:34rem; margin:0 auto;
}
.kalender .monat{
  font-size:1.05rem; font-weight:650; color:var(--ink-2);
  margin:0 0 .8rem; text-align:center;
}
.wochentage, .wochen{
  display:grid; grid-template-columns:repeat(7, 1fr); gap:.35rem;
}
.wochentage{ margin-bottom:.45rem; }
.wochentage span{
  text-align:center; font-size:.82rem; font-weight:650;
  color:var(--ink-2); letter-spacing:.04em;
}
.tag{
  aspect-ratio:1/1;
  display:grid; place-items:center;
  border-radius:10px;
  border:2px solid var(--line);
  background:var(--paper-deep);
  font-size:.95rem; font-weight:600;
  color:var(--ink-2);
  font-variant-numeric:tabular-nums;
  position:relative;
}
.tag.leer{ background:transparent; border-color:transparent; color:var(--line-2); font-weight:500; }
.tag.geuebt{
  background:var(--akzent); border-color:var(--akzent-deep); color:#fff;
}
.tag.geuebt.viel{ box-shadow:inset 0 0 0 3px rgba(255,255,255,.45); }
.tag.heute{ outline:3px solid var(--honey); outline-offset:2px; }
.tag.kuenftig{ visibility:hidden; }

.bilanz{
  display:flex; gap:.7rem; flex-wrap:wrap;
  max-width:34rem; margin:1.1rem auto 0;
}
.bilanz .zahlkarte{
  flex:1 1 8rem;
  background:var(--card); border:2px solid var(--line);
  border-radius:14px; padding:.9rem 1rem;
  box-shadow:var(--shadow);
}
.bilanz .zahlkarte b{
  display:block; font-size:1.9rem; line-height:1.1;
  color:var(--akzent-deep); font-variant-numeric:tabular-nums;
}
.bilanz .zahlkarte span{ font-size:.94rem; color:var(--ink-2); }
.kalendertext{
  text-align:center; font-size:1.05rem; color:var(--ink-2);
  max-width:34rem; margin:1.2rem auto 0; text-wrap:balance;
}
.legende{
  display:flex; gap:1.1rem; justify-content:center; flex-wrap:wrap;
  margin-top:1rem; font-size:.9rem; color:var(--ink-2);
}
.legende i{
  display:inline-block; width:1rem; height:1rem; border-radius:5px;
  vertical-align:-.15em; margin-right:.35rem; border:2px solid var(--line);
}
.legende i.voll{ background:var(--akzent); border-color:var(--akzent-deep); }

/* Abschluss */
.haken{
  width:6.5rem; height:6.5rem; margin:0 auto 1.2rem;
  border-radius:99px; background:var(--akzent);
  display:grid; place-items:center;
  animation:pop .5s ease;
}
.haken svg{ width:3.4rem; height:3.4rem; stroke:#fff; }

/* Einstellungen / Verlauf */
.panel{ max-width:34rem; margin:0 auto; }
.panel h2{ font-size:1.4rem; margin:1.8rem 0 .8rem; letter-spacing:-.01em; }
.panel h2:first-child{ margin-top:.2rem; }
.panel p.note{ color:var(--ink-2); font-size:.98rem; margin:.2rem 0 1rem; }
.seg{ display:flex; gap:.5rem; }
.seg button{
  flex:1; min-height:3.6rem;
  background:var(--card); border:2px solid var(--line-2);
  border-radius:12px; font-size:1.05rem; font-weight:600; cursor:pointer;
}
.seg button[aria-pressed="true"]{ background:var(--akzent); border-color:var(--akzent-deep); color:#fff; }

table.log{ width:100%; border-collapse:collapse; font-size:1rem; }
table.log th, table.log td{ text-align:left; padding:.6rem .5rem; border-bottom:1px solid var(--line); }
table.log th{ font-size:.88rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-2); font-weight:650; }
table.log td.n{ text-align:right; font-variant-numeric:tabular-nums; }
.scroller{ overflow-x:auto; }

.danger{ border-color:var(--line-2); color:var(--ink-2); }

/* Noch auszufüllen — fällt absichtlich auf, damit es niemand übersieht */
.platzhalter{
  background:var(--honey-soft);
  border:2px dashed var(--honey);
  border-radius:12px;
  padding:.8rem 1rem;
  margin:.6rem 0 1rem;
  color:var(--ink);
  font-size:1rem;
}
.platzhalter b{ display:block; color:var(--honey); font-size:.9rem;
  text-transform:uppercase; letter-spacing:.06em; margin-bottom:.3rem; }
.panel p.fliess{ font-size:1.02rem; line-height:1.55; margin:.2rem 0 1rem; max-width:60ch; }
.panel a{ color:var(--akzent-deep); text-underline-offset:.2em; }

/* Auf schmalen Geräten — vor allem bei großer Schrift — stapeln,
   statt Überschrift und Beschreibung nebeneinander zu quetschen. */
@media (max-width:34rem){
  .sectionhead{ flex-direction:column; align-items:flex-start; gap:.15rem; }
  main{ padding-left:.6rem; padding-right:.6rem; }
  .bar{ gap:8px; padding:10px; }
  .bar h1{ font-size:17px; }
  .iconbtn{ padding:0 13px; gap:6px; }
}

@media (prefers-reduced-motion:reduce){
  *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}
</style>
</head>

<script>
(() => {
"use strict";

/* ==================================================================
   WIE WIRD DIE SEITE ANGEBOTEN?
   ------------------------------------------------------------------
   false = Der Link wird nur persönlich weitergegeben. Die Seite wird
           nicht beworben, nicht verlinkt und von Suchmaschinen
           ausgeschlossen. Es wird kein Impressum angezeigt.

   true  = Die Seite wird öffentlich angeboten. Dann muss der Block
           IMPRESSUM darunter ausgefüllt sein — für öffentlich
           angebotene Telemedien ist ein Impressum mit ladungsfähiger
           Anschrift vorgeschrieben (§ 5 DDG), ein Postfach genügt
           nicht. Fehlen die Angaben, weist die App darauf hin.
   ================================================================== */

const OEFFENTLICH = false;

const IMPRESSUM = {
  name:    "",          // z. B. "Jonas Mustermann"
  strasse: "",          // z. B. "Musterweg 12"
  ort:     "",          // z. B. "12345 Musterstadt"
  email:   "",          // z. B. "kontakt@example.de"
  telefon: ""           // freiwillig, darf leer bleiben
};

// Wo die Seite liegt — steht in der Datenschutzangabe.
const HOSTER = "GitHub, Inc. (GitHub Pages)";


/* ================================================================== */

const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, cls, txt) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
};
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.random() * a.length | 0];
const rint = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));

/* Merkt sich je Inhaltstopf, was zuletzt dran war, und meidet es beim
   nächsten Griff. So bringt auch der dritte Durchgang hintereinander
   noch Neues. Reicht der Vorrat nicht, wird die Sperre gelockert. */
const zuletztGenutzt = {};
function frischeAuswahl(topf, pool, anzahl, gedaechtnis) {
  const merke = gedaechtnis == null ? anzahl * 2 : gedaechtnis;
  const alt = zuletztGenutzt[topf] || [];
  let frei = pool.filter(x => !alt.includes(x));
  if (frei.length < anzahl) {
    // Vorrat zu klein: nur noch den letzten Durchgang meiden
    const kurz = alt.slice(0, anzahl);
    frei = pool.filter(x => !kurz.includes(x));
    if (frei.length < anzahl) frei = pool.slice();
  }
  const gewaehlt = shuffle(frei).slice(0, anzahl);
  zuletztGenutzt[topf] = [...gewaehlt, ...alt].slice(0, merke);
  return gewaehlt;
}

const view = $("#view"), backBtn = $("#back"), titleEl = $("#title"), gcount = $("#gcount");

/* ================= Speicher ================= */

const KEY = "kopfundhand.v1";
const store = Object.assign({
  gesamt: 0,          // abgeschlossene Übungen insgesamt
  tage: {},           // "2026-08-16" -> Anzahl an diesem Tag
  text: "normal",
  kontrast: "normal",
  ton: true,
  log: []            // { d:"2026-08-16", spiel:"Bilderpaare", stufe:"Mittel", fehler:3, sek:92 }
}, load());

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}

/* Übergang von der früheren Gartenfassung: die gesammelten Blumen
   waren nichts anderes als die Zahl abgeschlossener Übungen, und die
   Tage lassen sich aus dem Verlauf nachbilden. Niemand verliert also
   seinen bisherigen Stand. */
function migriere() {
  if (typeof store.tage !== "object" || store.tage === null) store.tage = {};
  if (!store.gesamt && store.flowers) store.gesamt = store.flowers;
  if (!Object.keys(store.tage).length && Array.isArray(store.log)) {
    store.log.forEach(r => { if (r && r.d) store.tage[r.d] = (store.tage[r.d] || 0) + 1; });
  }
  if ("flowers" in store) delete store.flowers;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {}
}
function applySettings() {
  document.documentElement.className = store.text === "normal" ? "" : "t-" + store.text;
  document.body.classList.toggle("hc", store.kontrast === "stark");
  gcount.textContent = store.gesamt;
  // Der Hintergrund hängt vom Kontrastmodus ab, also neu setzen
  if (typeof setAkzent === "function") setAkzent(aktuelleFarbe);
}

/* ================= Ton ================= */

let ac = null;
function tone(freq, dur = .16, type = "sine", gain = .16) {
  if (!store.ton) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, ac.currentTime);
    g.gain.linearRampToValueAtTime(gain, ac.currentTime + .02);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
    o.connect(g).connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur + .02);
  } catch {}
}
const sndGood = () => { tone(660, .13, "sine"); setTimeout(() => tone(880, .18, "sine"), 90); };
const sndNope = () => tone(196, .22, "triangle", .11);
const sndDone = () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .3, "sine", .13), i * 130)); };

/* ================= Navigation ================= */

let onBack = null;
function screen(title, backTo) {
  view.innerHTML = "";
  titleEl.textContent = title;
  onBack = backTo || null;
  backBtn.hidden = !backTo;
  window.scrollTo(0, 0);
  return view;
}
backBtn.addEventListener("click", () => { if (onBack) onBack(); });
$("#gardenbtn").addEventListener("click", showKalender);

/* ================= Startseite ================= */

const ICONS = {
  memory: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="6" width="11" height="15" rx="2.5"/><rect x="17" y="10" width="11" height="15" rx="2.5"/><path d="M20 17.5h5" stroke-linecap="round"/></svg>',
  domino: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="4" width="22" height="24" rx="3"/><path d="M5 16h22"/><circle cx="16" cy="10" r="1.9" fill="currentColor" stroke="none"/><circle cx="11" cy="22" r="1.9" fill="currentColor" stroke="none"/><circle cx="21" cy="22" r="1.9" fill="currentColor" stroke="none"/></svg>',
  spruch: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 8h24M4 14h16"/><path d="M4 20h8" stroke-dasharray="1 4"/><path d="M17 20h11"/><path d="M4 26h14"/></svg>',

  reihe: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 24l7-14 6 9 7-11"/><circle cx="6" cy="24" r="2.4" fill="currentColor" stroke="none"/><circle cx="13" cy="10" r="2.4" fill="currentColor" stroke="none"/><circle cx="19" cy="19" r="2.4" fill="currentColor" stroke="none"/><circle cx="26" cy="8" r="2.4" fill="currentColor" stroke="none"/></svg>',
  ziel: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="16" cy="16" r="11"/><circle cx="16" cy="16" r="5.5"/><circle cx="16" cy="16" r="1.6" fill="currentColor" stroke="none"/></svg>',
  linie: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 24C4 12 12 6 16 14s10 8 12 -6"/><circle cx="4" cy="24" r="2.6" fill="currentColor" stroke="none"/></svg>',
  spanne: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="4" width="10" height="10" rx="2"/><rect x="18" y="4" width="10" height="10" rx="2" fill="currentColor"/><rect x="4" y="18" width="10" height="10" rx="2" fill="currentColor"/><rect x="18" y="18" width="10" height="10" rx="2"/></svg>',
  fehlt: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="9" cy="9" r="5"/><circle cx="23" cy="9" r="5"/><circle cx="9" cy="23" r="5"/><circle cx="23" cy="23" r="5" stroke-dasharray="3 3"/></svg>',
  rechnen: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 10h9M9.5 5.5v9"/><path d="M18 10h9"/><path d="M5 22h9"/><path d="M18 19h9M18 25h9"/></svg>',
  geld: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8"/><circle cx="20" cy="20" r="8"/><path d="M12 8.5v7M10 10.5h3.4M10 13.5h3.4" stroke-linecap="round"/></svg>',
  sort: '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="18" width="11" height="10" rx="2"/><rect x="18" y="18" width="11" height="10" rx="2"/><circle cx="10" cy="7" r="3.6"/><path d="M19 4l6 6M25 4l-6 6"/></svg>'
};

/* Jede Übung hat ihre eigene Farbe. Das ist kein Schmuck: eine Farbe
   wird schneller wiedererkannt als ein Name, und wer sich Wörter
   schlecht merkt, findet „die blaue Übung“ trotzdem zuverlässig.
   Alle Töne sind dunkel genug für weiße Symbole darauf. */
const FARBEN = {
  petrol:    { akzent:"#14706B", deep:"#0C4F4B", soft:"#D3E9E7", wash:"#EFF7F6" },
  indigo:    { akzent:"#2F55A0", deep:"#1F3B72", soft:"#D8E1F3", wash:"#F0F4FB" },
  pflaume:   { akzent:"#8A3A72", deep:"#632851", soft:"#EEDBE8", wash:"#FAF1F7" },
  ocker:     { akzent:"#965C13", deep:"#6B400A", soft:"#F3E2C8", wash:"#FCF6EB" },
  altrosa:   { akzent:"#A93B57", deep:"#7C2940", soft:"#F4D9DF", wash:"#FCF0F2" },
  gruen:     { akzent:"#2A6B4C", deep:"#1D4C36", soft:"#DCEBE2", wash:"#F1F7F3" },
  stahlblau: { akzent:"#1E6584", deep:"#124559", soft:"#D5E6EE", wash:"#EFF6F9" },
  terrakotta:{ akzent:"#AB4F2C", deep:"#7C381D", soft:"#F5DDD2", wash:"#FCF2ED" },
  schiefer:  { akzent:"#4A5A66", deep:"#2F3B44", soft:"#DFE5E9", wash:"#F2F5F6" },
  moos:      { akzent:"#55701F", deep:"#3A4E13", soft:"#E0E8CE", wash:"#F5F8EE" },
  violett:   { akzent:"#6A4C9C", deep:"#4A3370", soft:"#E2DAF0", wash:"#F5F2FB" },
  bordeaux:  { akzent:"#8C2F3E", deep:"#65202C", soft:"#F0D6DA", wash:"#FCF1F2" },
  bronze:    { akzent:"#7C6428", deep:"#57451A", soft:"#EBE2C8", wash:"#F9F6EC" }
};
const STANDARD_WASH = "#EFF2EE";

let aktuelleFarbe = null;
function setAkzent(name) {
  aktuelleFarbe = name;
  const s = document.documentElement.style;
  const f = FARBEN[name];
  if (!f) {
    ["--akzent","--akzent-deep","--akzent-soft","--wash"].forEach(k => s.removeProperty(k));
    return;
  }
  s.setProperty("--akzent", f.akzent);
  s.setProperty("--akzent-deep", f.deep);
  s.setProperty("--akzent-soft", f.soft);
  // Im Starkkontrast bleibt der Hintergrund weiß
  s.setProperty("--wash", store.kontrast === "stark" ? "#FFFFFF" : f.wash);
}

const GAMES = [
  { id:"memory", art:"merken", icon:"memory", farbe:"petrol",     name:"Bilderpaare",     sub:"Gleiche Bilder wiederfinden",       trainiert:"Merkfähigkeit", run:playMemory },
  { id:"domino", art:"zahlen", icon:"domino", farbe:"indigo",     name:"Domino legen",    sub:"Alle Steine zu einer Kette",     trainiert:"Aufmerksamkeit", run:playDomino },
  { id:"spruch", art:"sprache", icon:"spruch", farbe:"pflaume",    name:"Sprichwörter",    sub:"Bekannte Sätze vervollständigen",   trainiert:"Sprache & Langzeitgedächtnis", run:playSpruch },
  { id:"odd",    art:"sprache", icon:"odd",    farbe:"ocker",      name:"Was passt nicht?",sub:"Den Ausreißer finden",              trainiert:"Begriffe ordnen", run:playOdd },
  { id:"reihe",  art:"zahlen", icon:"reihe",  farbe:"altrosa",    name:"Zahlenreihe",     sub:"Der Reihe nach antippen",           trainiert:"Konzentration", run:playReihe },
  { id:"ziel",   art:"hand", icon:"ziel",   farbe:"gruen",      name:"Ziele treffen",   sub:"Punkte genau antippen",             trainiert:"Zielgenauigkeit", run:playZiel },
  { id:"linie",  art:"hand", icon:"linie",  farbe:"stahlblau",  name:"Linie nachfahren",sub:"Mit dem Finger der Spur folgen",    trainiert:"Feinmotorik", run:playLinie },
  { id:"sort",   art:"hand", icon:"sort",   farbe:"terrakotta", name:"Einsortieren",    sub:"Nach Merkmalen ordnen", trainiert:"Greifen & Ziehen", run:playSort },
  { id:"spanne", art:"merken", icon:"spanne", farbe:"moos",       name:"Folge merken",    sub:"Aufleuchtende Felder nachtippen",   trainiert:"Merkspanne", run:playSpanne },
  { id:"fehlt",  art:"merken", icon:"fehlt",  farbe:"violett",    name:"Was fehlt?",      sub:"Ein Ding verschwindet",             trainiert:"Bildgedächtnis", run:playFehlt },
  { id:"rechnen",art:"zahlen", icon:"rechnen",farbe:"bordeaux",   name:"Kopfrechnen",     sub:"Ohne Papier ausrechnen",            trainiert:"Zahlenverständnis", run:playRechnen },
  { id:"geld",   art:"zahlen", icon:"geld",   farbe:"bronze",     name:"Geld abzählen",   sub:"Einen Betrag passend legen",        trainiert:"Rechnen & Planen", run:playGeld }
];

function faerbeKachel(t, farbe) {
  const f = FARBEN[farbe];
  if (!f) return;
  t.style.setProperty("--kachel-farbe", f.akzent);
  t.style.setProperty("--kachel-bg", f.wash);
  t.style.setProperty("--kachel-line", f.soft);
}

function showHome() {
  setAkzent(null);
  const v = screen("Kopf & Hand", null);
  const lede = el("p", "lede", "Kleine Übungen für zwischendurch. Es gibt kein Zeitlimit und nichts, was man verlieren kann.");
  v.append(lede);

  /* Vier kleinere Gruppen statt zweier großer: Bei zwölf Übungen ist
     eine Liste aus neun Kacheln unter einer Überschrift zu viel auf
     einmal — gerade für die Zielgruppe. */
  const kapitel = [
    ["merken",  "Merken",           "Behalten und Wiederfinden", "petrol"],
    ["sprache", "Sprache & Wissen", "Wörter und Begriffe",       "pflaume"],
    ["zahlen",  "Zahlen",           "Rechnen und Ordnen",        "bordeaux"],
    ["hand",    "Für die Hände",    "Bewegung und Genauigkeit",  "terrakotta"]
  ];
  for (const [art, h, sub, kfarbe] of kapitel) {
    const head = el("div", "sectionhead");
    const h2 = el("h2", null, h);
    h2.style.setProperty("--kapitel", FARBEN[kfarbe].deep);
    head.append(h2, el("span", null, sub));
    const grid = el("div", "grid");
    GAMES.filter(g => g.art === art).forEach(g => {
      const t = el("button", "tile");
      faerbeKachel(t, g.farbe);
      const ic = el("div", "ic"); ic.innerHTML = ICONS[g.icon];
      const box = el("div");
      box.append(el("b", null, g.name), el("small", null, g.sub));
      t.append(ic, box);
      t.addEventListener("click", () => chooseLevel(g));
      grid.append(t);
    });
    v.append(head, grid);
  }

  const foot = el("div", "sectionhead");
  const fh = el("h2", null, "Sonstiges");
  fh.style.setProperty("--kapitel", FARBEN.schiefer.deep);
  foot.append(fh);
  const fgrid = el("div", "grid");

const LEVELS = ["Leicht", "Mittel", "Schwerer"];

/* ================= Spielgerüst ================= */

let run = null;   // aktueller Durchgang

function startRun(game, level) {
  setAkzent(game.farbe);
  run = { game, level, fehler: 0, streak: 0, t0: Date.now() };
  const v = screen(game.name, () => chooseLevel(game));
  const stage = el("div", "stage");
  v.append(stage);
  game.run(stage, level);
}

/** Fortschrittsanzeige; gibt eine set(n)-Funktion zurück. */
function progressBar(parent, total, wort = "geschafft") {
  const wrap = el("div", "progress");
  const track = el("div", "track"), fill = el("div", "fill");
  const num = el("div", "num", "0 von " + total);
  track.append(fill); wrap.append(track, num);
  parent.append(wrap);
  return n => {
    fill.style.width = Math.round(n / total * 100) + "%";
    num.textContent = n + " von " + total + " " + wort;
  };
}

function promptText(parent, text, hint) {
  const p = el("div", "prompt", text);
  if (hint) p.append(el("small", null, hint));
  parent.append(p);
  return p;
}

function fehler(node) {
  run.fehler++; run.streak++;
  sndNope();
  if (node) { node.classList.remove("wrong"); void node.offsetWidth; node.classList.add("wrong"); }
}
function richtig() { run.streak = 0; sndGood(); }

/** Nach zwei Fehlern in Folge unauffällig helfen. */
function maybeHint(getNode) {
  if (run.streak < 2) return;
  const n = getNode();
  if (n) n.classList.add("hint");
}

function heuteAlsText() { return alsText(new Date()); }

function finish() {
  const g = run.game;
  const heute = heuteAlsText();
  store.gesamt++;
  store.tage[heute] = (store.tage[heute] || 0) + 1;
  store.log.unshift({
    d: heute,
    spiel: g.name,
    stufe: LEVELS[run.level],
    fehler: run.fehler,
    sek: Math.round((Date.now() - run.t0) / 1000)
  });
  store.log = store.log.slice(0, 200);
  save(); applySettings();
  sndDone();

  const v = screen(g.name, showHome);
  const box = el("div", "done-screen");

  const haken = el("div", "haken");
  haken.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" '
    + 'stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg>';
  box.append(haken);

  box.append(el("h2", null, pick(["Geschafft.", "Fertig.", "Alles gelöst.", "Das war's."])));

  /* Sachliche Rückmeldung statt Lob: was heute und diese Woche
     zusammengekommen ist. Beides kann nur wachsen. */
  const heuteZahl = store.tage[heute] || 1;
  const tageWoche = tageInDenLetzten(7);
  const zeilen = [];
  zeilen.push(heuteZahl === 1
    ? "Ihre erste Übung heute."
    : "Ihre " + heuteZahl + ". Übung heute.");
  zeilen.push(tageWoche === 1
    ? "In den letzten sieben Tagen an einem Tag geübt."
    : "In den letzten sieben Tagen an " + tageWoche + " Tagen geübt.");
  box.append(el("p", null, zeilen.join(" ")));

  const again = el("button", "btn primary", "Noch einmal");
  again.addEventListener("click", () => startRun(g, run.level));
  const other = el("button", "btn", "Andere Übung wählen");
  other.addEventListener("click", showHome);
  const kal = el("button", "btn", "Meine Übungen ansehen");
  kal.addEventListener("click", showKalender);
  box.append(again, other, kal);
  v.append(box);
}

const MEM_BILDER = [
  "🍎","🐕","🌻","🚗","☕","🔑","🏠","🐈","🌳","⭐","👓","🎩","🍞","🕰️","☂️","🚲",
  "🦋","🍐","🌙","🍄","🎈","🐟","🧦","🕯️","🍊","🚌","🌺","🎸","🧸","🍇","🐝","🦉",
  "🍋","🚂","🐇","🌷","🧢","🥕"
];

function playMemory(stage, level) {
  const paare = [3, 8, 12][level];
  /* Auf schmalen Geräten lieber mehr Reihen als mehr Spalten: sechs
     Spalten ergäben bei großer Schrift Karten unter der Mindestgröße
     für sicheres Treffen. */
  const schmal = window.innerWidth < 560;
  const spalten = level === 2 ? (schmal ? 4 : 6) : [3, 4][level];
  // Auf den hoeheren Stufen faellt die Aufdeckhilfe seltener
  const hilfeAb = [3, 4, 6][level];
  const setProgress = progressBar(stage, paare, "Paare");
  promptText(stage, "Finden Sie die gleichen Bilder.", "Tippen Sie zwei Karten an.");

  const bilder = frischeAuswahl("memory", MEM_BILDER, paare);
  const deck = shuffle([...bilder, ...bilder]);

  const grid = el("div", "memgrid");
  grid.style.gridTemplateColumns = "repeat(" + spalten + ", 1fr)";
  stage.append(grid);

  let offen = [], gefunden = 0, sperre = false;

  deck.forEach(bild => {
    const c = el("button", "card");
    c.dataset.bild = bild;
    c.setAttribute("aria-label", "Karte umdrehen");
    c.innerHTML = '<span class="inner"><span class="face back">?</span><span class="face front"></span></span>';
    $(".front", c).textContent = bild;
    c.addEventListener("click", () => {
      if (sperre || c.classList.contains("open") || c.classList.contains("done")) return;
      c.classList.add("open");
      tone(520, .09, "sine", .09);
      offen.push(c);
      if (offen.length < 2) return;

      sperre = true;
      const [a, b] = offen;
      if (a.dataset.bild === b.dataset.bild) {
        setTimeout(() => {
          a.classList.add("done"); b.classList.add("done");
          a.classList.remove("open"); b.classList.remove("open");
          gefunden++; setProgress(gefunden); richtig();
          offen = []; sperre = false;
          if (gefunden === paare) setTimeout(finish, 700);
        }, 380);
      } else {
        run.fehler++; run.streak++;
        setTimeout(() => {
          a.classList.remove("open"); b.classList.remove("open");
          offen = []; sperre = false;
          // Hilfe: nach drei Fehlgriffen kurz alles zeigen
          if (run.streak >= hilfeAb) {
            run.streak = 0;
            const zu = [...grid.querySelectorAll(".card:not(.done)")];
            zu.forEach(k => k.classList.add("open"));
            sperre = true;
            setTimeout(() => { zu.forEach(k => k.classList.remove("open")); sperre = false; }, 1600);
          }
        }, 1300);
      }
    });
    grid.append(c);
  });
  setProgress(0);
}

/* ================= 2. Domino ================= */

/* Bis Doppel-Sechs sind die Muster vertraut und werden auf einen Blick
   erkannt. Sieben bis Neun muss man wirklich zählen — genau das macht
   die schwerste Stufe schwer. */
const PIP_POS = {
  0: [], 1: ["2/2"], 2: ["1/1","3/3"], 3: ["1/1","2/2","3/3"],
  4: ["1/1","1/3","3/1","3/3"], 5: ["1/1","1/3","2/2","3/1","3/3"],
  6: ["1/1","1/3","2/1","2/3","3/1","3/3"],
  7: ["1/1","1/3","2/1","2/2","2/3","3/1","3/3"],
  8: ["1/1","1/2","1/3","2/1","2/2","2/3","3/1","3/3"],
  9: ["1/1","1/2","1/3","2/1","2/2","2/3","3/1","3/2","3/3"]
};
function dominoNode(a, b, klick) {
  const d = el(klick ? "button" : "div", "dom" + (klick ? "" : " laid"));
  d.setAttribute("aria-label", "Domino " + a + " und " + b);
  [a, b].forEach(v => {
    const h = el("div", "half");
    PIP_POS[v].forEach(p => {
      const [r, c] = p.split("/");
      const pip = el("div", "pip");
      pip.style.gridArea = r + "/" + c;
      h.append(pip);
    });
    d.append(h);
  });
  return d;
}

/* Aus dem Zuordnen wird ein Legespiel: Alle Steine der Hand müssen an
   eine Kette mit ZWEI offenen Enden. Wer unbedacht anlegt, verbaut sich
   das passende Ende — also muss man vorausdenken statt nur vergleichen.
   Die Kette wird rückwärts erzeugt, damit sie garantiert lösbar ist. */

function macheKette(handGr, maxWert) {
  const folge = [];
  let b = rint(0, maxWert);
  folge.push([rint(0, maxWert), b]);
  for (let i = 0; i < handGr; i++) {
    const c = rint(0, maxWert);
    folge.push([b, c]);
    b = c;
  }
  return folge;                      // [0] liegt schon, der Rest ist die Hand
}

function playDomino(stage, level) {
  const maxWert = [4, 6, 6][level];
  const handGr = [4, 6, 8][level];
  const ketten = 3;
  const gesamt = ketten * handGr;

  const setProgress = progressBar(stage, gesamt, "Steine gelegt");
  const p = promptText(stage, "", " ");

  const zeile = el("div", "kettenzeile");
  const links = el("button", "endzone");
  const rechts = el("button", "endzone");
  const reihe = el("div", "domrow");
  zeile.append(links, reihe, rechts);

  const zurueck = el("button", "zuruecknehmen", "Letzten Stein zurücknehmen");
  const hand = el("div", "domhand");
  stage.append(zeile, zurueck, hand);

  let kette = [], steine = [], verlauf = [], gewaehlt = null;
  let gelegt = 0, kettenNr = 0;

  const linksWert = () => kette[0][0];
  const rechtsWert = () => kette[kette.length - 1][1];
  const passt = (st, wert) => st[0] === wert || st[1] === wert;

  function neueKette() {
    const folge = macheKette(handGr, maxWert);
    kette = [folge[0]];
    steine = shuffle(folge.slice(1).map(st => Math.random() < .5 ? st : [st[1], st[0]]));
    verlauf = []; gewaehlt = null;
    kettenNr++;
    zeichne();
  }

  function zeichne() {
    // Kette
    reihe.innerHTML = "";
    kette.forEach(([a, b]) => reihe.append(dominoNode(a, b, false)));
    links.textContent = String(linksWert());
    rechts.textContent = String(rechtsWert());
    const st = gewaehlt == null ? null : steine[gewaehlt];
    links.classList.toggle("aktiv", !!st && passt(st, linksWert()));
    rechts.classList.toggle("aktiv", !!st && passt(st, rechtsWert()));
    links.setAttribute("aria-label", "Links anlegen, offene Zahl " + linksWert());
    rechts.setAttribute("aria-label", "Rechts anlegen, offene Zahl " + rechtsWert());

    // Hand
    hand.innerHTML = "";
    steine.forEach(([a, b], k) => {
      const d = dominoNode(a, b, true);
      if (k === gewaehlt) d.classList.add("gewaehlt");
      d.addEventListener("click", () => {
        gewaehlt = (gewaehlt === k) ? null : k;
        zeichne();
      });
      hand.append(d);
    });

    zurueck.hidden = verlauf.length === 0;
    text();
  }

  function text() {
    const st = gewaehlt == null ? null : steine[gewaehlt];
    p.innerHTML = "";
    if (steine.length === 0) {
      p.append(document.createTextNode("Kette fertig."));
      p.append(el("small", null, "Gleich kommt die nächste."));
      return;
    }
    const festgefahren = !steine.some(x => passt(x, linksWert()) || passt(x, rechtsWert()));
    if (festgefahren) {
      p.append(document.createTextNode("Kein Stein passt mehr."));
      p.append(el("small", null, "Nehmen Sie den letzten Stein zurück und legen Sie ihn anders an."));
      return;
    }
    if (!st) {
      p.append(document.createTextNode("Legen Sie alle Steine an die Kette."));
      p.append(el("small", null, "Kette " + kettenNr + " von " + ketten
        + " — noch " + steine.length + (steine.length === 1 ? " Stein" : " Steine")
        + ". Erst einen Stein antippen, dann ein Ende."));
      return;
    }
    const wohin = [];
    if (passt(st, linksWert())) wohin.push("links");
    if (passt(st, rechtsWert())) wohin.push("rechts");
    p.append(document.createTextNode(wohin.length
      ? "Wohin damit?"
      : "Dieser Stein passt an kein Ende."));
    p.append(el("small", null, wohin.length
      ? "Das passende Ende ist hervorgehoben."
      : "Tippen Sie einen anderen Stein an."));
  }

  function lege(seite) {
    if (gewaehlt == null) return;
    const st = steine[gewaehlt];
    const wert = seite === "links" ? linksWert() : rechtsWert();
    if (!passt(st, wert)) { fehler(seite === "links" ? links : rechts); return; }

    if (seite === "links") {
      kette.unshift(st[1] === wert ? [st[0], st[1]] : [st[1], st[0]]);
    } else {
      kette.push(st[0] === wert ? [st[0], st[1]] : [st[1], st[0]]);
    }
    verlauf.push({ seite, stein: st });
    steine.splice(gewaehlt, 1);
    gewaehlt = null;
    richtig();
    gelegt++; setProgress(gelegt);

    if (steine.length === 0) {
      zeichne();
      if (kettenNr >= ketten) { setTimeout(finish, 750); return; }
      setTimeout(() => { if (run && run.game.id === "domino") neueKette(); }, 1100);
      return;
    }
    zeichne();
  }

  links.addEventListener("click", () => lege("links"));
  rechts.addEventListener("click", () => lege("rechts"));

  zurueck.addEventListener("click", () => {
    const letzt = verlauf.pop();
    if (!letzt) return;
    if (letzt.seite === "links") kette.shift(); else kette.pop();
    steine.push(letzt.stein);
    gelegt = Math.max(0, gelegt - 1); setProgress(gelegt);
    gewaehlt = null;
    tone(300, .1, "sine", .09);
    zeichne();
  });

  setProgress(0);
  neueKette();
}

function playSpruch(stage, level) {
  const runden = 8;
  const anzahl = [3, 5, 6][level];
  const setProgress = progressBar(stage, runden, "gelöst");
  promptText(stage,
    level === 2 ? "Wie fängt dieses Sprichwort an?" : "Wie geht der Satz weiter?",
    level === 2 ? "Tippen Sie den passenden Anfang an." : "Tippen Sie das passende Wort an.");

  const satz = el("div", "saying");
  const words = el("div", "words");
  stage.append(satz, words);

  const pool = frischeAuswahl("spruch", SPRUECHE, runden);
  let i = 0;

  function rundeRueckwaerts(anfang, loesung) {
    satz.innerHTML = "";
    const gap = el("span", "gap", "…");
    satz.append(gap);
    satz.append(document.createTextNode(" " + loesung + "."));

    // Die falschen Anfänge stammen aus anderen Sprichwörtern
    const fremd = shuffle(SPRUECHE.map(x => x[0]).filter(a => a !== anfang));
    const opts = shuffle([anfang, ...fremd.slice(0, anzahl - 1)]);
    words.innerHTML = "";
    opts.forEach(a => {
      const b = el("button", "word", a);
      b.style.fontSize = "1.05rem";
      b.addEventListener("click", () => {
        if (a !== anfang) {
          fehler(b);
          maybeHint(() => [...words.children].find(x => x.textContent === anfang));
          return;
        }
        richtig();
        gap.textContent = anfang;
        gap.style.whiteSpace = "normal";
        b.classList.add("ok");
        [...words.children].forEach(x => x.disabled = true);
        i++; setProgress(i);
        setTimeout(() => { i >= runden ? finish() : runde(); }, 1300);
      });
      words.append(b);
    });
  }

  function runde() {
    const [anfang, loesung, falsch] = pool[i];

    /* Stufe 3 dreht die Aufgabe um: das Ende steht da, der Anfang wird
       gesucht. Vorwärts läuft der Abruf fast von selbst — rückwärts
       muss man die Redewendung wirklich aufrufen und prüfen. */
    if (level === 2) return rundeRueckwaerts(anfang, loesung);

    satz.innerHTML = "";
    satz.append(document.createTextNode(anfang + " "));
    const gap = el("span", "gap", " ");
    satz.append(gap);

    /* Die mitgelieferten falschen Wörter sind bewusst harmlos. Ab Stufe 2
       werden sie mit Lösungen ANDERER Sprichwörter aufgefüllt — lauter
       Wörter, die in einer Redewendung stehen könnten. Damit hilft das
       Sprachgefühl allein nicht mehr weiter, man muss den Spruch wirklich
       kennen. */
    let ablenker = shuffle(falsch.slice());
    if (level >= 1) {
      /* Nur Wörter derselben grammatischen Gestalt: Ein Verb neben einem
         Hauptwort („Liebe geht durch den rostet") schließt sich von
         selbst aus und wäre ein geschenkter Treffer. Groß- gegen
         Kleinschreibung ist im Deutschen dafür ein brauchbarer Test. */
      const istHauptwort = w => /^[A-ZÄÖÜ]/.test(w);
      const gestalt = istHauptwort(loesung);
      const fremd = shuffle(SPRUECHE.map(x => x[1]).filter(w =>
        w !== loesung && !falsch.includes(w) && istHauptwort(w) === gestalt
        && w.split(" ").length === loesung.split(" ").length));
      const anteil = level === 1 ? 2 : 4;
      ablenker = shuffle([...fremd.slice(0, anteil), ...ablenker]);
    }
    const opts = shuffle([loesung, ...ablenker.slice(0, anzahl - 1)]);
    words.innerHTML = "";
    opts.forEach(w => {
      const b = el("button", "word", w);
      b.addEventListener("click", () => {
        if (w !== loesung) {
          fehler(b);
          maybeHint(() => [...words.children].find(x => x.textContent === loesung));
          return;
        }
        richtig();
        gap.textContent = loesung;
        b.classList.add("ok");
        [...words.children].forEach(x => x.disabled = true);
        i++; setProgress(i);
        setTimeout(() => { i >= runden ? finish() : runde(); }, 1100);
      });
      words.append(b);
    });
  }
  runde(); setProgress(0);
}

   Ausreißer kommen? Nur eindeutige Paare — bei „Obst gegen Gemüse"

  "Süßigkeiten":     ["Backwaren"],
